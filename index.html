// ---------- Items that may change hands ----------
function giftable(key) {
  const it = ITEM(key); if (!it || it.bind) return false;
  if (key.startsWith('g:')) { const b = GEAR[parseG(key).base]; if (!b || b.ego || b.growth) return false; }
  return !['quest', 'keepsake'].includes(it.type);
}
function acceptItem(key) { try { return !!ITEM(key) && giftable(key); } catch (e) { return false; } }
function haveOffer(o) { if ((o.gold || 0) > ch.gold) return 'Not enough gold.'; for (const [k, q] of Object.entries(o.items || {})) if ((ch.inv[k] || 0) < q) return `You don’t have ${N(q)} ${ITEM(k).name}.`; return ''; }
function takeOffer(o) { ch.gold -= o.gold || 0; for (const [k, q] of Object.entries(o.items || {})) takeItem(k, q); dirty = true; }
function giveOffer(o, why) {
  const got = [], lost = [];
  if (o.gold) { ch.gold += +o.gold; got.push(N(o.gold) + ' gold'); }
  for (const [k, q] of Object.entries(o.items || {})) { if (acceptItem(k)) { addItem(k, +q, true); got.push(`${N(q)} ${ITEM(k).name}`); } else lost.push(k); }
  if (lost.length) addLog('sys', `${lost.length} unknown item${lost.length > 1 ? 's' : ''} from ${why} could not be received.`);
  dirty = true; save(); return got.join(', ') || 'nothing';
}
const offerText = o => [o.gold ? N(o.gold) + ' gold' : '', ...Object.entries(o.items || {}).map(([k, q]) => { let n = k; try { n = ITEM(k).name; } catch (e) { } return `${N(q)} ${n}`; })].filter(Boolean).join(', ') || 'nothing';
function offerEditor(o, max, actPrefix) {
  const keys = Object.keys(ch.inv).filter(k => ch.inv[k] > 0 && giftable(k)).sort((a, b) => ITEM(a).name.localeCompare(ITEM(b).name));
  const chosen = Object.entries(o.items);
  return `<div class="row" style="gap:6px;align-items:center"><label class="mute" for="${actPrefix}gold" style="font-size:14px">Gold</label><input id="${actPrefix}gold" type="number" min="0" step="1" value="${o.gold || 0}" style="width:9em" data-act-input="${actPrefix}gold"><span class="mute" style="font-size:13px">of ${N(ch.gold)}</span></div>
    <div class="grid" style="gap:4px;margin-top:8px">${chosen.length ? chosen.map(([k, q]) => `<div class="prow"><span>${itemIcon(k, 18)} ${rname(k)} <span class="mute" style="font-size:12px">have ${N(ch.inv[k] || 0)}</span></span><span class="row" style="gap:4px"><input type="number" min="1" step="1" max="${ch.inv[k] || 1}" value="${q}" style="width:6em" data-offerq="${actPrefix}|${esc(k)}" aria-label="Quantity"><button class="sm ghost" data-act="${actPrefix}rm" data-arg="${esc(k)}">×</button></span></div>`).join('') : '<p class="mute" style="margin:0;font-size:14px">No items added.</p>'}</div>
    ${chosen.length < max ? `<div class="row" style="gap:6px;margin-top:8px"><select id="${actPrefix}pick" aria-label="Item to add" style="flex:1;min-width:0"><option value="">Add an item…</option>${keys.filter(k => !(k in o.items)).map(k => `<option value="${esc(k)}">${esc(ITEM(k).name)} (${N(ch.inv[k])})</option>`).join('')}</select><button class="sm" data-act="${actPrefix}add">Add</button></div>` : `<p class="mute" style="font-size:13px">Up to ${max} different items.</p>`}`;
}
function readOffer(prefix, o) {
  const g = document.getElementById(prefix + 'gold'); if (g) o.gold = Math.max(0, Math.floor(+g.value || 0));
  document.querySelectorAll(`[data-offerq^="${prefix}|"]`).forEach(el => { const k = el.dataset.offerq.slice(prefix.length + 1); o.items[k] = Math.max(1, Math.floor(+el.value || 1)); });
  return o;
}

// ---------- Trading ----------
async function tradeSync() {
  try { soc.tradeList = await rpc('tf_trade_list'); } catch (e) { soc.err = e.message; return; }
  account.escrow = account.escrow || {};
  for (const t of soc.tradeList) {
    const esc_ = account.escrow[t.id];
    if (t.status === 'open') {
      if (esc_ && !t.my_ok) { returnEscrow(t.id, 'The trade with ' + t.with_name + ' changed, so your items came back. Check it again.'); }
      continue;
    }
    if (t.settled && !esc_) continue;
    if (esc_ && esc_.cid !== ch.id) continue; // the character holding the escrow must be playing
    try {
      const r = await rpc('tf_trade_settle', { p_id: t.id });
      if (r.already && !esc_) continue;
      if (r.status === 'done') {
        if (!esc_) { addLog('sys', `Trade with ${t.with_name} finished, but your side was never put up on this device.`); continue; }
        delete account.escrow[t.id];
        const got = giveOffer(r.theirs, 'a trade');
        addLog('lucky', `Trade with ${t.with_name} complete. You received ${got}.`); toast(`<b>Trade complete</b> · received ${esc(got)}`, 'verd');
      } else if (esc_) returnEscrow(t.id, `Trade with ${t.with_name} was cancelled. Your items came back.`);
    } catch (e) { soc.err = e.message; }
  }
  save();
}
function returnEscrow(id, msg) {
  const e = account.escrow && account.escrow[id]; if (!e) return;
  const owner = account.slots.find(c => c && c.id === e.cid);
  if (owner && owner !== ch) { owner.gold += e.offer.gold || 0; for (const [k, q] of Object.entries(e.offer.items || {})) owner.inv[k] = (owner.inv[k] || 0) + q; }
  else { ch.gold += e.offer.gold || 0; for (const [k, q] of Object.entries(e.offer.items || {})) addItem(k, q, true); }
  delete account.escrow[id]; addLog('sys', msg); toast(esc(msg)); dirty = true; save();
}
function tabTrade() {
  const g = socGate(); if (g) return `<h2>Trades</h2>${g}`;
  if (soc.tradeList === null || soc.tradeList === undefined) { tradeSync().then(() => tab === 'trade' && renderMain()); return '<h2>Trades</h2><p class="mute">Loading…</p>'; }
  const list = soc.tradeList, t = list.find(x => x.id === soc.sel) || list.find(x => x.status === 'open');
  if (t && soc.sel !== t.id) { soc.sel = t.id; soc.offer = null; }
  if (t && t.status === 'open' && !soc.offer) soc.offer = { id: t.id, gold: +t.mine.gold || 0, items: Object.assign({}, t.mine.items) };
  const esc_ = t && account.escrow && account.escrow[t.id];
  const changed = t && soc.offer && JSON.stringify({ g: soc.offer.gold, i: soc.offer.items }) !== JSON.stringify({ g: +t.mine.gold || 0, i: t.mine.items });
  const pane = !t ? '<p class="mute">No trade open. Start one from your Friends list.</p>' : `<div class="card" style="margin-top:12px">
      <div class="spread"><h3>Trade with ${esc(t.with_name)}</h3><span class="chip ${t.status === 'done' ? 'on' : ''}">${t.status === 'open' ? (t.my_ok && t.their_ok ? 'Done' : t.my_ok ? 'You confirmed' : t.their_ok ? 'They confirmed' : 'Open') : t.status === 'done' ? 'Complete' : 'Cancelled'}</span></div>
      <p class="mute" style="font-size:13px;margin:4px 0 10px">How it’s kept fair: both offers are on the server, and any change to either offer cancels both confirmations. The trade happens only when you both confirm the same offers. While you’re confirmed, your side is set aside so you can’t spend it twice.</p>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));align-items:start">
        <div><h4 class="shopgrp">Your offer ${t.my_ok ? '<span class="verd">✓ confirmed</span>' : ''}</h4>${t.status === 'open' && !t.my_ok ? offerEditor(soc.offer, 8, 'tr') + `<div class="row" style="margin-top:8px"><button class="${changed ? 'pri' : ''}" data-act="trsave" ${changed ? '' : 'disabled'}>Update my offer</button></div>` : `<p>${esc(offerText(t.mine))}</p>`}</div>
        <div><h4 class="shopgrp">${esc(t.with_name)} offers ${t.their_ok ? '<span class="verd">✓ confirmed</span>' : ''}</h4><p>${esc(offerText(t.theirs))}</p></div>
      </div>
      <div class="err" id="trerr"></div>
      ${t.status === 'open' ? `<div class="row" style="margin-top:10px">${t.my_ok ? `<button data-act="trunconfirm" data-arg="${t.id}">Take back my confirmation</button>` : `<button class="pri" data-act="trconfirm" data-arg="${t.id}" ${changed ? 'disabled title="Update your offer first"' : ''}>Confirm this trade</button>`}<button class="ghost" data-act="trcancel" data-arg="${t.id}">Cancel trade</button><button class="sm" data-act="trrefresh">Refresh</button></div>`
        : t.status === 'done' && esc_ && esc_.cid !== ch.id ? `<p class="mute">Switch to ${esc((account.slots.find(c => c && c.id === esc_.cid) || {}).name || 'the character who confirmed')} to receive this trade.</p>` : ''}
    </div>`;
  return `<div class="spread"><h2>Trades</h2><button class="sm" data-act="trrefresh">Refresh</button></div>${errBox()}
    ${list.length ? `<div class="row" style="gap:6px;margin-top:10px">${list.map(x => `<button class="chip ${t && x.id === t.id ? 'on' : ''}" data-act="trsel" data-arg="${x.id}">${esc(x.with_name)} · ${x.status === 'open' ? 'open' : x.status === 'done' ? 'complete' : 'cancelled'}</button>`).join('')}</div>` : ''}${pane}`;
}

      <div class="row"><button class="pri" data-act="admsend">Send letter</button></div><div class="err" id="admerr"></div>
      <p class="mute" style="font-size:12px;margin:0">Letters to everyone reach every player who has picked a display name. Attachments are created by the server, not taken from your inventory.</p>
    </div></details>`;
}
function readAdmin() {
  const d = adminDraft, v = id => (document.getElementById(id) || {}).value;
  d.to = v('admto') || ''; d.subject = v('admsubj') || ''; d.body = v('admbody') || ''; d.gold = Math.max(0, Math.floor(+v('admgold') || 0)); d.open = true;
  document.querySelectorAll('[data-admq]').forEach(el => { d.items[el.dataset.admq] = Math.max(1, Math.floor(+el.value || 1)); });
  return d;
}
Object.assign(SOCIAL_HANDLERS, {
  admadd: () => { const d = readAdmin(), k = $('#admpick').value; if (k) d.items[k] = 1; renderMain(); },
  admrm: k => { readAdmin(); delete adminDraft.items[k]; renderMain(); },
  admsend: async () => {
    const d = readAdmin();
    if (!d.subject.trim()) { socErr('admerr', 'Add a subject.'); return; }
    const who = d.to.trim() ? d.to.trim() : 'EVERY player';
    if (!confirm(`Send "${d.subject}" to ${who}?`)) return;
    try {
      const n = await rpc('tf_admin_mail_to', { p_name: d.to.trim() || null, p_subject: d.subject, p_body: d.body, p_gift: { gold: d.gold, items: d.items } });
      toast(`Letter sent to ${n} player${n === 1 ? '' : 's'}.`, 'verd'); adminDraft = { to: '', subject: '', body: '', gold: 0, items: {} }; soc.mailList = null; await socRefresh(); renderMain();
    } catch (e) { socErr('admerr', e); }
  },
  chatdel: async id => { try { await rpc('tf_chat_delete', { p_id: +id }); const l = soc.msgs[soc.chan] || []; const i = l.findIndex(m => m.id === +id); if (i >= 0) l.splice(i, 1); chatPaint(false); } catch (e) { toast(esc(e.message)); } },
});

// ============================================================
// AUCTION HOUSE (Phase 11): listings, buy orders, price history.
// Every trade settles on the server; goods and gold arrive by Mailbox.
// ============================================================
let ah = { browse: null, loading: false, sel: null, item: null, itemFor: null, mine: null, q: '', err: '', at: 0, busy: false };
const AH_TAX = 0.05;
const ahName = k => { try { return ITEM(k).name; } catch (e) { return k; } };
const ahKnown = k => { try { return acceptItem(k); } catch (e) { return false; } };

async function ahLoad(force) {
  if (ah.loading || (!force && ah.browse && Date.now() - ah.at < 30000)) return;
  ah.loading = true; ah.err = '';
  try {
    const [b, m] = await Promise.all([rpc('tf_ah_browse'), rpc('tf_ah_mine')]);
    ah.browse = (b || []).filter(r => ahKnown(r.item)); ah.mine = m || { listings: [], orders: [] }; ah.at = Date.now();
    if (ah.sel) await ahLoadItem(ah.sel);
  } catch (e) { ah.err = e.message || String(e); ah.browse = ah.browse || []; }
  ah.loading = false; if (screen === 'game' && tab === 'auction') renderMain();
}
async function ahLoadItem(k) {
  try { ah.item = await rpc('tf_ah_item', { p_item: k }); ah.itemFor = k; } catch (e) { ah.err = e.message || String(e); }
}

// A small price chart: daily average with the day's low–high range, and volume bars.
function ahChart(hist) {
  if (!hist || !hist.length) return '<p class="mute" style="font-size:14px;margin:6px 0">No sales in the last 14 days yet.</p>';
  const W = 520, H = 150, P = 30, n = hist.length, hi = Math.max(...hist.map(h => +h.high)), lo = Math.min(...hist.map(h => +h.low)), vmax = Math.max(...hist.map(h => +h.vol));
  const x = i => P + (n === 1 ? (W - 2 * P) / 2 : i * (W - 2 * P) / (n - 1)), y = v => hi === lo ? H / 2 : 12 + (H - 44) * (1 - (v - lo) / (hi - lo));
  const band = hist.map((h, i) => `${x(i)},${y(+h.high)}`).join(' ') + ' ' + hist.map((h, i) => `${x(i)},${y(+h.low)}`).reverse().join(' ');
  const line = hist.map((h, i) => `${x(i)},${y(+h.avg)}`).join(' ');
  const bars = hist.map((h, i) => `<rect x="${x(i) - 5}" y="${H - 22 - 18 * (+h.vol / vmax)}" width="10" height="${18 * (+h.vol / vmax)}" fill="var(--line)"><title>${N(+h.vol)} sold</title></rect>`).join('');
  const pts = hist.map((h, i) => `<circle cx="${x(i)}" cy="${y(+h.avg)}" r="3" fill="var(--gold)"><title>${new Date(h.day).toLocaleDateString()}: avg ${N(+h.avg)}g (${N(+h.low)}–${N(+h.high)}), ${N(+h.vol)} sold</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto" role="img" aria-label="Price history">
    <polygon points="${band}" fill="var(--gold)" opacity=".14"/>${bars}<polyline points="${line}" fill="none" stroke="var(--gold)" stroke-width="2"/>${pts}
    <text x="4" y="${y(hi) + 4}" font-size="11" fill="var(--mute)">${N(hi)}</text><text x="4" y="${y(lo) + 4}" font-size="11" fill="var(--mute)">${N(lo)}</text>
    <text x="${P}" y="${H - 4}" font-size="11" fill="var(--mute)">${new Date(hist[0].day).toLocaleDateString([], { month: 'short', day: 'numeric' })}</text>
    <text x="${W - P}" y="${H - 4}" font-size="11" fill="var(--mute)" text-anchor="end">${new Date(hist[n - 1].day).toLocaleDateString([], { month: 'short', day: 'numeric' })}</text></svg>`;
}

function tabAuction() {
  const g = socGate(); if (g) return `<h2>Auction House</h2>${g}`;
  if (!ah.browse && !ah.loading) ahLoad(true);
  const q = ah.q.trim().toLowerCase();
  let rows = (ah.browse || []).slice();
  if (q) {
    rows = rows.filter(r => ahName(r.item).toLowerCase().includes(q));
    const listed = new Set(rows.map(r => r.item));
    const extra = [...new Set([...Object.keys(ch.inv), ...RES.map(r => r.id), ...Object.keys(ITEMS)])].filter(k => !listed.has(k) && ahKnown(k) && ahName(k).toLowerCase().includes(q)).slice(0, 12);
    rows = rows.concat(extra.map(k => ({ item: k, empty: true })));
  }
  rows.sort((a, b) => (a.empty - b.empty) || ahName(a.item).localeCompare(ahName(b.item)));
  const bag = Object.keys(ch.inv).filter(k => ch.inv[k] > 0 && giftable(k)).sort((a, b) => ahName(a).localeCompare(ahName(b)));
  const list = !ah.browse ? '<p class="mute">Loading the market…</p>' : !rows.length ? `<p class="mute">${q ? 'Nothing matches.' : 'The market is empty. Be the first to list something!'}</p>`
    : `<div class="ahgrid"><div class="ahhead"><span>Item</span><span class="num">Lowest</span><span class="num hide-s">For sale</span><span class="num">Best bid</span><span class="num hide-s">Last sale</span></div>${rows.slice(0, 120).map(r => `<button class="ahrow ${ah.sel === r.item ? 'on' : ''}" data-act="ahsel" data-arg="${esc(r.item)}"><span class="ahname">${itemIcon(r.item, 20)} ${rname(r.item)}${ch.inv[r.item] ? ` <span class="mute" style="font-size:12px">(you have ${N(ch.inv[r.item])})</span>` : ''}</span><span class="num gold">${r.low ? N(+r.low) + 'g' : '–'}</span><span class="num hide-s">${+r.avail ? N(+r.avail) : '–'}</span><span class="num">${r.bid ? N(+r.bid) + 'g' : '–'}</span><span class="num hide-s mute">${r.last ? N(+r.last) + 'g' : '–'}</span></button>`).join('')}</div>`;
  const mine = ah.mine && (ah.mine.listings.length || ah.mine.orders.length) ? `<div class="card" style="margin-top:12px"><h3>Your listings and orders</h3><div class="grid" style="gap:6px;margin-top:8px">
      ${ah.mine.listings.map(l => `<div class="prow"><span>Selling ${N(+l.qty)} ${rname(l.item)} at <b class="gold">${N(+l.price)}g</b> <span class="mute" style="font-size:12px">ends ${ahEnds(l.ends)}</span></span><button class="sm ghost" data-act="ahcancell" data-arg="${l.id}">Cancel</button></div>`).join('')}
      ${ah.mine.orders.map(o => `<div class="prow"><span>Buying ${N(+o.qty)} ${rname(o.item)} at <b class="gold">${N(+o.price)}g</b> <span class="mute" style="font-size:12px">ends ${ahEnds(o.ends)}</span></span><button class="sm ghost" data-act="ahcancelo" data-arg="${o.id}">Cancel</button></div>`).join('')}</div>
      <p class="mute" style="font-size:12px;margin:8px 0 0">Cancelled or expired listings and orders return what's left through your Mailbox.</p></div>` : '';
  return `<div class="spread"><h2>Auction House</h2><span class="row" style="gap:6px"><span class="mute num" style="font-size:14px">Gold <b class="gold" data-live="gold"></b></span><button class="sm" data-act="ahrefresh" ${ah.loading ? 'disabled' : ''}>${ah.loading ? 'Loading…' : 'Refresh'}</button></span></div>
    <p class="mute" style="margin:4px 0 10px">Buy from other players, list your own items, or post a buy order. Purchases and sale proceeds arrive in your <button class="linkbtn" data-act="tab" data-arg="mail">Mailbox</button>. The Auction House keeps ${AH_TAX * 100}% of each sale. Listings and orders last 2 days.</p>
    ${ah.err ? `<p class="bad" style="font-size:14px">${esc(ah.err)}</p>` : ''}
    <div class="row" style="gap:6px;margin-bottom:10px"><input id="ahq" value="${esc(ah.q)}" placeholder="Search any item…" autocomplete="off" aria-label="Search items" style="flex:1;min-width:160px">
      <select id="ahbag" aria-label="Sell from your bag" style="max-width:260px"><option value="">Sell from your bag…</option>${bag.map(k => `<option value="${esc(k)}">${esc(ahName(k))} (${N(ch.inv[k])})</option>`).join('')}</select></div>
    ${ah.sel ? ahItemPanel(ah.sel) : ''}
    ${list}${mine}`;
}
const ahEnds = t => { const s = (Date.parse(t) - Date.now()) / 1000; return s <= 0 ? 'soon' : 'in ' + fmtTime(s); };

function ahItemPanel(k) {
  const it = ITEM(k), d = ah.itemFor === k ? ah.item : null, have = ch.inv[k] || 0;
  if (!d) { if (ah.itemFor !== k) ahLoadItem(k).then(() => tab === 'auction' && renderMain()); return `<div class="card ahpanel"><h3>${rname(k)}</h3><p class="mute">Loading…</p></div>`; }
  const ls = d.listings, os = d.orders, low = ls.filter(l => !l.mine)[0], bid = os.filter(o => !o.mine)[0], last = d.recent[0];
  const suggest = low ? Math.max(1, +low.price - 1) : ls.length ? +ls[0].price : last ? +last.price : Math.max(1, Math.ceil((it.value || 1) * 1.2));
  const shop = it.value ? Math.floor(sellPrice(k)) : 0;
  return `<div class="card ahpanel"><div class="spread"><h3>${itemIcon(k, 24)} ${rname(k)}</h3><span class="row" style="gap:6px"><span class="mute" style="font-size:13px">You have ${N(have)}${shop ? ` · shop pays about ${N(shop)}g each` : ''}</span><button class="sm ghost" data-act="ahclose">Close</button></span></div>
    ${it.desc ? `<p class="mute" style="font-size:13px;margin:2px 0 8px">${esc(it.desc)}</p>` : ''}
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));align-items:start;gap:14px">
      <div><h4 class="shopgrp">Price history (14 days)</h4>${ahChart(d.history)}
        ${d.recent.length ? `<div class="mute" style="font-size:12px;margin-top:6px">Recent: ${d.recent.slice(0, 6).map(r => `${N(+r.qty)} @ ${N(+r.price)}g`).join(' · ')}</div>` : ''}</div>
      <div><h4 class="shopgrp">For sale</h4>${ls.length ? `<div class="grid" style="gap:3px">${ls.slice(0, 8).map(l => `<div class="prow" style="padding:4px 8px"><span>${N(+l.qty)} × <b class="gold">${N(+l.price)}g</b>${l.mine ? ' <span class="chip" style="font-size:11px">yours</span>' : ''}</span>${l.mine ? `<button class="sm ghost" data-act="ahcancell" data-arg="${l.id}">Cancel</button>` : ''}</div>`).join('')}</div>` : '<p class="mute" style="font-size:14px;margin:4px 0">No one is selling this right now.</p>'}
        ${low ? `<div class="row" style="gap:6px;margin-top:8px;align-items:center"><label class="mute" style="font-size:13px" for="ahbq">Buy</label><input id="ahbq" type="number" min="1" step="1" value="1" style="width:6em"><label class="mute" style="font-size:13px" for="ahbm">up to</label><input id="ahbm" type="number" min="1" step="1" value="${+low.price}" style="width:7em"><span class="mute" style="font-size:13px">g each</span><button class="sm pri" data-act="ahbuy">Buy</button></div><div class="mute" id="ahbuycost" style="font-size:12px;margin-top:4px">${ahCostText(ls, 1, +low.price)}</div>` : ''}
        <h4 class="shopgrp" style="margin-top:12px">Wanted (buy orders)</h4>${os.length ? `<div class="grid" style="gap:3px">${os.slice(0, 8).map(o => `<div class="prow" style="padding:4px 8px"><span>${N(+o.qty)} × <b class="gold">${N(+o.price)}g</b>${o.mine ? ' <span class="chip" style="font-size:11px">yours</span>' : ''}</span>${o.mine ? `<button class="sm ghost" data-act="ahcancelo" data-arg="${o.id}">Cancel</button>` : have ? `<button class="sm" data-act="ahfill" data-arg="${o.id}|${Math.min(have, +o.qty)}">Sell ${N(Math.min(have, +o.qty))} for ${N(Math.floor(Math.min(have, +o.qty) * +o.price * (1 - AH_TAX)))}g</button>` : ''}</div>`).join('')}</div>` : '<p class="mute" style="font-size:14px;margin:4px 0">No buy orders yet.</p>'}</div>
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-top:12px">
      <div class="ahbox"><b>Sell</b>${have ? `<div class="row" style="gap:6px;margin-top:6px;align-items:center"><input id="ahsq" type="number" min="1" max="${have}" step="1" value="${have}" style="width:7em" aria-label="Quantity"><span class="mute" style="font-size:13px">at</span><input id="ahsp" type="number" min="1" step="1" value="${suggest}" style="width:8em" aria-label="Price each"><span class="mute" style="font-size:13px">g each</span><button class="sm pri" data-act="ahlist">List</button></div><div class="mute" id="ahsellnet" style="font-size:12px;margin-top:4px">${ahNetText(have, suggest)}</div>${bid && +bid.price >= suggest ? `<p class="verd" style="font-size:12px;margin:4px 0 0">Someone is already buying at ${N(+bid.price)}g: use Sell on their order above for an instant sale.</p>` : ''}` : '<p class="mute" style="font-size:13px;margin:4px 0 0">You don’t have any to sell.</p>'}</div>
      <div class="ahbox"><b>Post a buy order</b><div class="row" style="gap:6px;margin-top:6px;align-items:center"><input id="ahoq" type="number" min="1" step="1" value="10" style="width:7em" aria-label="Quantity"><span class="mute" style="font-size:13px">at</span><input id="ahop" type="number" min="1" step="1" value="${ahBidDefault(os, bid, suggest)}" style="width:8em" aria-label="Price each"><span class="mute" style="font-size:13px">g each</span><button class="sm" data-act="ahorder">Post</button></div><div class="mute" id="ahordertot" style="font-size:12px;margin-top:4px">${ahOrderText(10, ahBidDefault(os, bid, suggest))}</div></div>
    </div><div class="err" id="aherr"></div></div>`;
}
const ahBidDefault = (os, bid, suggest) => bid ? +bid.price + 1 : os.length ? +os[0].price : Math.max(1, Math.floor(suggest * 0.9));
function ahCostText(ls, qty, max) {
  let want = qty, cost = 0, got = 0;
  for (const l of ls) { if (l.mine || +l.price > max || want <= 0) continue; const q = Math.min(want, +l.qty); cost += q * +l.price; got += q; want -= q; }
  return got ? `${N(got)} available at that price for ${N(cost)}g total${got < qty ? ` (only ${N(got)} of ${N(qty)})` : ''}.` : 'Nothing for sale at that price.';
}
const ahNetText = (q, p) => `Total ${N(q * p)}g. After the ${AH_TAX * 100}% fee you get ${N(Math.floor(q * p * (1 - AH_TAX)))}g when it sells. The items leave your bag now.`;
const ahOrderText = (q, p) => `Sets aside ${N(q * p)}g now (you have ${N(ch.gold)}g). Unused gold comes back if you cancel or it expires.`;
const ahNum = id => Math.floor(+((document.getElementById(id) || {}).value) || 0);

const AUCTION_HANDLERS = {
  ahrefresh: () => { ah.at = 0; ahLoad(true); },
  ahsel: k => { ah.sel = k; ah.itemFor = null; renderMain(); const p = document.querySelector('.ahpanel'); if (p) p.scrollIntoView({ block: 'nearest' }); },
  ahclose: () => { ah.sel = null; renderMain(); },
  ahbuy: async () => {
    const k = ah.sel, qty = ahNum('ahbq'), max = ahNum('ahbm'); if (qty < 1 || max < 1) return;
    const est = ah.item.listings.filter(l => !l.mine && +l.price <= max).reduce((a, l) => { const q = Math.min(qty - a.q, +l.qty); return q > 0 ? { q: a.q + q, c: a.c + q * +l.price } : a; }, { q: 0, c: 0 });
    if (est.c > ch.gold) { socErr('aherr', `That costs up to ${N(est.c)}g and you have ${N(ch.gold)}g.`); return; }
    try { const r = await rpc('tf_ah_buy', { p_item: k, p_qty: qty, p_max: max }); ch.gold -= +r.spent; save(); addLog('sys', `Bought ${N(+r.bought)} ${ahName(k)} for ${N(+r.spent)}g at the Auction House.`); toast(`Bought ${N(+r.bought)} ${esc(ahName(k))}. Collect them in your Mailbox.`, 'verd'); soc.mailList = null; await ahLoad(true); socRefresh(); }
    catch (e) { socErr('aherr', e); }
  },
  ahlist: async () => {
    const k = ah.sel, qty = ahNum('ahsq'), price = ahNum('ahsp');
    if (qty < 1 || price < 1) { socErr('aherr', 'Enter a quantity and a price.'); return; }
    if ((ch.inv[k] || 0) < qty) { socErr('aherr', `You only have ${N(ch.inv[k] || 0)}.`); return; }
    try { await rpc('tf_ah_list', { p_item: k, p_qty: qty, p_price: price }); takeItem(k, qty); save(); addLog('sys', `Listed ${N(qty)} ${ahName(k)} at ${N(price)}g each.`); toast('Listed on the Auction House.', 'verd'); await ahLoad(true); }
    catch (e) { socErr('aherr', e); }
  },
  ahorder: async () => {
    const k = ah.sel, qty = ahNum('ahoq'), price = ahNum('ahop');
    if (qty < 1 || price < 1) { socErr('aherr', 'Enter a quantity and a price.'); return; }
    if (qty * price > ch.gold) { socErr('aherr', `That needs ${N(qty * price)}g set aside and you have ${N(ch.gold)}g.`); return; }
    try { await rpc('tf_ah_order', { p_item: k, p_qty: qty, p_price: price }); ch.gold -= qty * price; save(); addLog('sys', `Posted a buy order for ${N(qty)} ${ahName(k)} at ${N(price)}g each.`); toast('Buy order posted.', 'verd'); await ahLoad(true); }
    catch (e) { socErr('aherr', e); }
  },
  ahfill: async a => {
    const [id, q] = a.split('|'), qty = +q, k = ah.sel;
    if ((ch.inv[k] || 0) < qty) { socErr('aherr', `You only have ${N(ch.inv[k] || 0)}.`); return; }
    try { const r = await rpc('tf_ah_fill', { p_order: +id, p_qty: qty }); takeItem(k, +r.sold); save(); addLog('sys', `Sold ${N(+r.sold)} ${ahName(k)} to a buy order for ${N(+r.net)}g.`); toast(`Sold! ${N(+r.net)}g is waiting in your Mailbox.`, 'verd'); soc.mailList = null; await ahLoad(true); socRefresh(); }
    catch (e) { socErr('aherr', e); }
  },
  ahcancell: async id => { try { await rpc('tf_ah_cancel_listing', { p_id: +id }); toast('Listing cancelled. Your items are in your Mailbox.'); soc.mailList = null; await ahLoad(true); socRefresh(); } catch (e) { toast(esc(e.message)); } },
  ahcancelo: async id => { try { await rpc('tf_ah_cancel_order', { p_id: +id }); toast('Buy order cancelled. Your gold is in your Mailbox.'); soc.mailList = null; await ahLoad(true); socRefresh(); } catch (e) { toast(esc(e.message)); } },
  ahopen: k => { ah.sel = k; ah.itemFor = null; ah.q = ''; HANDLERS.tab('auction'); },
  mailall: async () => {
    const list = (soc.mailList || []).filter(m => !m.claimed && (+m.gold > 0 || Object.keys(m.items || {}).length));
    let gold = 0, n = 0;
    for (const m of list) { try { const r = await rpc('tf_mail_claim', { p_id: m.id }); gold += +r.gold || 0; giveOffer(r, 'the mailbox'); n++; } catch (e) { } }
    toast(n ? `Collected ${n} letter${n > 1 ? 's' : ''}${gold ? `, including ${N(gold)}g` : ''}.` : 'Nothing to collect.', 'verd');
    soc.mailList = null; await socRefresh(); renderMain();
  },
};
document.addEventListener('input', e => {
  const t = e.target; if (!t || tab !== 'auction') return;
  if (t.id === 'ahq') { ah.q = t.value; clearTimeout(ah.qt); ah.qt = setTimeout(() => { const pos = t.selectionStart; renderMain(); const n = $('#ahq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); }
  if ((t.id === 'ahbq' || t.id === 'ahbm') && ah.item) { const el = $('#ahbuycost'); if (el) el.textContent = ahCostText(ah.item.listings, ahNum('ahbq'), ahNum('ahbm')); }
  if (t.id === 'ahsq' || t.id === 'ahsp') { const el = $('#ahsellnet'); if (el) el.textContent = ahNetText(ahNum('ahsq'), ahNum('ahsp')); }
  if (t.id === 'ahoq' || t.id === 'ahop') { const el = $('#ahordertot'); if (el) el.textContent = ahOrderText(ahNum('ahoq'), ahNum('ahop')); }
});
document.addEventListener('change', e => { const t = e.target; if (t && t.id === 'ahbag' && t.value) AUCTION_HANDLERS.ahsel(t.value); });

// ============================================================
// GUILDS (Phase 13): create or join, ranks, guild chat, a shared gold
// bank, a weekly guild goal and the guild leaderboard. Server-side in
// migration 0007_guilds.sql; works on the website for signed-in players.
// ============================================================
let gd = { info: undefined, list: null, q: '', loading: false, err: '', at: 0, pay: null };
const G_RANK = { leader: 'Leader', officer: 'Officer', member: 'Member' };

async function guildLoad(force) {
  if (gd.loading || (!force && gd.info !== undefined && Date.now() - gd.at < 30000)) return;
  gd.loading = true;
  try {
    const [info, list] = await Promise.all([rpc('tf_guild_info'), rpc('tf_guild_list', { p_q: gd.q })]);
    gd.info = info; gd.list = list || []; gd.at = Date.now(); gd.err = '';
    soc.guild = info && info.guild ? { id: info.guild.id, name: info.guild.name, tag: info.guild.tag } : null;
    if (soc.guild && ch && !ch.counters.guildJoined) { ch.counters.guildJoined = 1; dirty = true; }
  } catch (e) { gd.err = e.message || String(e); if (gd.info === undefined) gd.info = null; }
  gd.loading = false; if (screen === 'game' && tab === 'guild') renderMain();
}
// Points for the weekly goal: actions done (gathered + crafted + won fights) since the last report.
const guildTotal = () => (ch.counters.gathered || 0) + (ch.counters.crafted || 0) + (ch.counters.kills || 0);
async function guildContribute() {
  if (!ch || !socOn() || !soc.me || !soc.guild || (ch.debugUsed)) return;
  if (ch.guildMark == null || ch.guildMark > guildTotal()) { ch.guildMark = guildTotal(); return; }
  const delta = guildTotal() - ch.guildMark; if (delta < 1) return;
  try { const r = await rpc('tf_guild_contribute', { p_n: delta }); if (r && r.ok) { ch.guildMark += +r.added; ch.guildPts = (ch.guildPts || 0) + +r.added; save(); } } catch (e) { }
}

function guildGoalBar(g) {
  const goals = g.goals.map(Number), max = goals[2], p = Math.min(1, g.week_points / max);
  const names = ['Bronze', 'Silver', 'Gold'];
  return `<div class="ggoal"><div class="gbar"><div class="gfill" style="width:${(p * 100).toFixed(1)}%"></div>${goals.map((v, i) => `<span class="gmark ${g.week_points >= v ? 'on' : ''}" style="left:${(v / max * 100).toFixed(1)}%" title="${names[i]}: ${N(v)}"></span>`).join('')}</div>
    <div class="row" style="justify-content:space-between;font-size:13px;margin-top:4px">${goals.map((v, i) => `<span class="${g.week_points >= v ? 'gold' : 'mute'}">${g.week_points >= v ? '✓ ' : ''}${names[i]} ${N(v)}</span>`).join('')}</div></div>`;
}
function guildTop() {
  const L = gd.list || [];
  return `<div class="card" style="margin-top:12px"><div class="spread"><h3>Guild leaderboard</h3><span class="mute" style="font-size:13px">This week</span></div>
    ${L.length ? `<div class="grid" style="gap:4px;margin-top:8px">${L.slice(0, 20).map((g, i) => `<div class="prow"><span><b>${i + 1}.</b> ${esc(g.name)} <span class="chip" style="font-size:11px">${esc(g.tag)}</span> <span class="mute" style="font-size:12px">${g.members} member${g.members === 1 ? '' : 's'}</span></span><span class="num"><b class="gold">${N(+g.week_points)}</b> <span class="mute" style="font-size:12px">· ${N(+g.total_points)} all time</span></span></div>`).join('')}</div>` : '<p class="mute">No guilds yet.</p>'}</div>`;
}
function tabGuild() {
  const gate = socGate(); if (gate) return `<h2>Guild</h2>${gate}`;
  if (gd.info === undefined) { guildLoad(true); return '<h2>Guild</h2><p class="mute">Loading…</p>'; }
  if (!gd.loading && (Date.now() - (gd.view || 0) > 3000 || Date.now() - gd.at > 60000)) setTimeout(() => guildLoad(true), 0);
  gd.view = Date.now();
  const I = gd.info, err = gd.err ? `<p class="bad" style="font-size:14px">${esc(gd.err)}</p>` : '';
  if (!I || !I.guild) {
    const req = new Set((I && I.requests) || []);
    return `<h2>Guild</h2><p class="mute" style="margin:4px 0 12px">Join a guild to chat together, share a gold bank and chase a weekly goal: every action members take counts, and every member gets the rewards.</p>${err}
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px;align-items:start">
        <div class="card"><h3>Find a guild</h3><div class="row" style="gap:6px;margin-top:8px"><input id="gq" value="${esc(gd.q)}" placeholder="Search by name or tag" aria-label="Search guilds" style="flex:1"><button class="sm" data-act="gsearch">Search</button></div>
          <div class="grid" style="gap:6px;margin-top:10px">${(gd.list || []).length ? gd.list.map(g => `<div class="prow"><span><b>${esc(g.name)}</b> <span class="chip" style="font-size:11px">${esc(g.tag)}</span><br><span class="mute" style="font-size:12px">${g.members} member${g.members === 1 ? '' : 's'} · ${g.open ? 'open to all' : 'asks to join'}${g.descr ? ' · ' + esc(g.descr) : ''}</span></span>
            ${req.has(g.id) || g.requested ? `<button class="sm ghost" data-act="gcancel" data-arg="${g.id}">Cancel request</button>` : `<button class="sm ${g.open ? 'pri' : ''}" data-act="gjoin" data-arg="${g.id}">${g.open ? 'Join' : 'Ask to join'}</button>`}</div>`).join('') : '<p class="mute">No guilds found. Start one!</p>'}</div></div>
        <div class="card"><h3>Start a guild</h3>
          <div class="grid" style="gap:8px;margin-top:8px"><input id="gname" maxlength="24" placeholder="Guild name (3–24 characters)" aria-label="Guild name"><input id="gtag" maxlength="4" placeholder="Tag (2–4 letters or numbers)" aria-label="Guild tag" style="max-width:220px;text-transform:uppercase"><textarea id="gdesc" maxlength="300" rows="2" placeholder="What is your guild about? (optional)" aria-label="Description"></textarea>
            <label class="row" style="gap:6px;font-size:14px"><input type="checkbox" id="gopen" checked> Anyone can join (untick to approve requests)</label></div>
          <div class="err" id="gerr"></div><button class="pri" data-act="gcreate" style="margin-top:6px">Create guild</button></div>
      </div>${guildTop()}`;
  }
  const g = I.guild, me = I.me.rank, off = me === 'leader' || me === 'officer', mine = I.members.find(m => m.me) || {};
  const members = I.members.map(m => `<div class="prow"><span><span class="odot ${m.online ? 'on' : ''}"></span> <b>${esc(m.name)}</b>${m.me ? ' <span class="mute">(you)</span>' : ''} <span class="chip" style="font-size:11px">${G_RANK[m.rank]}</span><br><span class="mute" style="font-size:12px">${N(+m.week_points)} this week · ${N(+m.total_points)} all time</span></span>
      <span class="row" style="gap:4px">${!m.me && me === 'leader' ? (m.rank === 'member' ? `<button class="sm ghost" data-act="grank" data-arg="${m.id}|officer">Make officer</button>` : `<button class="sm ghost" data-act="grank" data-arg="${m.id}|member">Make member</button>`) + `<button class="sm ghost" data-act="grank" data-arg="${m.id}|leader">Make leader</button>` : ''}${!m.me && off && m.rank !== 'leader' && (me === 'leader' || m.rank === 'member') ? `<button class="sm ghost" data-act="gkick" data-arg="${m.id}">Remove</button>` : ''}</span></div>`).join('');
  return `<div class="spread"><h2>${esc(g.name)} <span class="chip">${esc(g.tag)}</span></h2><span class="row" style="gap:6px"><button class="sm" data-act="gchat">Guild chat</button><button class="sm" data-act="grefresh" ${gd.loading ? 'disabled' : ''}>Refresh</button></span></div>
    <p class="mute" style="margin:4px 0 12px">${g.descr ? esc(g.descr) + ' · ' : ''}${I.members.length} of ${g.max_members} members · ${g.open ? 'open to all' : 'asks to join'} · you are ${G_RANK[me].toLowerCase()}</p>${err}
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px;align-items:start">
      <div class="card"><div class="spread"><h3>Weekly goal</h3><span class="mute" style="font-size:13px">resets Monday (UTC)</span></div>
        <p style="margin:6px 0"><b class="gold">${N(+g.week_points)}</b> points this week · your share <b>${N(+mine.week_points || 0)}</b></p>${guildGoalBar(g)}
        <p class="mute" style="font-size:12px;margin:8px 0 0">Every gathering action, craft and won fight is a point. Each goal reached mails every member a reward: Bronze 2,000 gold and a Common Egg, Silver 10,000 gold and a Rare Egg, Gold 50,000 gold and an Epic Egg.</p></div>
      <div class="card"><h3>Guild bank</h3><p style="margin:6px 0"><b class="gold">${N(+g.bank)}</b> gold</p>
        <div class="row" style="gap:6px"><input id="gdep" type="number" min="1" step="1" placeholder="Amount" style="width:9em" aria-label="Gold to deposit"><button class="sm" data-act="gdeposit">Deposit</button><span class="mute num" style="font-size:13px">you have <b class="gold" data-live="gold"></b></span></div>
        ${off ? `<div class="row" style="gap:6px;margin-top:8px"><select id="gpayto" aria-label="Pay to">${I.members.map(m => `<option value="${m.id}">${esc(m.name)}${m.me ? ' (you)' : ''}</option>`).join('')}</select><input id="gpayamt" type="number" min="1" step="1" placeholder="Amount" style="width:8em" aria-label="Gold to pay"><button class="sm" data-act="gpay">Pay out</button></div><p class="mute" style="font-size:12px;margin:6px 0 0">Payouts arrive in the member's Mailbox.</p>` : '<p class="mute" style="font-size:12px;margin:6px 0 0">Officers and the leader can pay members from the bank.</p>'}
        <div class="err" id="gbankerr"></div></div>
    </div>
    ${off && I.requests.length ? `<div class="card" style="margin-top:12px"><h3>Requests to join</h3><div class="grid" style="gap:6px;margin-top:8px">${I.requests.map(r => `<div class="prow"><span><b>${esc(r.name)}</b></span><span class="row" style="gap:4px"><button class="sm pri" data-act="gresp" data-arg="${r.id}|1">Accept</button><button class="sm ghost" data-act="gresp" data-arg="${r.id}|0">Decline</button></span></div>`).join('')}</div></div>` : ''}
    <div class="card" style="margin-top:12px"><h3>Members</h3><div class="grid" style="gap:6px;margin-top:8px">${members}</div></div>
    ${off ? `<details class="card" style="margin-top:12px"><summary><b>Guild settings</b></summary><div class="grid" style="gap:8px;margin-top:8px"><textarea id="gedesc" maxlength="300" rows="2" aria-label="Description">${esc(g.descr)}</textarea><label class="row" style="gap:6px;font-size:14px"><input type="checkbox" id="geopen" ${g.open ? 'checked' : ''}> Anyone can join</label><button class="sm" data-act="gedit" style="justify-self:start">Save</button></div></details>` : ''}
    <div class="card" style="margin-top:12px"><h3>Guild log</h3><div class="grid" style="gap:2px;margin-top:6px;font-size:13px">${I.log.length ? I.log.map(l => `<div><span class="mute">${new Date(l.at).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })}</span> ${esc(l.text)}</div>`).join('') : '<span class="mute">Nothing yet.</span>'}</div></div>
    ${guildTop()}
    <div class="row" style="margin-top:12px"><button class="ghost" data-act="gleave">Leave guild</button></div>`;
}
const gDo = async (fn, msg, errId) => {
  try { await fn(); if (msg) toast(msg, 'verd'); await guildLoad(true); }
  catch (e) { const el = errId && document.getElementById(errId); if (el) el.textContent = e.message || String(e); else toast(esc(e.message || String(e))); }
};
const GUILD_HANDLERS = {
  grefresh: () => guildLoad(true),
  gsearch: () => { gd.q = ($('#gq') || {}).value || ''; guildLoad(true); },
  gcreate: () => gDo(() => rpc('tf_guild_create', { p_name: $('#gname').value, p_tag: $('#gtag').value.trim(), p_descr: $('#gdesc').value, p_open: $('#gopen').checked }), 'Guild created.', 'gerr'),
  gjoin: id => gDo(async () => { const r = await rpc('tf_guild_join', { p_guild: +id }); toast(r === 'joined' ? 'Welcome to the guild!' : 'Request sent. An officer will review it.', 'verd'); }),
  gcancel: id => gDo(() => rpc('tf_guild_cancel_request', { p_guild: +id }), 'Request cancelled.'),
  gresp: a => { const [id, ok] = a.split('|'); gDo(() => rpc('tf_guild_respond', { p_user: id, p_accept: ok === '1' }), ok === '1' ? 'Accepted.' : 'Declined.'); },
  grank: a => { const [id, r] = a.split('|'); if (r === 'leader') { modal(`<h3>Hand over leadership?</h3><p>You will become an officer.</p><div class="row"><button class="pri" data-act="grankok" data-arg="${esc(a)}">Make leader</button><button data-act="close">Cancel</button></div>`); return; } gDo(() => rpc('tf_guild_rank', { p_user: id, p_rank: r }), 'Rank changed.'); },
  grankok: a => { closeModal(); const [id, r] = a.split('|'); gDo(() => rpc('tf_guild_rank', { p_user: id, p_rank: r }), 'Leadership handed over.'); },
  gkick: id => gDo(() => rpc('tf_guild_kick', { p_user: id }), 'Removed from the guild.'),
  gedit: () => gDo(() => rpc('tf_guild_edit', { p_descr: $('#gedesc').value, p_open: $('#geopen').checked }), 'Saved.'),
  gdeposit: () => {
    const n = Math.floor(+($('#gdep') || {}).value || 0), el = $('#gbankerr');
    if (n < 1) { el.textContent = 'Enter an amount.'; return; } if (n > ch.gold) { el.textContent = `You have ${N(ch.gold)} gold.`; return; }
    gDo(async () => { await rpc('tf_guild_deposit', { p_amount: n }); ch.gold -= n; save(); addLog('sys', `Deposited ${N(n)} gold in the guild bank.`); }, `Deposited ${N(n)} gold.`, 'gbankerr');
  },
  gpay: () => { const n = Math.floor(+($('#gpayamt') || {}).value || 0); if (n < 1) { $('#gbankerr').textContent = 'Enter an amount.'; return; } gDo(() => rpc('tf_guild_pay', { p_to: $('#gpayto').value, p_amount: n }), 'Paid. The gold is in their Mailbox.', 'gbankerr'); },
  gleave: () => modal(`<h3>Leave ${esc(gd.info.guild.name)}?</h3><p>${gd.info.me.rank === 'leader' && gd.info.members.length > 1 ? 'Leadership passes to an officer (or the longest member).' : gd.info.members.length === 1 ? 'You are the last member, so the guild and its bank will be gone.' : 'You can join again later if it is open.'}</p><div class="row"><button class="pri" data-act="gleaveok">Leave</button><button data-act="close">Cancel</button></div>`),
  gleaveok: () => { closeModal(); gDo(() => rpc('tf_guild_leave'), 'You left the guild.'); },
  gchat: () => { soc.chan = 'guild'; HANDLERS.tab('chat'); },
};
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && e.target.id === 'gq') GUILD_HANDLERS.gsearch(); });

// ============================================================
// PLAYER PROFILES (v0.15): a public page per player showing their
// characters. Published from the game (migration 0008_profiles.sql);
// viewable by anyone from a link, chat, friends and leaderboards.
// ============================================================
const SITE_URL = 'https://thah3b.github.io/thousandfold/';
let prof = { lastPub: 0, sig: '', view: null };

// A snapshot of each character for the public card. Debug-tool characters are left out.
function profileCard() {
  const chars = account.slots.filter(c => c && !c.debugUsed).slice(0, 4).map(c => {
    let coll = 0; try { const C = collectionPct(c); coll = Math.round(Object.values(C).reduce((s, v) => s + v, 0) / 4 * 100); } catch (e) { }
    const ach = ACHIEVEMENTS.filter(a => c.ach && c.ach[a.id]).reduce((s, a) => s + a.pts, 0);
    const pet = c.petActive && (c.pets || []).find(p => p.uid === c.petActive);
    const skills = SKILL_IDS.filter(s => c.skills[s]).map(s => [s, c.skills[s].level]).sort((a, b) => b[1] - a[1]).slice(0, 3);
    const egos = Object.keys(c.egos || {}).map(k => (EGOS && EGOS[k] ? EGOS[k].name : k)).slice(0, 6);
    return {
      name: c.name, race: c.race, cls: c.cls, gender: c.gender, mark: c.mark, look: fashionLook(c), adv: { tier: (c.adv && c.adv.tier) || 1 },
      tierName: (() => { try { return tierName(c.cls, c.adv && c.adv.spec, (c.adv && c.adv.tier) || 1); } catch (e) { return ''; } })(),
      asc: c.ascension || 0, level: c.level, title: c.displayTitle || '', ach, coll,
      species: Object.keys(c.petDex || {}).length, pet: pet ? { sp: pet.sp, name: pet.name || '', level: pet.level || 1 } : null,
      comp: c.comp && c.comp.cls && COMPANIONS[c.comp.cls] ? COMPANIONS[c.comp.cls][0] : null,
      egos, secrets: Object.keys(c.secrets || {}).length, lore: Object.keys(c.lore || {}).length,
      skills, gathered: c.counters.gathered || 0, kills: c.counters.kills || 0, events: c.counters.eventsJoined || 0,
      streak: (c.daily && c.daily.best) || 0, created: c.created || 0,
    };
  });
  return { v: 1, chars, at: Date.now() };
}
async function profilePublish(force) {
  if (!socOn() || !soc.me) return;
  if (!force && Date.now() - prof.lastPub < 2 * 60000) return;
  const card = profileCard(), sig = JSON.stringify(card.chars) + (account.settings.profileHidden ? 'h' : '');
  if (!force && sig === prof.sig) return;
  try { const ok = await rpc('tf_profile_publish', { p_card: card, p_hidden: !!account.settings.profileHidden }); if (ok !== false) { prof.lastPub = Date.now(); prof.sig = sig; } } catch (e) { }
}

async function profileOpen(by) {
  modal(`<div class="profpage"><p class="mute">Loading profile…</p></div>`, 'wide');
  try {
    const args = by.code ? { p_code: by.code } : { p_user: by.id };
    const d = await (socOn() ? rpc('tf_profile_get', args) : sbFetch('/rest/v1/rpc/tf_profile_get', { method: 'POST', body: JSON.stringify(args) }, false));
    prof.view = d;
    const el = document.querySelector('#modal .profpage'); if (el) el.outerHTML = profileHtml(d);
  } catch (e) { const el = document.querySelector('#modal .profpage'); if (el) el.innerHTML = `<p class="bad">${esc(e.message || 'Could not load that profile.')}</p><div class="row"><button data-act="close">Close</button></div>`; }
}
const profNum = n => N(+n || 0);
function profileHtml(d) {
  if (!d) return `<div class="profpage"><h2>Player not found</h2><p class="mute">That link or code doesn’t match a player.</p><div class="row"><button data-act="close">Close</button></div></div>`;
  const C = d.card, chars = (C && C.chars) || [];
  const head = `<div class="profhead"><div class="row" style="gap:12px;flex-wrap:nowrap;align-items:flex-start">${gameIcon(40)}<div><h2 style="margin:0">${esc(d.name)} ${d.guild ? `<span class="chip" title="${esc(d.guild.name)}">${esc(d.guild.tag)}</span>` : ''}</h2>
      <div class="mute" style="font-size:14px">${d.online ? '<span class="odot on"></span> online · ' : ''}${d.guild ? `${esc(G_RANK[d.guild.rank] || '')} of ${esc(d.guild.name)} · ` : ''}playing since ${new Date(d.joined).toLocaleDateString([], { month: 'short', year: 'numeric' })} · friend code <b>${esc(d.code)}</b></div></div></div>
      <div class="row" style="gap:6px">${d.me ? '' : socOn() && soc.me && !soc.friends.some(f => f.id === d.id) ? `<button class="sm pri" data-act="socaddname" data-arg="${esc(d.code)}">Add friend</button>` : ''}<button class="sm" data-act="profcopy" data-arg="${esc(d.code)}">Copy link</button></div></div>`;
  if (!C) return `<div class="profpage">${head}<p class="mute" style="margin-top:12px">${d.hidden ? 'This player keeps their characters private.' : 'This player hasn’t shared their characters yet.'}</p><div class="row"><button data-act="close">Close</button></div></div>`;
  const cards = chars.map(c => {
    const R = RACES.find(r => r.id === c.race) || RACES[0], K = CLASSES.find(k => k.id === c.cls) || CLASSES[0];
    return `<div class="card profchar"><div class="row" style="gap:12px;align-items:flex-start">${heroShowcase(c, 84, { cls: 'small', pet: c.pet })}<div style="flex:1;min-width:0">
        <h3 style="margin:0">${esc(c.name)}</h3>${c.title ? `<div class="gold" style="font-size:14px">${esc(c.title)}</div>` : ''}
        <div class="mute" style="font-size:14px">${esc(R.name)} ${esc(c.tierName || K.name)} · <b>${c.asc ? `A${c.asc} · ` : ''}Lv ${c.level}</b></div></div></div>
      <div class="profstats">
        <span><b>${profNum(c.ach)}</b> achievement points</span><span><b>${c.coll}%</b> collection</span>
        <span><b>${profNum(c.gathered)}</b> gathered</span><span><b>${profNum(c.kills)}</b> fights won</span>
        <span><b>${c.species}</b> pet species</span><span><b>${c.secrets}</b> secrets · <b>${c.lore}</b> lore page${c.lore === 1 ? '' : 's'}</span>
        ${c.events ? `<span><b>${c.events}</b> event${c.events === 1 ? '' : 's'}</span>` : ''}${c.streak ? `<span><b>${c.streak}</b>-day best streak</span>` : ''}</div>
      <div class="profrow">${(c.skills || []).map(([s, l]) => `<span class="chip">${esc(SKILLS[s] ? SKILLS[s].name : s)} ${l}</span>`).join('')}</div>
      ${c.pet || c.comp || (c.egos || []).length ? `<div class="profrow">${c.pet && typeof petGlyph === 'function' && SP(c.pet.sp) ? `<span class="row" style="gap:4px">${petGlyph(c.pet.sp, 32)}<span style="font-size:13px">${esc(c.pet.name || SP(c.pet.sp).name)} <span class="mute">Lv ${c.pet.level}</span></span></span>` : ''}${c.comp ? `<span style="font-size:13px">⚔ with <b>${esc(c.comp)}</b></span>` : ''}${(c.egos || []).length ? `<span style="font-size:13px">Sentient weapons: ${c.egos.map(esc).join(', ')}</span>` : ''}</div>` : ''}
    </div>`;
  }).join('');
  return `<div class="profpage">${head}<div class="profchars">${cards || '<p class="mute">No characters yet.</p>'}</div>
    <p class="mute" style="font-size:12px;margin:10px 0 0">Updated ${d.updated ? new Date(d.updated).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : 'never'}.</p>
    <div class="row" style="margin-top:10px"><button data-act="close">Close</button></div></div>`;
}
function myProfileCard() {
  if (!socOn() || !soc.me) return '';

// ---------- Live values ----------
function updateLive() {
  if (!ch) return;
  const now = Date.now(), dc = {}, dOf = s => dc[s] || (dc[s] = derive(ch, now, null, s));
  for (const el of $$('[data-live]')) {
    const L0 = el.dataset.live, ci = L0.indexOf(':'), k = ci < 0 ? L0 : L0.slice(0, ci), arg = ci < 0 ? '' : L0.slice(ci + 1); let v = '';
    switch (k) {
      case 'gold': v = N(ch.gold); break;
      case 'shards': v = N(account.shards); break;
      case 'stam': v = `${staminaUsed()}/${dOf('mining').stamina}`; break;
      case 'lvl': v = levelLabel(ch); break;
      case 'slvl': v = ch.skills[arg].level; break;
      case 'inv': v = N(ch.inv[arg] || 0); break;
      case 'bank': v = N(ch.bank[arg] || 0); break;
      case 'slots': v = `${usedSlots()} / ${ch.invSlots}`; break;
      case 'next': { const c = ch.prof[arg] || 0, k2 = tierOf(c); v = k2 < 9 ? `${N(c)} / ${N(BALANCE.tierThresholds[k2 + 1])}` : N(c); break; }
      case 'time': { const a = ACT(arg); v = fmtTime(actionSec(a, ch.prof[arg] || 0, dOf(a.skill).speed)); break; }
      case 'can': v = N(craftable(ch, RECIPE[arg])); break;
      case 'streak': { const a = ch.actions.find(x => x.res === arg); v = a ? N(a.streak) : '0'; break; }
      case 'total': v = N(ch.totals[arg]); break;
      case 'xpline': { const L = levelFromXp(ch.xp); v = L.need ? `${N(L.into)} / ${N(L.need)} XP` : 'Max level'; break; }
      case 'sxpline': { const L = levelFromXp(ch.skills[arg].xp); v = L.need ? `${N(L.into)} / ${N(L.need)} XP` : 'Max level'; break; }
      case 'ms': { const m = nextMilestone(); v = m ? `${m.label} · ${fmtTime(m.eta)}` : (ch.actions.length ? 'Keep going' : 'Start an action'); break; }
      case 'pot': { const p = ch.potions[arg]; v = p && p.until > now ? fmtTime((p.until - now) / 1000) : ''; if (!v) dirty = true; break; }
      case 'price': { const pr = sellPrice(arg, now); v = (pr < 10 ? pr.toFixed(1) : N(Math.floor(pr))) + 'g'; break; }
      case 'savings': v = N(Math.floor(savingsNow(ch, now))); break;
      case 'clock': v = clockText(); break;
      case 'hp': { const mh = dOf('slaying').maxHP; v = `${N(Math.max(0, Math.ceil(ch.hp == null ? mh : ch.hp)))} / ${N(mh)}`; break; }
      case 'cp': v = N(Math.round(combatPower(dOf('slaying')))); break;
      case 'travel': v = ch.travel ? `${REGION_BY[ch.travel.to].name} in ${fmtTime(Math.max(0, (ch.travel.end - now) / 1000))}` : REGION_BY[ch.loc].name; break;
      case 'xfrac': v = pct(exploreFrac(ch, arg)); break;
      case 'quest': { if (ch.quest.done) { v = 'Tutorial complete'; break; } const g = questGoal(ch.quest.step); v = `${g.label} · ${N(Math.min(g.have, g.need))}/${N(g.need)}`; break; }
      case 'foodn': v = N(healFoods().reduce((t, k) => t + ch.inv[k], 0)); break;
    }
    if (el.textContent !== String(v)) el.textContent = v;
  }
  for (const el of $$('[data-w]')) {
    const W0 = el.dataset.w, ci = W0.indexOf(':'), k = ci < 0 ? W0 : W0.slice(0, ci), arg = ci < 0 ? '' : W0.slice(ci + 1); let w = 0;
    if (k === 'xp') { const L = levelFromXp(ch.xp); w = L.need ? L.into / L.need : 1; }
    if (k === 'sxp') { const L = levelFromXp(ch.skills[arg].xp); w = L.need ? L.into / L.need : 1; }
    if (k === 'tier') { const c = ch.prof[arg] || 0, t = tierOf(c), T = BALANCE.tierThresholds; w = t < 9 ? (c - T[t]) / (T[t + 1] - T[t]) : 1; }
    if (k === 'hp') { const mh = derive(ch, now, null, 'slaying').maxHP; w = (ch.hp == null ? mh : Math.max(0, ch.hp)) / mh; }
    if (k === 'travel') w = ch.travel ? (now - ch.travel.start) / (ch.travel.end - ch.travel.start) : 0;
    if (k === 'xfrac') w = exploreFrac(ch, arg);
    if (k === 'quest') { if (ch.quest.done) w = 1; else { const g = questGoal(ch.quest.step); w = g.have / g.need; } }

    el.style.width = (Math.min(1, w) * 100).toFixed(1) + '%';
  }

function clockText() {

// ---------- Loop ----------
let lastT = 0, loopAcc = 0, lastLive = 0, lastSave = Date.now();
function frame(t) {
  if (screen === 'game' && ch) {
    const dt = lastT ? t - lastT : 0;
    if (dt > 5000) { runOffline(dt / 1000, dt > 60000); loopAcc = 0; }
    else { loopAcc += dt; let s = 0; while (loopAcc >= BALANCE.tickMs && s < 60) { step(); loopAcc -= BALANCE.tickMs; s++; } if (s >= 60) loopAcc = 0; }
    const now = Date.now();
    if (now - lastFlush >= BALANCE.logFlushMs) { lastFlush = now; flush(); }
    if (t - lastLive >= 1000 / BALANCE.uiHz) { lastLive = t; updateLive(); if (dirty) { dirty = false; renderMain(); renderActions(); renderTop(); } }
    if (now - lastSave >= BALANCE.autosaveMs) { lastSave = now; save(); }
    if (now - (frame.sec || 0) >= 2000) { frame.sec = now; checkSecrets(); eventTick(); loreTick(); qolTick(); refreshScenes(); }
    drawBars();
  }
  lastT = t; requestAnimationFrame(frame);
}

    </div></div></div>`;

function tabPets() {
  const sl = supportSlots(ch), bl = ch.skills.beastmastery, lx = levelFromXp(bl.xp), eggs = Object.keys(ch.inv).filter(k => ITEM(k) && ITEM(k).type === 'egg');

  const sel = petSel && petById(ch, petSel) ? petById(ch, petSel) : null;

    <p class="mute" style="margin:0;font-size:14px">One active pet at full strength (it also fights beside you), and ${sl} support slot${sl === 1 ? '' : 's'} at ${pct(PET_CFG.supportMult)} strength${nextSlot ? `; the next opens at Beastmastery ${nextSlot}` : ''}${ch.cls === 'beastmaster' ? ' (Beastmaster: +1 slot, +25% strength)' : ''}. Pets earn ${pct(PET_CFG.activeXp)} of your XP when active, ${pct(PET_CFG.supportXp)} in support. Keep them fed: a hungry pet works at half strength.</p>
    <div class="card" style="margin-top:12px"><div class="spread"><h3>Incubators</h3>${incubCost() ? `<button class="sm ${ch.gold >= incubCost() ? 'pri' : ''}" data-act="buyincub" ${ch.gold >= incubCost() ? '' : 'disabled'}>Another incubator · ${N(incubCost())}g</button>` : '<span class="chip">Max</span>'}</div>
      <p class="mute" style="margin:4px 0 8px;font-size:14px">Eggs hatch after their time or after enough of your actions, whichever comes first. They keep going while you are offline.</p><div class="incubs">${incub}</div></div>
    ${ch.pets.length ? `<div class="spread" style="margin-top:14px"><h3>Your pets (${ch.pets.length})</h3><button class="sm" data-act="petfeedall">Feed slotted pets</button></div><div class="petgrid">${roster.map(p => petCard(p, p.uid === ch.petActive ? 'Active' : ch.petSupport.includes(p.uid) ? 'Support' : '')).join('')}</div>${sel ? petDetail(sel) : '<p class="mute">Pick a pet to see it up close.</p>'}` : `<div class="card" style="margin-top:12px"><p style="margin:0">No pets yet. Eggs turn up rarely from anything you do, from region bosses, weekly quests and the shop. Characters who finished the tutorial get a starter egg.</p></div>`}

        <div class="grid" style="gap:6px">${PET_HATS.map(([id, n, c]) => { const own = ch.cosmetics.hats.includes(id), p = petPrice(c); return `<div class="prow"><span>${esc(n)}</span>${own ? '<span class="chip on">Owned</span>' : `<button class="sm" data-act="buycos" data-arg="hat|${id}" ${ch.gold >= p ? '' : 'disabled'}>${N(p)}g</button>`}</div>`; }).join('')}

    </div>`;
}
function tabCollection() {
  const C = collectionPct(ch), tabs = [['pets', 'Pets'], ['monsters', 'Monsters'], ['items', 'Items'], ['regions', 'Regions']];
  const head = `<div class="spread"><h2>Collection</h2></div><p class="mute" style="margin:4px 0 10px">Every 25% of a collection gives a small permanent bonus: pets add gathering yield, monsters add rare drops, items add XP, regions add travel speed.</p>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px">${tabs.map(([k, n]) => { const steps = COLLECTION_STEPS.filter(t => C[k] >= t - 1e-9).length; return `<button class="card collcard ${collTab === k ? 'on' : ''}" data-act="colltab" data-arg="${k}"><b>${n}</b><div class="num" style="font-size:22px">${Math.floor(C[k] * 100)}%</div><div class="bar"><i style="width:${(C[k] * 100).toFixed(1)}%"></i></div><div class="mute" style="font-size:12px">${steps ? esc(modsText(COLLECTION_BONUS[k], steps)) : 'No bonus yet'}</div></button>`; }).join('')}</div>`;
  let body = '';

    body = Object.entries(groups).map(([g, ks]) => `<h4 class="shopgrp">${esc(g[0].toUpperCase() + g.slice(1))} <span class="mute">${ks.filter(k => ch.seen[k]).length} / ${ks.length}</span></h4><div class="row" style="gap:4px">${ks.map(k => ch.seen[k] ? `<span class="chip" style="font-size:12px">${esc((ITEM(k) || RES_BY[k]).name)}</span>` : '<span class="chip mute" style="font-size:12px">???</span>').join('')}</div>`).join(''); }
  else body = `<div class="dex">${REGIONS.filter(r => !r.secret || ch.visited[r.id]).map(r => `<div class="dexcell ${ch.visited[r.id] ? '' : 'unk'}"><span>${ch.visited[r.id] ? esc(r.name) : '???'}</span><span class="mute" style="font-size:11px">${ch.visited[r.id] ? `Explored ${pct(exploreFrac(ch, r.id))}` : 'Not visited'}</span></div>`).join('')}</div>`;
  return head + `<div style="margin-top:14px">${body}</div>`;
}

// ---------- Save codes (v0.9b: compact + compressed) ----------
const SAVE_DROP = { log: [], clog: [], snap: null, _petPower: 0 };
function compactAccount() {
  return JSON.stringify(account, function (k, v) {
    if (this && this.skills && Object.prototype.hasOwnProperty.call(SAVE_DROP, k)) return SAVE_DROP[k];
    if (typeof v === 'number' && !Number.isInteger(v) && Number.isFinite(v)) return Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 1000) / 1000;
    return v;
  });
}
const b64u = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64u = str => { const b = atob(str.replace(/-/g, '+').replace(/_/g, '/')); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
async function streamBytes(bytes, T) { return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(T)).arrayBuffer()); }
async function makeSaveCode() {
  const json = compactAccount();
  if (typeof CompressionStream === 'function') { try { return 'TF2.' + b64u(await streamBytes(new TextEncoder().encode(json), new CompressionStream('deflate-raw'))); } catch (e) { } }
  return btoa(unescape(encodeURIComponent(json)));
}
async function readSaveCode(code) {
  code = String(code || '').replace(/\s+/g, '');
  if (code.startsWith('TF2.')) return JSON.parse(new TextDecoder().decode(await streamBytes(unb64u(code.slice(4)), new DecompressionStream('deflate-raw'))));
  return JSON.parse(decodeURIComponent(escape(atob(code))));
}
