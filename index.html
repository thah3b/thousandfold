<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thousandfold v1.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
/* VOICE   occasion: a game, dark-fantasy, readable like a ledger kept by lamplight
   IDEA    a miner's tally book: ruled rows, stamped tier marks, a lamp glow on what is running
   PICTURE the live game itself; a lit cliff face of ore seams on the title screen
   COLOUR  soot ground, parchment ink, ember red-orange accent, verdigris support, gold for coin
   TYPE    IM Fell English SC for headings + Alegreya Sans for text and numbers
   LAYOUT  laptop: nav | play area | actions + log; phone: top bar, nav strip, actions, play area, log */
:root{color-scheme:light dark;
--bg:light-dark(#f3ece3,#14100e);--panel:light-dark(#fffaf3,#1d1613);--panel2:light-dark(#ece2d5,#271e1a);
--line:light-dark(#d8c9b7,#3a2d27);--ink:light-dark(#22180f,#f0e5d6);--mute:light-dark(#6a594b,#b3a291);
--ember:light-dark(#c13d16,#ff6b3d);--ember2:light-dark(#e2774d,#ffad87);--verd:light-dark(#1d7a66,#5cc0a8);
--gold:light-dark(#8f6200,#f0c75e);--bad:light-dark(#b3261e,#ff7b72);--glow:light-dark(rgba(193,61,22,.12),rgba(255,107,61,.16))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Alegreya Sans',system-ui,sans-serif;overflow-x:clip}
body.large{font-size:18px}
h1,h2,h3,.fell{font-family:'IM Fell English SC',Georgia,serif;font-weight:400;letter-spacing:-.01em;line-height:1.05;margin:0}
h1{font-size:clamp(40px,7vw,72px)}h2{font-size:30px}h3{font-size:21px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 14px;min-height:40px}
button:hover{border-color:var(--ember2)}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--ember);border-color:var(--ember);color:#fff;font-weight:700}
button.pri:hover{filter:brightness(1.08)}
button.ghost{background:transparent}
button.sm{min-height:32px;padding:4px 10px;font-size:14px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:16px;min-height:44px}
.mute{color:var(--mute)}.bad{color:var(--bad)}.gold{color:var(--gold)}.ember{color:var(--ember)}.verd{color:var(--verd)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:14px;background:var(--panel2);white-space:nowrap}
.chip.on{border-color:var(--ember);background:var(--glow)}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ember),var(--ember2));border-radius:99px}
.bar.xp>i{background:linear-gradient(90deg,var(--verd),color-mix(in srgb,var(--verd) 60%,#fff))}
.bar.flow>i{width:100%!important;background:repeating-linear-gradient(110deg,var(--ember) 0 14px,var(--ember2) 14px 28px);background-size:60px 100%;animation:flow .6s linear infinite}
@keyframes flow{to{background-position:60px 0}}
.tier{font-family:'IM Fell English SC',serif;font-size:14px;border:1px solid currentColor;border-radius:6px;padding:0 7px;white-space:nowrap}
.t7{color:var(--verd)}.t10{color:var(--gold);box-shadow:0 0 12px color-mix(in srgb,var(--gold) 50%,transparent)}
.ico{width:34px;height:34px;flex:none}
.grid{display:grid;gap:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}

/* ----- phase 3 ----- */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ember);box-shadow:0 0 8px var(--ember);vertical-align:middle}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px;margin-top:8px}
.eslot{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:14px}
.eslot .ico{width:28px;height:28px}.eico{width:28px;height:28px;border:1px dashed var(--line);border-radius:6px}
.recipe{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px}
.recipe.running{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember),0 0 24px var(--glow)}.recipe.locked{opacity:.6}
.recipe .chip{font-size:13px;padding:2px 8px}.recipe .chip .ico{width:18px;height:18px}
.chip.short{border-color:var(--bad);color:var(--bad)}
.ract{align-self:center}
/* ----- phase 4 ----- */
.mapwrap{border:1px solid var(--line);border-radius:14px;overflow-x:auto;overflow-y:hidden;margin-top:14px;background:var(--panel)}
.worldmap{display:block;width:100%;min-width:620px;height:auto}
.worldmap .mg0{stop-color:light-dark(#efe3d2,#2a1f1a)}.worldmap .mg1{stop-color:light-dark(#e2d3be,#151010)}
.worldmap .route{stroke:var(--mute);stroke-width:2.5;stroke-dasharray:6 6}.worldmap .route.dim{opacity:.25}
.worldmap .rmin{font-size:12px;fill:var(--mute);text-anchor:middle;paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.worldmap .node{cursor:pointer}.worldmap .node circle{fill:var(--panel2);stroke:var(--line);stroke-width:2}
.worldmap .node.known circle{fill:color-mix(in srgb,var(--verd) 30%,var(--panel2));stroke:var(--verd)}
.worldmap .node.near circle{stroke:var(--ink)}.worldmap .node.fog{opacity:.5}.worldmap .node.sealed{opacity:.55}
.worldmap .node.here circle{fill:var(--ember);stroke:var(--ember2);stroke-width:3}
.worldmap .node.sel circle{stroke:var(--gold);stroke-width:4}
.worldmap .node.to circle{stroke:var(--gold);stroke-dasharray:4 3}
.worldmap .nlv{font-size:14px;font-weight:700;text-anchor:middle;fill:var(--ink)}.worldmap .node.here .nlv{fill:#fff}
.worldmap .nname{font-family:'IM Fell English SC',Georgia,serif;font-size:17px;text-anchor:middle;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.worldmap .nreq{font-size:12px;text-anchor:middle;fill:var(--bad);paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.worldmap .node:focus-visible circle{stroke:var(--ember);stroke-width:4}
#traveller{fill:var(--gold);stroke:#000;stroke-width:2}
.area{display:grid;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}.area.shut{opacity:.6;border-style:dashed}
.enemy.boss{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.enemy.running{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember),0 0 24px var(--glow)}
.enemy .chip{font-size:13px;padding:2px 8px}
.hpbar>i{background:linear-gradient(90deg,#c0392b,#e8664f)}
.ehp>i{background:linear-gradient(90deg,#6b2a8a,#a855d6)}
.qtrack{display:grid;gap:4px;text-align:left;padding:10px;width:100%}
.quest.cur{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember)}.quest.todo{opacity:.55}.quest.done{opacity:.8}
.clog div{padding:2px 0;border-bottom:1px dotted var(--line)}
/* ----- phase 5 ----- */
.tierpath{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.tierbox{display:grid;gap:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);align-content:start}
.tierbox.done{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--panel))}.tierbox.next{border-color:var(--ember);border-style:dashed}
.qstep{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.qstep>span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;border:1px solid var(--line)}
.qstep.done{opacity:.7}.qstep.done>span{background:var(--verd);color:#fff;border-color:var(--verd)}.qstep.cur{border-color:var(--ember)}.qstep.cur>span{border-color:var(--ember);color:var(--ember)}
.qstep .bar{margin-top:4px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.tnode{display:grid;gap:6px;align-content:start}.tnode.has{border-color:var(--verd)}.tnode.active{border-left:4px solid var(--ember)}.tnode.cap{border-left:4px solid var(--gold)}
.cres>i{background:linear-gradient(90deg,#d97706,#facc15)}
@media (max-width:640px){.tierpath{grid-template-columns:repeat(2,minmax(0,1fr))}}
.asell{gap:4px}.asell .chip{font-size:12px;padding:2px 8px;min-height:28px}
.shopgrp{margin:14px 0 6px;font-size:15px;color:var(--mute);font-weight:700}
.shoprow>.row{justify-content:flex-end}
.bond>i{background:linear-gradient(90deg,#be185d,#f472b6)}
.ego.running{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember)}
.offer.taken{opacity:.6}
.pnote{border-top:1px solid var(--line);padding:8px 0}.pnote summary{cursor:pointer}.pnote ul{margin:6px 0 0;padding-left:20px;font-size:15px}.pnote li{margin:3px 0}
/* ----- title / select / wizard ----- */
.screen{max-width:1180px;margin:0 auto;padding:clamp(16px,3vw,40px) max(16px,3vw)}
.hero{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);min-height:260px;display:grid;align-items:end;background:#120d0b}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .txt{position:relative;padding:24px;color:#f6ead9}
.hero .txt p{margin:6px 0 0;max-width:46ch;color:#e5d4bf}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px;margin-top:18px}
.slot{display:grid;gap:10px;align-content:start;min-height:190px}
.slot.empty{place-items:center;align-content:center;text-align:center;border-style:dashed;min-height:120px}
.portrait{width:64px;height:72px;flex:none}
.wz{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;margin-top:18px;align-items:start}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.steps span{font-size:14px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.steps span.on{color:var(--ink);border-color:var(--ember);background:var(--glow)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px}
.opt{text-align:left;display:grid;gap:4px;padding:12px;border-radius:10px;background:var(--panel);min-height:44px;align-content:start}
.opt.on{border-color:var(--ember);background:var(--glow);box-shadow:inset 0 0 0 1px var(--ember)}
.opt b{font-size:17px}.opt small{color:var(--mute);font-size:14px;line-height:1.35}
.opt.locked{opacity:.6}
.preview{position:sticky;top:16px}
.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-weight:700}
.err{color:var(--bad);font-size:14px;min-height:1.2em}

/* ----- game shell ----- */
.app{display:grid;grid-template-columns:200px minmax(0,1fr) 330px;grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"top top top" "nav main act" "nav main side";min-height:100%}
.top{grid-area:top;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px max(16px,1.5vw);border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.brand{font-family:'IM Fell English SC',serif;font-size:24px;color:var(--ember);margin-right:6px}
.cur{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:15px}
.milestone{margin-left:auto;display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:4px 10px;background:var(--panel2);font-size:14px;max-width:100%}
.milestone b{color:var(--gold);font-weight:700}
nav.side{grid-area:nav;border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px;background:var(--panel)}
nav.side button{text-align:left;border:0;background:transparent;padding:8px 12px;min-height:40px;border-radius:8px}
nav.side button.on{background:var(--glow);color:var(--ember);font-weight:700}
nav.side button.later{color:var(--mute);font-size:15px}
nav.side .sep{font-size:13px;color:var(--mute);padding:12px 12px 4px}
main{grid-area:main;padding:18px max(16px,1.6vw) 40px}
.act{grid-area:act;border-left:1px solid var(--line);padding:14px 14px 0;background:var(--panel)}
.sidepanel{grid-area:side;border-left:1px solid var(--line);padding:14px;background:var(--panel);display:grid;gap:14px;align-content:start}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{width:16px;height:16px;border-radius:4px;border:1px solid var(--ember);background:transparent}
.pips i.u{background:var(--ember)}
.aslot{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:var(--panel2)}
.aslot.vein{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 18px color-mix(in srgb,var(--gold) 35%,transparent)}
.aslot .meta{font-size:13px;color:var(--mute)}
.float{position:absolute;right:56px;top:6px;color:var(--gold);font-weight:700;pointer-events:none;animation:rise 1.1s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-26px)}}
.log{max-height:340px;overflow:auto;font-size:14px;display:grid;gap:2px}
.log div{padding:3px 0;border-bottom:1px dotted var(--line)}
.log .k-tier{color:var(--verd)}.log .k-lucky{color:var(--gold)}.log .k-level{color:var(--ember)}.log .k-sys{color:var(--mute)}
.ore{display:grid;gap:8px;position:relative}
.ore.running{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember),0 0 24px var(--glow)}
.ore.locked{opacity:.7}
.ore .head{display:flex;gap:10px;align-items:center}
.kv{display:grid;grid-template-columns:auto auto;justify-content:space-between;gap:2px 12px;font-size:14px}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.ptable{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:34px minmax(110px,1.3fr) 110px minmax(120px,1.4fr) 70px 70px 90px;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.prow.head{background:transparent;border:0;font-size:13px;color:var(--mute);padding-block:0}
.inv{display:grid;gap:6px}
.irow{display:grid;grid-template-columns:34px minmax(0,1fr) 80px 80px auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dotted var(--line)}
.srow .d{font-size:14px;color:var(--mute)}
.statbtns{display:flex;gap:4px}
.statbtns button{min-width:40px;padding:4px 8px}
.diff{font-size:14px}.up{color:var(--verd)}.down{color:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:30;width:min(340px,calc(100vw - 32px))}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ember);border-radius:10px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .25s ease-out}
.toast.gold{border-left-color:var(--gold)}.toast.verd{border-left-color:var(--verd)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.modal{position:fixed;inset:0;background:rgba(10,6,4,.6);display:grid;place-items:center;z-index:40;padding:16px}
.modal .card{max-width:560px;width:100%;max-height:90vh;overflow:auto}
.flash{position:fixed;inset:0;pointer-events:none;z-index:35;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--gold) 35%,transparent),transparent 60%);animation:fl .7s ease-out forwards}
@keyframes fl{to{opacity:0}}
.later{display:grid;gap:10px;max-width:640px}
.bottomline{font-size:13px;color:var(--mute);margin-top:18px}
.reduced *{animation:none!important;transition:none!important}
@media (max-width:1100px){.app{grid-template-columns:180px minmax(0,1fr) 290px}}
@media (max-width:900px){
 .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "nav" "act" "main" "side"}
 .top{position:static;gap:6px 12px}
 nav.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 8px;position:sticky;top:0;z-index:4}
 nav.side button{flex:none}nav.side .sep{display:none}nav.side button.later{display:none}
 .act,.sidepanel{border-left:0;border-bottom:1px solid var(--line)}
 .act{padding-bottom:12px}
 .milestone{margin-left:0;width:100%}
 .wz{grid-template-columns:minmax(0,1fr)}.preview{position:static;order:-1}
 .toasts{left:16px;right:16px;width:auto}.toast{padding:8px 10px;font-size:15px}.toast:nth-last-child(n+3){display:none}
}
@media (max-width:640px){
 .prow{grid-template-columns:34px minmax(0,1fr) auto}.prow .hide-s{display:none}.prow.head{display:none}
 .irow{grid-template-columns:34px minmax(0,1fr) auto}.irow .hide-s{display:none}.irow>.row{grid-column:1/-1}
 .recipe{grid-template-columns:34px minmax(0,1fr)}.ract{grid-column:1/-1}.ract button{width:100%}
 h2{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* Pets (Phase 8) */
.incubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.incub{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);text-align:center;min-height:120px;justify-content:center}
.incub.empty{border-style:dashed}
.petgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:8px}
.petcard{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:inherit;font:inherit;cursor:pointer}
.petcard>div{flex:1}
.petcard.slotted{border-color:var(--gold)}
.petcard.on{outline:2px solid var(--gold);background:var(--panel2)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.dexcell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:1px solid var(--line);border-radius:8px;text-align:center;font-size:13px}
.dexcell.unk{opacity:.55}
.collcard{text-align:left;color:inherit;font:inherit;cursor:pointer}
.collcard.on{border-color:var(--gold)}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:8px}

/* Discovery pop-ups (v0.9b) */
.modal.discover{z-index:60}
.discard{max-width:420px;text-align:center;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 40px rgba(255,200,90,.25)}
.disckind{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.discard h3{margin:4px 0 6px}
.discard p{margin:0}
.linkbtn{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline;cursor:pointer;font:inherit;min-height:0}

/* Leaderboards (Phase 9) */
.lbtable{display:grid;gap:4px}
.lbrow{display:grid;grid-template-columns:2.4em 1fr auto auto auto;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.lbrow.mine{border-color:var(--gold);background:var(--panel2)}
.lbrow.flag{opacity:.55}
.lbrank{color:var(--mute);text-align:right}
.lbrow:nth-child(-n+3) .lbrank{color:var(--gold);font-weight:700}
.lbname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Social (Phase 10) */
.odot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);opacity:.5;vertical-align:middle}
.odot.on{background:#5fd17a;opacity:1}
.chatbox{display:flex;flex-direction:column}

<script>
// ============================================================
// VERSION & PATCH NOTES
// Version scheme (alpha): v1.1, v1.2 ... with a letter for small fixes (v1.1a). After v1.5 comes v2.0.
// ============================================================
const GAME_VERSION = 'v1.5';
const PATCH_NOTES = [
  { v: 'v1.5', date: '2026-11-25', title: 'Action animations', notes: [
    'Your hero now acts out what you\u2019re doing in a little pixel scene: swinging a pickaxe at a rock, chopping a tree, hoeing crops, casting a line into a pond, cutting herbs, skinning on a drying rack, hammering at the anvil, stirring a cauldron or a cooking pot, weaving at a loom, enchanting at a glowing pedestal, cutting gems, lifting weights, exploring with a map and walking the road when you travel.',
    'Fights show your hero trading blows with the actual monster, with hits, sparks and damage numbers.',
    'Every completed action pops out the item you made or found. Your active pet tags along, and flying pets hover.',
    'The scene lives in the Active actions panel (Full view), on the Character tab and on the Combat tab. With several actions running, click one to show it in the scene.',
    'The scenery matches the region you\u2019re in, and crafting happens indoors.',
    'Don\u2019t want it? Settings \u2192 Comfort \u2192 Action animations. Reduced motion also keeps scenes still.',
  ] },
  { v: 'v1.4', date: '2026-11-25', title: 'Quality of life', notes: [
    'Active actions panel: switch between Full, Compact (a slim row of chips with progress bars) and Hidden. On phones it starts compact, so it no longer pushes everything down. New Stop all button.',
    'Auto mode: fills any free stamina with gathering in your lowest skills. Switch it on from the Active actions panel or Settings.',
    'New Automation settings: auto-use potions (drinks your best potion when a buff runs out), stack potion time (drinking the same potion again adds time, up to 24 hours) and stop at Grandmaster (optionally moving on to the next resource). All off by default except stacking.',
    'Training: a Train all stats button.',
    'Presets (Character tab): save your gear, tools, pets, outfit and Arena plan, and switch between up to 6 setups in one click.',
    'Go buttons: board quests and region stories now take you straight there. If it\u2019s in another region, you travel and it starts when you arrive. Resources from other regions work the same way.',
    'Inventory grid view: item tiles with hover details. Drag gear onto an equipment slot to equip it, or tap a tile for all its options.',
    'A short guided tour for new characters, with a Skip button. Replay it any time from Settings.',
    'Six new colour themes: Ember, Forest, Ocean, Parchment, Midnight and High contrast.',
  ] },
  { v: 'v1.3', date: '2026-11-25', title: 'The Arena', notes: [
    'Faster fights: when your combat power is 50% or more above an enemy\u2019s, the fight takes just 0.1 seconds. Bosses still take their time.',
    'New Arena tab (Adventure \u2192 Arena): fight other players\u2019 heroes for rating. You need to be signed in.',
    'Pick 4 skills from 14 and put them in order. Each turn your hero uses the first one that\u2019s ready, otherwise a basic attack. Your class skill is 20% stronger. A clever plan can beat a stronger hero.',
    'Other players fight the hero you leave in the Arena, even while you\u2019re away. Fights are decided on the server, then played back as an animated battle (or skip straight to the result).',
    '10 Arena tickets a day. Practice opponents fill in when there aren\u2019t enough players near your rating.',
    'Monthly seasons with a leaderboard and six ranks: Bronze, Silver, Gold, Platinum, Diamond and Champion. Each new rank unlocks a Wardrobe piece for good, from the Arena Cape to the Champion\u2019s Laurel. Ratings move halfway back towards 1,000 when a season ends.',
    'Two new achievements: First Blood and Crowd Pleaser.',
  ] },
  { v: 'v1.2', date: '2026-11-25', title: 'The Wardrobe', notes: [
    'New Wardrobe tab (You \u2192 Wardrobe): change your hero\u2019s hat, outfit, cape, held item, hair colour and pose. It\u2019s all cosmetic, so wear whatever you like without losing any stats.',
    '94 pieces to collect. Some are free, some are bought with gold, and others are earned: reach a level, win boss fights, take part in world events, collect pet species, find secrets, earn achievement points or Ascend. Locked pieces tell you how to get them.',
    'New hats include cat ears, bunny ears, a pirate tricorn, a halo, a pumpkin head, a chef\u2019s toque and a crown. New held items include a lantern, a fishing rod, a broom, a balloon and a banner.',
    'Poses: stand, wave, wink, spark or cheer.',
    'Your hero now stands in a little scene on the Character and Wardrobe tabs, with your active pet beside you. Flying pets hover.',
    'Your public profile shows your outfit, pose and pet too.',
    'Two new achievements: Dressed Up and Fashionista.',
  ] },
  { v: 'v1.1a', date: '2026-11-25', title: 'Better-looking heroes', notes: [
    'Hero portraits, companions and townsfolk have been redrawn at twice the detail: bigger heads, big shiny eyes, shaded faces and hair, capes and robes, and much fancier hats and weapons. The wizard hat now has a jewelled band, and staffs glow.',
    'Your look still comes from your race, gender and class, so existing characters update automatically.',
  ] },
  { v: 'v1.1', date: '2026-11-25', title: 'The pixel art update', notes: [
    'Thousandfold has a new look: everything is now pixel art. Every ore, log, crop, fish, herb and hide, every piece of gear and every tool, potions, meals, materials, eggs, monster trophies and the odd bits of junk you find along the way.',
    'Your characters are now little pixel heroes. Race, gender and class change how they look, from elf ears and dwarf beards to the mage\u2019s hat and the farmer\u2019s straw hat, and your Ascension tier still frames the portrait.',
    'Every pet species has its own pixel chibi, and pet hats and auras show up on them.',
    'Every monster has a pixel sprite on the Combat tab, and bosses wear a crown.',
    'Tutorial guides and companions now have faces too.',
    'Thousandfold has an icon: you\u2019ll see it in your browser tab, on the title screen, in the top bar, on player profiles, and on your home screen if you add the game to it.',
  ] },
  { v: 'v1.0', date: '2026-11-25', title: 'Thousandfold 1.0: the alpha begins', notes: [
    'The beta is over! Thousandfold is now in alpha. Thank you to everyone who played the beta. From here, updates count up from v1.1, with a new major version every fifth update.',
    'New Game Guide in Settings: a readable explanation of every system, with a few hints from the locals for those who look closely.',
    'The Map now shows what the locals say about each region you know.',
    'Hidden places and rare oddities are now much harder to stumble on, but persistence always pays off in the end.',
  ] },
  { v: 'v0.15', date: '2026-11-25', title: 'Player profiles', notes: [
    'Every signed-in player now has a public profile showing their characters: class, level and Ascension, title, achievements, collection, pets, companion, sentient weapons, top skills and more.',
    'Click a player\u2019s name in chat, your friends list or the leaderboards to see their profile, and add them as a friend from there.',
    'Share your profile: Account tab \u2192 Your public profile \u2192 Copy link. Anyone can open the link, even without an account.',
    'Prefer privacy? Hide your characters with one click. Others then only see your player name, guild and friend code. Your email and save are never shown.',
  ] },
  { v: 'v0.14', date: '2026-11-25', title: 'Guilds, perks, events and lore', notes: [
    'Guilds (Social \u2192 Guild): found or join a guild of up to 30, with leader, officer and member ranks, guild chat, a shared gold bank, and a weekly guild goal. Every gathering action, craft and won fight counts, and each goal reached (Bronze, Silver, Gold) mails every member a reward. Plus a guild leaderboard. Needs an account.',
    'Ascension perks (Class tab): every Ascension now gives a perk point, including the ones you already have. Spend them on more XP, yield, attack, luck, offline time, stamina or inventory space. Reset for 10 Ember Shards.',
    'World events (Adventure \u2192 Events): every week brings an event that all players share, like a Fishing Derby or a Blood Moon. Holidays bring their own. Do 1,000 actions during an event to take part.',
    'Daily rewards: log in every day to build a streak. Day 7 brings a Rare Egg and Ember Shards, and gold rewards grow each week you keep it up.',
    'Lore Journal (Adventure \u2192 Lore): 30 pages to find by travelling, beating old foes and growing. Some of them know more than they let on.',
    'New achievements for guilds, perks, events, streaks and lore.',
    'Tidier menu: the "Later phases" section is gone. Everything is here now.',
  ] },
  { v: 'v0.13', date: '2026-11-25', title: 'Secrets', notes: [
    'New Secrets tab (Adventure). Track every secret you have found, with hints for the regions you have visited.',
    'The rumours from the starting regions are true. Each of the eight main regions now hides a secret, found by being in the right place at the right time, doing the right thing.',
    'Three hidden regions that are on no map until you find the way: one behind a riddle, one under a mountain, and one where a star came down. Each has its own monsters, a hidden creature, a boss and a unique item.',
    'The Silent Oak\u2019s riddles: five riddles, typed in the Secrets tab. Some answers only count in the right place.',
    'Two secret races can now be unlocked for new characters: Starborn (+30% Lucky Strike and bonus-find chance) and Hollowkin (+1 hour offline cap, +3% action speed).',
    'Every class has a secret of its own.',
    'Easter eggs. Lots of them. No hints.',
    'Find 12 secrets on your account to open a fourth character slot.',
    'Secret titles: most secrets give a title with a small bonus. Three new Secrets achievements.',
    'Some junk items finally have something to say for themselves.',
    'For the game\u2019s admins: a Debug tab and a Progression Simulator for balance testing. Characters that use debug tools stop posting to the leaderboards.',
  ] },
  { v: 'v0.12c', date: '2026-11-25', title: 'Play as a guest', notes: [
    'New welcome screen on your first visit: sign in (Google or email), or play as a guest with no account.',
    'Guests can play everything except the online features (leaderboards, friends, chat, trading, Auction House). Guest saves live only in this browser, so back them up with a save code in Settings. You can sign in any time to move them to the cloud.',
    'Removed the "Thousandfold server (advanced)" connection box from the Account tab.',
  ] },
  { v: 'v0.12b', date: '2026-11-24', title: 'Inventory upgrade prices', notes: [
    'Inventory upgrades are back on the original price curve, at half price: 2,500, 20,000, 125,000, 750,000, then 4.5 million gold, and each one after that costs 6 times the last. Prices still rise with your level.',
    'There is still no limit on how many you can buy. Your 100-slot bag stays.',
  ] },
  { v: 'v0.12a', date: '2026-11-24', title: 'Bigger bags', notes: [
    'Every character now starts with 100 inventory slots instead of 60. Existing characters get +40 slots on top of anything they already bought.',
    'Inventory upgrades (Bank → Storage) are half price, and there is no longer a limit: buy as many as you like. Each one costs 20% more than the last.',
  ] },
  { v: 'v0.12', date: '2026-11-24', title: 'The Auction House', notes: [
    'New in Town: the Auction House. Buy from other players, list your own items for sale, or post a buy order for something you want.',
    'Search any item to see its cheapest listings, the best buy orders, and a 14-day price chart with daily averages, highs, lows and how much sold.',
    'Buying takes the cheapest listings first, up to the most you are willing to pay. If someone already wants what you have, sell to their buy order for an instant sale.',
    'The Auction House keeps a 5% fee from each sale. Listings and buy orders last 2 days; anything unsold, and gold set aside for unfilled orders, comes back through your Mailbox.',
    'Up to 20 listings and 20 buy orders at once. You need an account and a player name to trade.',
    'Mailbox: new Collect all button.',
  ] },
  { v: 'v0.11e', date: '2026-11-24', title: 'No more Lucky Strike flash', notes: [
    'Triple Lucky Strikes no longer flash the whole screen. They still show in the event log and count toward achievements.',
  ] },
  { v: 'v0.11d', date: '2026-11-24', title: 'Account button', notes: [
    'The button on the character screen now says Account login when you are signed out, and shows your email address when you are signed in.',
  ] },
  { v: 'v0.11c', date: '2026-11-24', title: 'Sign in with Google', notes: [
    'Sign in with Google on the Account tab: no password and no confirmation email. Email and password accounts still work.',
    'The Account tab shows which email you are signed in with.',
    'New pages: Privacy policy and Terms of service (links in Settings).',
  ] },
  { v: 'v0.11b', date: '2026-11-24', title: 'Account tab and open names', notes: [
    'The Cloud save tab is now the Account tab (Town). Change your character\u2019s name and gender, and your player name, any time. Race and class are still chosen when a character is created.',
    'Names can now use anything: letters from any language, numbers, symbols, emoji, ( \u0361\u00b0 \u035c\u0296 \u0361\u00b0). Up to 24 characters. Invisible characters and slurs are still blocked.',
    'The game now talks to the server less often: social updates every minute while the game is on screen, and none while it is in the background (cloud saves every 30 minutes in the background).',
    'Old chat messages are cleared after 14 days.',
  ] },
  { v: 'v0.11a', date: '2026-11-24', title: 'Game letters', notes: [
    'The game team can now send letters, with gold or items attached, to one player or to everyone. They arrive in your Mailbox.',
    'You can remove your own chat messages.',
  ] },
  { v: 'v0.11', date: '2026-11-24', title: 'Phase 10: Friends, chat, mail and trading', notes: [
    'New Social section (needs a Thousandfold account on the website). Pick a display name; it is separate from your characters\u2019 names.',
    'Friends: add players by friend code or display name, accept or decline requests, see who is online, remove or block players.',
    'Chat: a World channel for everyone and private chats with friends. Unfriendly words are masked; you can block anyone from their name in chat.',
    'Mailbox: gifts from friends and letters from the game arrive here. Collect attachments into the character you are playing. The Mail button at the top shows unread mail.',
    'Gifts: send a friend gold and up to 5 different items, 20 gifts a day. You can gift up to 1,000 gold, or a quarter of your verified gold earned if that is more. Bound items and sentient or growth weapons can\u2019t be given away.',
    'Secure trading: both offers live on the server. Any change to either offer cancels both confirmations, and the trade happens only when you both confirm the same offers. While you are confirmed, your side is set aside so you can\u2019t spend it twice; if the trade is changed or cancelled it comes straight back.',
  ] },
  { v: 'v0.10c', date: '2026-11-24', title: 'The game has a website', notes: [
    'Thousandfold now has its own website: https://thah3b.github.io/thousandfold/ . Accounts, cloud saves and leaderboards work there.',
    'On the Claude link, the Cloud save tab links to the website and explains how to bring your save over with a save code.',
  ] },
  { v: 'v0.10b', date: '2026-11-24', title: 'Clearer cloud message on the Claude link', notes: [
    'The Cloud save tab on the Claude link now says plainly that accounts work only in the standalone game, and how to move your save there.',
  ] },
  { v: 'v0.10a', date: '2026-11-24', title: 'Thousandfold accounts go live', notes: [
    'The standalone game now connects to the Thousandfold server: create an account with your email on the Cloud save tab to get cloud saves and appear on the leaderboards.',
    'On the Claude link, outside connections are blocked, so the game falls back to browser saves and save codes there and says so on the Cloud save tab.',
  ] },
  { v: 'v0.10', date: '2026-11-24', title: 'Phase 9: Accounts, cloud saves and leaderboards', notes: [
    'New Cloud save tab (Town). Sign in and your characters are saved to the cloud automatically every 5 minutes, or whenever you press Save to cloud now. On a new device, the game offers to load your newer cloud save.',
    'On the game link, your account is your Claude account. Players who can only view the game link can still see the leaderboards; uploading needs edit access to the link. Everyone else keeps browser saves and save codes.',
    'New Leaderboards tab (Adventure): top 100 by Level (shown as A0 \u00b7 Lv for characters who have not ascended), Achievement points, Gold earned, Monsters slain, Pet species and Collection.',
    'Fair play checks: before a character is ranked it is checked (level against XP, skill levels against skill XP, stat points against levels, progress against the character\u2019s age, and its name). The Cloud save tab shows whether each character is eligible and, if not, why.',
    'Groundwork for the standalone game: Thousandfold server accounts (email and password) with cloud saves, leaderboards and the same checks run on the server. Set it up under Cloud save \u2192 Thousandfold server.',
    'Fixed: gold from region story chapters now counts toward Gold earned.',
  ] },
  { v: 'v0.9b', date: '2026-11-24', title: 'Short save codes and discovery pop-ups', notes: [
    'Save codes are now compressed and about 6 times shorter (a two-character save went from about 35,000 to about 6,000 characters), so they fit in a phone clipboard. Old long codes still import.',
    'New save options: Share\u2026 (on phones), Save as file, and Load file\u2026 when importing, for saves too big to paste.',
    'Discovery pop-ups: finding a hidden place, a secret drop, a sentient weapon, a secret pet combo, a new pet species or unlocking a secret achievement now opens a small window that says what you found, with a Close button and a shortcut to the right tab. Several at once queue up; Close all skips the rest.',
    'Turn discovery pop-ups off in Settings \u2192 Comfort if you prefer the old toasts.',
  ] },
  { v: 'v0.9a', date: '2026-11-24', title: 'Crafting unlock fix', notes: [
    'Fixed: Alchemy, Blacksmithing, Enchanting and Jewelcrafting had no recipe at skill level 1, so they could never be levelled. Each crafting skill now opens its easiest recipe at level 1 and the rest of its ladder moves down to match (Alchemy: Production Potion at 1, Scholar\u2019s Tea at 8, and so on).',
    'You still need the ingredients: Production Potion takes Mint, Sage (Herbalism) and a Vial from the shop.',
  ] },
  { v: 'v0.9', date: '2026-11-24', title: 'Phase 8: Pets', notes: [
    'New Pets tab. Eggs drop rarely from anything you do (online and offline), from region bosses (5%), weekly quests, some daily quests and a new "abandoned nest" region event. Common and Rare eggs are sold in the shop; Epic and Legendary eggs in the shard exchange.',
    'Incubators: eggs hatch after their time or after enough of your actions, whichever comes first, and keep going offline. Start with 1 incubator; buy up to 5.',
    'Around 50 species in five rarities (Common to Mythic), each with a size, type tags, a personality, a passive boost and a combat ability. Many evolve as they level, up to level 50.',
    'One active pet at full strength plus support slots at 35% strength, opened by the new Beastmastery skill (levels 10, 30, 60, 90). Beastmasters get an extra slot and +25% pet strength.',
    'Pets get hungry. Feed them any food; hungry pets work at half strength. Happiness also affects strength.',
    'Large and Huge Ground or Flying pets are mounts: +25% / +40% travel speed, and they raise the travel speed cap.',
    'Secret combos for certain pet pairings, breeding for hybrid eggs (four hybrid species), daycare expeditions for resources and pet XP, and a wardrobe of hats and auras.',
    'New Collection tab: pets, monsters, items and regions. Each 25% gives a small permanent bonus.',
    'Existing characters who finished the tutorial get a starter egg from their home region. New characters find one when they beat the tutorial boss.',
    'New achievements for pets and collections; Beastmastery has its own titles and career talents.',
  ] },
  { v: 'v0.8a', date: 'Nov 24', title: 'Patch notes and version', notes: [
    'The current version is shown in Settings, with these patch notes.',
    'Version numbers now follow the build phase (Phase 7 = v0.8). Small updates add a letter (v0.8a, v0.8b, ...).',
  ] },
  { v: 'v0.8', date: 'Nov 24', title: 'Phase 7: Quests, elixirs and training', notes: [
    'Quest boards in every town: 3 dailies (reset at midnight) and 2 weeklies (reset Monday). Hold up to 6. Rewards: gold, Ember Shards and elixirs.',
    'Region stories: a 3-part story in every region. Each part gives +2 to that region’s stat permanently.',
    'Elixirs of Growth: permanent +1 / +3 / +8 stat potions for all 9 stats. Each stat can take up to 150 points from elixirs, with smaller gains near the cap. Brew Lesser and Greater in Alchemy; Mythic drop from region bosses.',
    'Training (Town tab): one idle activity per stat that adds a sliver of it each time, up to +5 per stat per day.',
    'Ember Shard exchange in the shop: Mythic Elixirs, Satchel of Holding and top-tier potions. Shards are earned only.',
    '12 new achievements; the Achievements tab shows recent unlocks and how many hidden ones remain.',
    '"While you were away" now shows gold earned and training gains. The Character tab shows stats from elixirs and training.',
  ] },
  { v: 'v0.7', date: 'Nov 24', title: 'Phase 6: Companions, sentient and growth weapons', notes: [
    'Companions (from level 10): one per class, such as Ser Aldren the Paladin for Healers. They level, bond, wear 3 gear pieces, have a small talent tree and a 3-chapter story ending in an oath.',
    'Healer + Paladin: the Paladin is 50% stronger and levels at your pace.',
    'Six sentient weapons with personalities, likes and dislikes. Bond unlocks abilities and story chapters; low bond makes them sulk; full bond Awakens them.',
    'Growth weapon: the Seedling Blade drops from your first region boss. It levels from kills and feeding, then evolves at 20 and 40 along a path set by how you play.',
  ] },
  { v: 'v0.6b', date: 'Nov 24', title: 'Shop and discovery improvements', notes: [
    'Buy ×1 / ×10 / ×100 / ×1,000 or Max in the shop.',
    '24 potions in five tiers per type, with no level or stat requirements, including new +75%, +100% and +150% yield potions.',
    'Undiscovered resources now show as "???" until you unlock them.',
  ] },
  { v: 'v0.6a', date: 'Nov 24', title: 'Economy and Ascension', notes: [
    'Auto-sell for gathered resources (All, or keep 100 / 1,000 / 10,000), plus auto-sell junk.',
    'Shop prices and gold costs now rise with your level so gold stays meaningful. Flooding the market drops prices further.',
    'Ascension: at tier 4 and level 99, reset your level to 1 and keep everything else, for permanent bonuses. Shown as "A1 · Lv 1" after your first.',
  ] },
  { v: 'v0.6', date: 'Nov 24', title: 'Phase 5: Classes and talents', notes: [
    'Every class has an innate passive and a talent tree with active skills powered by its resource (Rage, Mana...).',
    'Class advancement at levels 25, 60 and 99: a class goal, a trip to your master and a trial boss. Choose a specialization at tier 2.',
    'Career trees for every skill and a general tree. Second path (half of another class’s passive) and Reforge Destiny (change class).',
  ] },
  { v: 'v0.5', date: 'Nov 24', title: 'Phase 4: World, combat and tutorials', notes: [
    'World map with 8 regions, fog of war, timed travel, road encounters and fast carriages.',
    'Exploration skill reveals areas, boss lairs and hidden places.',
    'Auto-battle combat with the Slaying skill, 66 enemies, region bosses with special mechanics, rarity loot and unique gear.',
    'A 10-quest tutorial in every starting region; finishing it opens the world map.',
  ] },
  { v: 'v0.4b', date: 'Nov 24', title: 'Simpler character creation', notes: [
    'The first page is now just name, gender and race. Appearance options were removed.',
  ] },
  { v: 'v0.4a', date: 'Nov 24', title: 'Faster unlocks', notes: [
    'The next resource in a chain now unlocks at 1,000 completions (was 10,000), about 10 minutes early on.',
    'Gathering XP raised to match, so level requirements don’t become a wall.',
  ] },
  { v: 'v0.4', date: 'Nov 24', title: 'Phase 3: Gathering, crafting and equipment', notes: [
    'Woodcutting, Farming, Fishing, Herbalism and Skinning chains.',
    'Six crafting skills with per-recipe mastery and quality rolls.',
    'Full equipment, tool belt and +1 to +10 upgrades.',
    'Shop, travelling merchant, bank and savings.',
  ] },
  { v: 'v0.3', date: 'Nov 24', title: 'Phases 1–2: First playable', notes: [
    'Character creation, 36 ores with per-ore mastery, stamina multitasking, offline progress.',
    'Stats with 20 points per level, potions, titles and achievements.',
  ] },
];

// ============================================================
// BALANCE CONFIG — every tunable number lives here.
// ============================================================
const BALANCE = {
  tickMs: 100,                 // internal engine step
  minActionSec: 0.1,           // hard floor
  uiHz: 4,                     // number refreshes per second
  logFlushMs: 1000,            // aggregate log lines once per second
  autosaveMs: 30000,

  // Proficiency tiers (completions needed to reach T1..T10)
  tierThresholds: [0, 10, 50, 200, 750, 2500, 10000, 25000, 50000, 100000],
  tierYieldBonus: [0, 0, 0, 0, 0, 0, 0.5, 1.0, 1.5, 2.0],
  tierNames: ['T1','T2','T3','T4','T5','T6','Mastered','T8','T9','Grandmaster'],
  stoneTierTimes: [4, 2, 1, 0.5, 0.25, 0.1],
  unlockAt: 1000,              // completions of resource N needed to unlock resource N+1 (~10 min early on)
  speedBonusCap: 0.5,          // tools + AGI + buffs, total

  // Gathering chain generation. xpGrowth is derived: level.g^levelStep / chainHoursGrowth,
  // so every chain paces like the ore chain (each step takes a little longer than the last).
  chainHoursGrowth: 1.08, maxReq: 97,
  chains: {
    mining:      { start: 4, end: 12, flatUntil: 5, valueGrowth: 1.7,  staminaEvery: 10 },
    woodcutting: { start: 3, end: 10, flatUntil: 4, valueGrowth: 1.75, staminaEvery: 10 },
    farming:     { start: 5, end: 14, flatUntil: 4, valueGrowth: 1.75, staminaEvery: 10 },
    fishing:     { start: 4, end: 12, flatUntil: 4, valueGrowth: 1.75, staminaEvery: 10 },
    herbalism:   { start: 3, end: 10, flatUntil: 4, valueGrowth: 1.75, staminaEvery: 10 },
    skinning:    { start: 5, end: 14, flatUntil: 3, valueGrowth: 2.2,  staminaEvery: 7 },
  },
  junkChance: 0.005,

  // Crafting
  craft: {
    baseTimeMin: 3, baseTimeMax: 10,      // base time scales with recipe level
    valueMult: 1.4, xpMult: 1.2,          // output value / xp vs. inputs
    extraChance: [0.25, 0.35, 0.45, 0.6], // T7..T10 chance of +50% output

function buildResources(B) {
  const out = [];
  for (const [skill, txt] of Object.entries(CHAIN_DEFS)) {
    const c = B.chains[skill], rows = txt.trim().split('\n').map(l => l.split('|')), n = rows.length;
    const step = (B.maxReq - 1) / (n - 1), xpGrowth = Math.pow(B.level.g, step) / B.chainHoursGrowth;
    rows.forEach(([name, color, flavor], k) => {
      const i = k + 1, id = slug(name).replace(/^hell_ore$/, 'hell_ore');
      const base = i <= c.flatUntil ? c.start : c.start + (c.end - c.start) * (i - c.flatUntil) / (n - c.flatUntil);
      out.push({ id: skill === 'mining' && name === 'Primordial Ore' ? 'primordial' : skill === 'mining' && name === 'Worldheart Ore' ? 'worldheart' : id,
        name, color, flavor, skill, index: i, chainLen: n,
        baseTime: Math.round(base * 100) / 100,
        stamina: 1 + Math.floor((i - 1) / c.staminaEvery),
        baseYield: 1,
        value: Math.max(1, Math.round(Math.pow(c.valueGrowth, i - 1))),
        xp: Math.round(Math.pow(xpGrowth, i - 1) * 10) / 10,
        reqLevel: Math.min(B.maxReq, Math.round(1 + (i - 1) * step)),
        band: skill === 'mining' ? ORE_REGIONS[k] : Math.min(7, Math.floor(k / n * 8)),
        region: REGION_BANDS[skill === 'mining' ? ORE_REGIONS[k] : Math.min(7, Math.floor(k / n * 8))],
        rarity: Math.min(5, Math.floor(k / n * 6)),
        type: 'resource',
      });
    });
  }
  for (const r of out) r.grandTitle = GRANDMASTER_TITLES[r.id] || (r.name + ' Grandmaster');
  return out;
}

// Derive recipe numbers and output values from inputs (dependency order is the order they were defined).
function finishContent(B, RES) {
  for (const it of Object.values(ITEMS)) if (it.type === 'potion') { const E = B.economy; it.cost = Math.max(10, Math.round(E.potionUnit[it.skill ? 'skill' : it.cat] * Math.pow(it.power, E.potionExp) * it.mins / 60)); if (it.shopOnly) it.value = Math.round(it.cost * 0.2); }
  const ref = {};
  for (const r of RES) ref[r.id] = { value: r.value, xp: r.xp, lvl: r.reqLevel };
  for (const [id, it] of Object.entries(ITEMS)) if (it.type === 'supply') ref[id] = { value: it.value, xp: 0.5, lvl: 1 };
  for (const rc of RECIPES) {
    let v = 0, x = 0, l = 1;
    for (const [i, q] of Object.entries(rc.inputs)) { const r = ref[i]; if (!r) throw new Error('Unknown input ' + i + ' in ' + rc.id); v += r.value * q; x += r.xp * q; l = Math.max(l, r.lvl); }
    rc.lvl = l; rc.xp = Math.round(x * B.craft.xpMult * 10) / 10 + 1;
    rc.baseTime = Math.round((B.craft.baseTimeMin + (B.craft.baseTimeMax - B.craft.baseTimeMin) * (l - 1) / 98) * 100) / 100;
    rc.stamina = 1 + Math.floor((l - 1) / 33);
    const outVal = Math.max(1, Math.ceil(v * B.craft.valueMult / rc.qty));
    const tgt = rc.gearOut ? GEAR[rc.out] : ITEMS[rc.out];
    tgt.value = tgt.value || outVal; tgt.lvl = tgt.lvl || l;
    // shop cost stays the designed base; the shop applies a floor of 1.5x value so buying to resell never pays
    if (tgt.type === 'food') { tgt.heal = Math.round(30 + l * 25 * (Object.keys(tgt.fx || {}).length ? 0.6 : 1)); if (!Object.keys(tgt.fx || {}).length) tgt.desc = `Heals ${tgt.heal} HP. Eaten automatically in combat when HP runs low.`; else tgt.desc += ` Heals ${tgt.heal} HP.`; }
    ref[rc.out] = { value: tgt.value, xp: rc.xp, lvl: l };
  }
  // Potions sell for at most half their level-1 shop price, so tiers stay in order and buying to resell never pays.
  for (const it of Object.values(ITEMS)) if (it.type === 'potion') it.value = Math.max(1, Math.min(it.value || 1, Math.round(it.cost * 0.5)));
}

// ---------- Ascension perks: one point per Ascension, spent here. ----------
const PERKS = [
  { id:'hands', name:'Old Hands', text:'+5% XP from everything', max:5, mods:{ xp:0.05 } },
  { id:'steady', name:'Steady Hands', text:'+5% gathering and crafting yield', max:5, mods:{ gyield:0.05, cyield:0.05 } },
  { id:'veteran', name:'Veteran', text:'+5% attack and max HP', max:5, mods:{ atk:0.05, hp:0.05 } },
  { id:'fortune', name:'Fortune’s Favour', text:'+1% Lucky Strike chance', max:5, mods:{ luckStrike:0.01 } },
  { id:'eyes', name:'Sharp Eyes', text:'+1% bonus-find chance', max:5, mods:{ bonusFind:0.01 } },
  { id:'gilded', name:'Gilded Touch', text:'+5% gold from selling', max:5, mods:{ sell:0.05 } },
  { id:'swift', name:'Swift Return', text:'+1 hour offline cap', max:4, mods:{ offlineH:1 } },
  { id:'wind', name:'Second Wind', text:'+1 stamina (one more action at a time)', max:2, mods:{ stamina:1 } },
  { id:'pockets', name:'Deep Pockets', text:'+20 inventory slots', max:5, slots:20 },
];
const PERK_BY = Object.fromEntries(PERKS.map(p => [p.id, p]));
const PERK_RESET_SHARDS = 10;
const perkSpent = c => Object.values(c.perks || {}).reduce((s, n) => s + n, 0);
const perkFree = c => (c.ascension || 0) - perkSpent(c);
function perkMods(c, M) { for (const [id, n] of Object.entries(c.perks || {})) { const p = PERK_BY[id]; if (p && p.mods && n > 0) addMods(M, p.mods, n); } }
function buyPerk(id) {
  const p = PERK_BY[id]; ch.perks = ch.perks || {};
  if (!p || perkFree(ch) < 1 || (ch.perks[id] || 0) >= p.max) return;
  ch.perks[id] = (ch.perks[id] || 0) + 1;
  if (p.slots) ch.invSlots += p.slots;
  ch.counters.perksSpent = perkSpent(ch);
  addLog('lucky', `Ascension perk: ${p.name} ${ch.perks[id]}/${p.max}.`); toast(`<b>${esc(p.name)}</b> ${ch.perks[id]}/${p.max}`, 'gold'); chime(659, 988);
  dirty = true; save();
}
function resetPerks() {
  if (account.shards < PERK_RESET_SHARDS || !perkSpent(ch)) return;
  const pk = (ch.perks || {}).pockets || 0; ch.invSlots -= pk * PERK_BY.pockets.slots;
  account.shards -= PERK_RESET_SHARDS; ch.perks = {}; addLog('sys', 'Ascension perks reset.'); dirty = true; save();
}
function perkCard() {
  const free = perkFree(ch), spent = perkSpent(ch);
  return `<div class="card" style="margin-top:14px"><div class="spread"><h3>Ascension perks</h3><span class="chip ${free ? 'on' : ''}">${free} point${free === 1 ? '' : 's'} to spend</span></div>
    <p class="mute" style="margin:4px 0 10px;font-size:14px">${ch.ascension ? `Every Ascension gives one perk point. You have ascended ${ch.ascension} time${ch.ascension === 1 ? '' : 's'}.` : 'Every Ascension gives one perk point to spend here. Ascend for the first time to earn one.'}</p>
    <div class="perks">${PERKS.map(p => { const n = (ch.perks || {})[p.id] || 0, can = free > 0 && n < p.max;
      return `<div class="perk ${n ? 'has' : ''}"><div class="spread"><b>${esc(p.name)}</b><span class="pips">${'●'.repeat(n)}${'○'.repeat(p.max - n)}</span></div><div class="mute" style="font-size:13px">${esc(p.text)} per rank${n ? ` · now ${esc(perkNow(p, n))}` : ''}</div>
        <button class="sm ${can ? 'pri' : ''}" data-act="perk" data-arg="${p.id}" ${can ? '' : 'disabled'} style="margin-top:6px">${n >= p.max ? 'Maxed' : 'Add a point'}</button></div>`; }).join('')}</div>
    ${spent ? `<div class="row" style="margin-top:10px"><button class="sm ghost" data-act="perkreset" ${account.shards >= PERK_RESET_SHARDS ? '' : 'disabled'}>Reset perks (${PERK_RESET_SHARDS} Ember Shards)</button></div>` : ''}</div>`;
}
function perkNow(p, n) {
  if (p.slots) return `+${p.slots * n} slots`;
  const [k, v] = Object.entries(p.mods)[0];
  return k === 'offlineH' ? `+${v * n} h` : k === 'stamina' ? `+${v * n} stamina` : `+${Math.round(v * n * 100)}%`;
}

  { id:'spooky', name:'Lantern Night', from:[10, 25], to:[11, 1], text:'Lanterns in every window and something in the fog: +15% XP and +15% gathering yield.', mods:{ xp:0.15, gyield:0.15 } },

const EVENT_JOIN_ACTIONS = 1000;
function weekInfo(t) {
  const d = new Date(t), day = (d.getUTCDay() + 6) % 7, mon = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - day);
  return { start: mon, end: mon + 7 * 864e5, n: Math.floor(mon / (7 * 864e5)) };
}
function holidayAt(t) {
  const d = new Date(t), md = (d.getMonth() + 1) * 100 + d.getDate();
  return HOLIDAY_EVENTS.find(h => { const a = h.from[0] * 100 + h.from[1], b = h.to[0] * 100 + h.to[1]; return a <= b ? md >= a && md <= b : md >= a || md <= b; });
}
function worldEventAt(t) {
  const h = holidayAt(t);
  if (h) {
    const d = new Date(t); let start = new Date(d.getFullYear(), h.from[0] - 1, h.from[1]).getTime(); if (start > t) start = new Date(d.getFullYear() - 1, h.from[0] - 1, h.from[1]).getTime();
    const sy = new Date(start).getFullYear(), end = new Date(sy + (h.to[0] < h.from[0] ? 1 : 0), h.to[0] - 1, h.to[1] + 1).getTime();
    return Object.assign({ holiday: true, key: h.id + '-' + sy, start, end }, h);
  }
  const w = weekInfo(t), e = WORLD_EVENTS[((w.n % WORLD_EVENTS.length) + WORLD_EVENTS.length) % WORLD_EVENTS.length];
  // A week that a holiday cuts into ends when the holiday starts.
  let end = w.end; for (let x = t + 36e5; x < w.end; x += 36e5) if (holidayAt(x)) { end = new Date(new Date(x).setHours(0, 0, 0, 0)).getTime(); break; }

}
const worldEvent = () => worldEventAt(Date.now());
function worldEventMods(c, M) { const e = worldEvent(); if (e && e.mods) addMods(M, e.mods, 1); }
function upcomingEvents(n) {
  const out = []; let t = worldEvent().end + 1000;
  while (out.length < n) { const e = worldEventAt(t); if (!out.length || out[out.length - 1].key !== e.key) out.push(e); t = e.end + 1000; }

// Taking part: 1,000 actions during an event earns it for your record.
let evMark = null;
function eventTick() {
  if (!ch || (typeof SIM !== 'undefined' && SIM)) return;
  const e = worldEvent(), tot = (ch.counters.gathered || 0) + (ch.counters.crafted || 0) + (ch.counters.kills || 0);
  ch.events = ch.events || {};
  if (evMark == null || evMark.c !== ch.id) { evMark = { c: ch.id, t: tot }; }
  const d = Math.max(0, tot - evMark.t); evMark.t = tot;

const DAILY = [
  { gold: 300 }, { item: ['potion_prod', 2] }, { gold: 800 }, { item: ['egg_common', 1] }, { gold: 2000 }, { item: ['potion_prod2', 2] }, { item: ['egg_rare', 1], shards: 2 },

const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };

  D_.streak = D_.day === yest ? D_.streak + 1 : 1; D_.day = today; D_.claimed = false; D_.best = Math.max(D_.best || 0, D_.streak);

  if (screen === 'game') toast(`<b>Daily reward ready</b> · day ${D_.streak} of your streak. Collect it in Events.`, 'gold');
}
function dailyText(i) {
  const R = DAILY[i], p = [];
  if (R.gold) { const wk = Math.floor((((ch.daily && ch.daily.streak) || 1) - 1) / 7); p.push(`${N(dailyReward(wk * 7 + i + 1).gold)} gold`); }
  if (R.item) p.push(`${R.item[1] > 1 ? R.item[1] + '\u00d7 ' : ''}${ITEM(R.item[0]).name}`); if (R.shards) p.push(`${R.shards} Ember Shards`);
  return p.join(' + ');
}
function dailyReward(streak) {
  const R = DAILY[(streak - 1) % 7], out = Object.assign({}, R);
  if (R.gold) out.gold = scaled(ch, R.gold * (1 + Math.floor((streak - 1) / 7) * 0.5), 1);
  return out;
}
function claimDaily() {
  const D_ = ch.daily; if (!D_ || D_.claimed) return;
  const R = dailyReward(D_.streak), got = [];
  if (R.gold) { ch.gold += R.gold; ch.counters.goldEarned += R.gold; got.push(`${N(R.gold)} gold`); }
  if (R.item) { addItem(R.item[0], R.item[1], true); got.push(`${R.item[1] > 1 ? R.item[1] + '\u00d7 ' : ''}${ITEM(R.item[0]).name}`); }
  if (R.shards) { account.shards += R.shards; ch.counters.shardsEarned += R.shards; got.push(`${R.shards} Ember Shards`); }
  D_.claimed = true; addLog('lucky', `Daily reward (day ${D_.streak}): ${got.join(', ')}.`); toast(`<b>Day ${D_.streak}:</b> ${esc(got.join(', '))}`, 'gold'); chime(659, 988);
  dirty = true; save();
}

  pvpadd: s => { const sk = pvpSkillsOf(ch); if (sk.length < 4 && !sk.includes(s) && pvpUnlocked(ch, s)) sk.push(s); dirty = true; save(); renderMain(); },
  pvprm: s => { ch.pvp.skills = pvpSkillsOf(ch).filter(x => x !== s); dirty = true; save(); renderMain(); },
  pvpmv: a => { const [i, d] = a.split('|').map(Number), sk = pvpSkillsOf(ch), j = i + d; if (j < 0 || j >= sk.length) return; [sk[i], sk[j]] = [sk[j], sk[i]]; dirty = true; save(); renderMain(); },
  pvpspeed: () => { pvp.fast = !pvp.fast; const b = document.querySelector('[data-act=pvpspeed]'); if (b) b.textContent = `Speed ×${pvp.fast ? 1 : 2}`; },
  pvpskip: () => pvpFinish(),

      pvp.fight = { ...r, i: 0 };
      if (r.win === 0) { ch.counters.pvpWins = (ch.counters.pvpWins || 0) + 1; checkProgress(); }
      ch.counters.pvpFights = (ch.counters.pvpFights || 0) + 1;

      if (r.tier > (account.pvpBest || 0)) { account.pvpBest = r.tier; toast(`<b>${PVP_TIERS[r.tier][0]} rank reached!</b> New Wardrobe piece unlocked.`, 'gold'); }
      dirty = true; save();
      modal(pvpBattleHtml(pvp.fight), 'wide');

  },
};

const QOL_DEFAULTS = { autoMode: false, autoPotion: false, stackPotion: true, gmStop: false, gmNext: false };
const qs = k => account.settings[k] !== undefined ? account.settings[k] : QOL_DEFAULTS[k];
const gmQueue = [];
const PRESET_MAX = 6;

// ---------- Starting actions without pop-ups ----------
function tryStart(id, quiet) {
  const a = ACT(id); if (!a || !isUnlocked(ch, a) || ch.actions.find(x => x.res === id)) return false;
  if (cantStart(a)) return false;
  if (a.inputs && craftable(ch, a) < 1) return false;
  if (a.kind === 'combat' && ch.actions.some(x => ACT(x.res).kind === 'combat')) return false;
  if (staminaUsed() + a.stamina > D().stamina) return false;
  ch.actions.push({ res: id, prog: 0, streak: 0, vein: 0 });
  ch.counters.maxActive = Math.max(ch.counters.maxActive, ch.actions.length);
  if (!quiet) addLog('sys', `Started: ${SKILLS[a.skill].verb} ${a.name}.`);
  dirty = true; return true;
}
function stopAll() {
  const n = ch.actions.length; if (!n) return;
  ch.actions = []; addLog('sys', `Stopped all ${n} action${n > 1 ? 's' : ''}.`); dirty = true;
}

// ---------- Running-tasks panel ----------
const actView = () => account.settings.actView || (typeof window !== 'undefined' && window.innerWidth <= 900 ? 'compact' : 'full');
const ACT_VIEWS = { full: ['Compact', 'compact'], compact: ['Hide', 'hidden'], hidden: ['Show', 'full'] };
function actHeader(view) {

    <span class="row" style="gap:6px;align-items:center"><span class="num">Stamina <b data-live="stam"></b></span>
    <button class="sm chip ${qs('autoMode') ? 'on' : ''}" data-act="set" data-arg="autoMode|${!qs('autoMode')}" title="Auto mode fills free stamina with gathering">Auto ${qs('autoMode') ? 'on' : 'off'}</button>
    ${n ? '<button class="sm ghost" data-act="stopall">Stop all</button>' : ''}
    <button class="sm ghost" data-act="actview" data-arg="${nx[1]}" aria-label="${nx[0]} the actions panel">${nx[0]}</button></span></div>`;
}
function actChips() {
  return `<div class="achips">${ch.actions.map(a => { const o = ACT(a.res); return `<div class="aslot achip" data-res="${o.id}" title="${esc(o.name)} · ${SKILLS[o.skill].name}">${actIcon(o, 22)}<span class="achn">${esc(o.name)}</span><span class="bar"><i></i></span><button class="sm ghost achx" data-act="stop" data-arg="${o.id}" aria-label="Stop ${esc(o.name)}">✕</button></div>`; }).join('')}</div>`;
}
if (typeof window !== 'undefined') { let lastNarrow = null; window.addEventListener('resize', () => { const n = window.innerWidth <= 900; if (n !== lastNarrow) { lastNarrow = n; if (!account.settings.actView && ch && typeof renderActions === 'function') renderActions(); } }); }

// ---------- Automation ----------
const potStrength = it => it.power || Object.values(it.fx || {}).reduce((s, v) => s + v, 0);
function autoPotions() {
  if (!ch.actions.length) return;
  const now = Date.now(), running = new Set(ch.actions.map(a => ACT(a.res).skill)), best = {};
  for (const k of Object.keys(ch.inv)) {
    const it = ITEMS[k]; if (!(ch.inv[k] > 0) || !it || it.type !== 'potion' || !it.cat || it.cat === 'food' || !potStrength(it)) continue;
    if (it.skill && !running.has(it.skill)) continue;
    if (activeBuff(ch, it.cat, now)) continue;
    const s = potStrength(it); if (!best[it.cat] || s > best[it.cat].s) best[it.cat] = { k, s };
  }
  for (const { k } of Object.values(best)) {
    const it = ITEMS[k]; takeItem(k, 1); ch.potions[it.cat] = { id: k, until: now + it.mins * 60000 }; ch.counters.potions++;
    addLog('lucky', `Auto-drank ${it.name}: ${it.desc}`); dirty = true;
  }
}
function processGm() {
  while (gmQueue.length) {
    const id = gmQueue.shift(), r = RES_BY[id]; if (!r || !qs('gmStop') || !ch.actions.find(a => a.res === id)) continue;
    stopAction(id, `${r.name} reached Grandmaster, so it stopped (Settings → Automation).`);
    if (qs('gmNext')) {
      const next = CHAIN[r.skill].filter(x => isUnlocked(ch, x) && availableHere(x) && tierOf(ch.prof[x.id] || 0) < 9 && !ch.actions.find(a => a.res === x.id)).pop();
      if (next && tryStart(next.id)) addLog('sys', `Moved on to ${next.name}.`);
    }
  }
}
function autoFill() {
  if (ch.travel || !ch.quest) return;
  let guard = 0;
  while (guard++ < 12) {
    const free = D().stamina - staminaUsed(); if (free <= 0) return;
    const busy = new Set(ch.actions.map(a => ACT(a.res).skill));
    const skills = GATHER_SKILLS.filter(s => !busy.has(s)).sort((a, b) => ch.skills[a].level - ch.skills[b].level);
    let started = false;
    for (const s of skills) {
      const pick = CHAIN[s].filter(x => isUnlocked(ch, x) && availableHere(x) && x.stamina <= free && !(qs('gmStop') && tierOf(ch.prof[x.id] || 0) >= 9)).pop();
      if (pick && tryStart(pick.id, true)) { addLog('sys', `Auto mode: ${SKILLS[s].verb} ${pick.name}.`); started = true; break; }
    }
    if (!started) return;
  }
}
function qolTick() {
  if (!ch || screen !== 'game') return;
  try { processGm(); if (qs('autoPotion')) autoPotions(); if (qs('autoMode')) autoFill(); } catch (e) { console.warn(e); }
}

// ---------- Train all ----------
function trainAll() {
  let n = 0;
  for (const t of [...TRAINS].sort((a, b) => (ch.trainDay.gained[a.stat] || 0) - (ch.trainDay.gained[b.stat] || 0))) {
    if ((ch.trainDay.gained[t.stat] || 0) >= TRAIN_CFG.dailyCap - 1e-9) continue;
    if (tryStart(t.id, true)) n++;
  }
  if (n) addLog('sys', `Started training ${n} stat${n > 1 ? 's' : ''}.`);
  toast(n ? `Training ${n} stat${n > 1 ? 's' : ''}. ${staminaUsed() >= D().stamina ? 'Stamina is full.' : ''}` : 'Nothing to start: stamina is full or every stat is done for today.');
}

// ---------- Go: travel there and start ----------
function goStart(id) {
  const a = ACT(id); if (!a) return;
  const region = a.kind === 'gather' ? (a.band === 0 ? ch.loc : REGIONS[a.band].id) : a.kind === 'combat' ? a.region : a.kind === 'explore' ? a.id.slice(2) : ch.loc;
  const tabFor = a.kind === 'gather' ? a.skill : a.kind === 'combat' ? 'combat' : a.kind === 'explore' ? 'map' : tab;
  if (region === ch.loc && !ch.travel) {
    if (ch.actions.find(x => x.res === id)) { tab = tabFor; renderMain(); return; }
    if (!tryStart(id)) { const why = cantStart(a) || (staminaUsed() + a.stamina > D().stamina ? 'Not enough free stamina: stop something first.' : 'You can’t start that right now.'); toast(esc(why)); }
    if (a.kind === 'explore') mapSel = region;
    tab = tabFor; renderMain(); renderActions(); return;
  }
  if (ch.travel) { toast('You’re already on the road.'); return; }
  startTravel(region, false);
  if (ch.travel) { ch.travelThen = id; toast(`Travelling to <b>${esc(REGION_BY[region].name)}</b>. ${esc(a.name)} starts when you arrive.`, 'verd'); }
  renderMain(); renderActions(); renderTop();
}
function afterArrive(quiet, notes) {

  const a = ACT(id); if (!a) return;
  const ok = tryStart(id, true), why = !isUnlocked(ch, a) ? 'not unlocked yet' : cantStart(a) || (staminaUsed() + a.stamina > D().stamina ? 'no free stamina' : 'it can’t start right now'), msg = ok ? `Arrived and started ${a.name}.` : `Arrived, but couldn’t start ${a.name}: ${why}.`;
  if (quiet) notes.push(msg); else addLog('sys', msg);
}
function questGoTarget(q) {
  if (q.type === 'gather' || q.type === 'hunt' || q.type === 'boss' || q.type === 'explore') return q.target;
  return null;
}
const QUEST_GO_TAB = { craft: 'blacksmithing', gatherAny: 'mining', kills: 'combat' };

// ---------- Presets ----------
function presetNow(name) {
  return { name: String(name || '').trim().slice(0, 24) || `Preset ${(ch.presets || []).length + 1}`, slots: { ...ch.equip.slots }, tools: { ...ch.equip.tools }, pet: ch.petActive || null, support: [...(ch.petSupport || [])], fashion: { ...(ch.fashion || {}) }, pvp: [...pvpSkillsOf(ch)] };
}
function equipTo(key, where, slot) {
  const it = ITEM(key), need = it.slot === 'tool' ? ch.skills[it.toolSkill].level : gateLevel(ch);
  if (it.lvl > need || !(ch.inv[key] > 0)) return false;
  const old = where[slot]; takeItem(key, 1); where[slot] = key; if (old) addItem(old, 1, true);
  return true;
}
function applyPreset(i) {
  const p = (ch.presets || [])[i]; if (!p) return;
  let missing = 0;
  for (const [s, key] of Object.entries(p.slots || {})) if (key && ch.equip.slots[s] !== key) { if (!equipTo(key, ch.equip.slots, s)) missing++; }
  for (const [s, key] of Object.entries(p.tools || {})) if (key && ch.equip.tools[s] !== key) { if (!equipTo(key, ch.equip.tools, s)) missing++; }
  if (p.pet && ch.pets.some(x => x.uid === p.pet)) { ch.petActive = p.pet; ch.petSupport = (p.support || []).filter(u => u !== p.pet && ch.pets.some(x => x.uid === u)).slice(0, supportSlots(ch)); }
  ch.fashion = Object.fromEntries(Object.entries(p.fashion || {}).filter(([, id]) => FASHION_BY[id] && fashionOwned(ch, FASHION_BY[id])));
  if (Array.isArray(p.pvp)) { ch.pvp = ch.pvp || {}; ch.pvp.skills = p.pvp.filter(s => PVP_SKILLS[s] && pvpUnlocked(ch, s)).slice(0, 4); }
  fitStamina(); checkProgress();
  addLog('sys', `Preset "${p.name}" applied${missing ? ` (${missing} item${missing > 1 ? 's' : ''} not in your bag)` : ''}.`);
  toast(`<b>${esc(p.name)}</b> applied${missing ? ` · ${missing} item${missing > 1 ? 's' : ''} missing` : ''}.`, missing ? '' : 'verd');
  dirty = true; save(); renderMain(); renderActions(); renderSide();
}

      <span class="row" style="gap:4px"><button class="sm pri" data-act="preapply" data-arg="${i}">Apply</button><button class="sm" data-act="presave" data-arg="${i}">Overwrite</button><button class="sm ghost" data-act="predel" data-arg="${i}" aria-label="Delete ${esc(p.name)}">✕</button></span></div>`).join('')}

// ---------- Progress ----------
function addXp(skill, xp, quiet, notes) {

}

// ---------- Actions ----------

      <div class="grid">${ch.actions.map(x => `<button data-act="swap" data-arg="${x.res}|${id}">Swap out ${esc(ACT(x.res).name)} (frees ${ACT(x.res).stamina})</button>`).join('')}</div>

function stopAction(id, why) { ch.actions = ch.actions.filter(a => a.res !== id); if (why) { addLog('sys', why); toast(esc(why)); } dirty = true; }
function fitStamina() { const max = D().stamina; while (staminaUsed() > max && ch.actions.length) { const a = ch.actions.pop(); addLog('sys', `Stopped ${ACT(a.res).name}: not enough stamina.`); } }

// ---------- Engine step (one 100ms tick) ----------
function step() {
  const now = Date.now(), dc = {}, dOf = s => dc[s] || (dc[s] = derive(ch, now, null, s));
  worldTick(now, dOf);
  for (const a of [...ch.actions]) {
    const act = ACT(a.res), sk = act.skill, d = dOf(sk), gather = act.kind === 'gather';
    if (act.kind === 'combat') { combatTick(a, act, d, now); continue; }
    if (act.kind === 'explore') { exploreTick(a, act, d); continue; }
    if (act.kind === 'train') { trainTick(a, act, d); continue; }
    if (a.vein && a.vein < now) { a.vein = 0; dirty = true; }
    if (gather && !a.vein && rng() < BALANCE.richVein.chancePerSec * BALANCE.tickMs / 1000) {
      a.vein = now + BALANCE.richVein.durationSec * 1000; ch.counters.veins++;
      const nm = NODE_BONUS[sk]; addLog('lucky', `${nm}: ${act.name} yield doubled for ${BALANCE.richVein.durationSec}s!`); toast(`<b>${nm}!</b> ${esc(act.name)} yield doubled for ${BALANCE.richVein.durationSec}s`, 'gold'); chime(880, 1320); dirty = true;
    }
    a.prog += BALANCE.tickMs;
    const tms = Math.max(BALANCE.minActionSec * 1000, Math.round(actionSec(act, ch.prof[a.res] || 0, d.speed) * 1000));
    if (a.prog < tms) continue;
    let n = Math.floor(a.prog / tms); a.prog -= n * tms;
    const k0 = tierOf(ch.prof[a.res] || 0);
    const g = agg[a.res] || (agg[a.res] = { units: 0, xp: 0, lucky: 0, triple: 0, finds: 0, n: 0, outs: {} });
    let r;
    if (gather) {

      r = resolveGather(ch, act, n, d, rng, a.vein > now);
      addItem(a.res, r.units, true);

function flush() {

    if (act.kind === 'train') { if (g.gain) addLog('gain', `${act.name}: +${g.gain.toFixed(2)} ${act.stat} today`); continue; }
    let s = act.inputs ? `${SKILLS[sk].past} ${N(g.units)} ${act.name}` + (act.gearOut ? ' (' + Object.entries(g.outs).map(([k, q]) => `${q} ${BALANCE.craft.qualityNames[parseG(k).q]}`).join(', ') + ')' : '') : `${SKILLS[sk].past} ${N(g.units)} ${act.name}`;

// ---------- Offline ----------
function runOffline(sec, show) {
  if (!ch || sec < 1) return;
  if (ch.hp != null && !ch.actions.some(a => ACT(a.res).kind === 'combat')) ch.hp = null;
  if (!ch.actions.length && !ch.travel) return;
  const d0 = D(), cap = d0.offlineH * 3600, use = Math.min(sec, cap);
  const start = Date.now() - sec * 1000, end = start + use * 1000;
  const cuts = [start, ...Object.values(ch.potions).map(p => p.until).filter(t => t > start && t < end), end].sort((a, b) => a - b);
  const sum = {}, notes = [], lv0 = ch.level, stopped = [], gold0 = ch.gold;
  if (ch.travel && ch.travel.end <= Date.now()) arrive(ch.travel.to, true, notes);
  for (let i = 0; i < cuts.length - 1; i++) {
    const len = (cuts[i + 1] - cuts[i]) / 1000; if (len <= 0) continue;
    for (const a of [...ch.actions]) {
      const act = ACT(a.res); if (!isUnlocked(ch, act)) continue;
      const d = derive(ch, cuts[i] + 1, null, act.skill);
      if (act.kind === 'combat') { offlineCombat(a, act, len, d, sum, notes); continue; }
      if (act.kind === 'explore') { offlineExplore(a, act, len, d, sum, notes); continue; }
      if (act.kind === 'train') { offlineTrain(a, act, len, d, sum, notes); continue; }
      const max = act.inputs ? craftable(ch, act) : Infinity;
      const seg = offlineChunks(act, ch.prof[a.res] || 0, len, d.speed, max);
      if (!seg.done) { if (act.inputs) { stopped.push(act.name); ch.actions = ch.actions.filter(x => x !== a); } continue; }
      const s = sum[a.res] || (sum[a.res] = { done: 0, units: 0, xp: 0 });
      let xp;
      if (act.inputs) {
        for (const [k, q] of Object.entries(act.inputs)) takeItem(k, q * seg.done);
        const o = offlineCraftOut(act, seg.chunks, d); xp = o.xp;
        for (const [k, q] of Object.entries(o.out)) { const u = probRound(q, rng); addItem(k, u, true); s.units += u; }
        ch.counters.crafted += seg.done;
        if (craftable(ch, act) < 1) { stopped.push(act.name); ch.actions = ch.actions.filter(x => x !== a); }
      } else {
        if (!ch.inv[a.res] && usedSlots() >= ch.invSlots) { stopped.push(act.name + ' (inventory full)'); ch.actions = ch.actions.filter(x => x !== a); continue; }
        const o = offlineGatherOut(act, seg.chunks, d); xp = o.xp;
        const u = probRound(o.units, rng); addItem(a.res, u, true); s.units += u;
        const jn = probRound(o.junk, rng); if (jn) { const j = JUNK[act.skill][0][0]; if (addItem(j, jn)) ch.counters.junk += jn; }
        ch.counters.gathered += u; ch.counters.unsold += u; if (a.res === 'god_ore') ch.counters.godore = 1; secretGather(act, seg.done);
      }
      const k0 = tierOf(ch.prof[a.res] || 0);
      ch.prof[a.res] = seg.count; ch.totals[act.skill] += seg.done; s.done += seg.done; s.xp += xp;
      for (let k = k0 + 1; k <= tierOf(seg.count); k++) tierUp(act, k, true, notes);
      addXp(act.skill, xp, true, notes);
    }
    checkProgress(true, notes);
  }
  ch.actions.forEach(a => a.prog = 0);
  bondTick(use, true, notes);
  petActions(Object.values(sum).reduce((t, x) => t + (x.done || 0), 0), true, notes);
  const autoGold = autoSellTick(true); if (autoGold) notes.push(`Auto-sold surplus for ${N(autoGold)} gold.`);
  dirty = true;
  addLog('sys', `While you were away (${fmtTime(use)}): progress applied.`);
  if (!show) return;
  modal(`<h2>While you were away</h2><p class="mute">Gone ${fmtTime(sec)}${sec > cap ? `, of which ${fmtTime(cap)} counted (offline cap ${d0.offlineH}h; raise it at the Shop)` : ''}.</p>
    <div class="grid" style="margin:12px 0">${Object.entries(sum).map(([id, s]) => `<div class="row">${actIcon(ACT(id), 28)}<div><b>${N(s.units)} ${esc(ACT(id).name)}</b><div class="mute" style="font-size:14px">${N(s.done)} actions · +${N(s.xp)} XP</div></div></div>`).join('') || '<p class="mute">Nothing could run.</p>'}</div>
    ${stopped.length ? `<p class="bad">Stopped: ${esc(stopped.join(', '))}.</p>` : ''}
    ${ch.gold > gold0 + 0.5 ? `<p class="gold" style="margin:4px 0"><b>+${N(ch.gold - gold0)} gold</b> while you were away.</p>` : ''}
    ${ch.level > lv0 ? `<p class="ember"><b>+${ch.level - lv0} levels</b> · ${(ch.level - lv0) * BALANCE.level.statPointsPerLevel} stat points to spend</p>` : ''}
    ${notes.length ? `<details open><summary>${notes.length} milestones</summary><ul>${notes.slice(0, 40).map(n => `<li>${esc(n)}</li>`).join('')}</ul></details>` : ''}
    <div class="row" style="margin-top:12px"><button class="pri" data-act="close">Back to work</button></div>`);
}

// ---------- Milestone ----------
function nextMilestone() {
  let best = null; const cand = (label, eta) => { if (eta > 0 && isFinite(eta) && (!best || eta < best.eta)) best = { label, eta }; };
  const skills = new Set();
  for (const a of ch.actions) {
    const act = ACT(a.res), c = ch.prof[a.res] || 0, k = tierOf(c), d = D(act.skill); skills.add(act.skill);
    if (k < 9) cand(`${act.name} ${BALANCE.tierNames[k + 1]}`, (BALANCE.tierThresholds[k + 1] - c) * actionSec(act, c, d.speed));
    if (act.kind === 'gather' && c < BALANCE.unlockAt) { const nx = CHAIN[act.skill][act.index]; if (nx && !isUnlocked(ch, nx)) cand(`Unlock ${nx.name}`, (BALANCE.unlockAt - c) * actionSec(act, c, d.speed)); }
  }
  let total = 0;
  for (const s of skills) {
    const r = rate[s] || { xp: 0, comp: 0 }; total += r.xp;
    const L = levelFromXp(ch.skills[s].xp); if (r.xp > 0.01 && L.need) cand(`${SKILLS[s].name} level ${L.level + 1}`, (L.need - L.into) / r.xp);
    const line = SKILL_TITLES[s].line.find(l => ch.totals[s] < l[0]); if (line && r.comp > 0.01) cand(`Title: ${line[1]}`, (line[0] - ch.totals[s]) / r.comp);
  }
  const C = levelFromXp(ch.xp); if (total > 0.01 && C.need) cand(`Level ${C.level + 1}`, (C.need - C.into) / (total * BALANCE.level.charXpShare));
  return best;
}

// ============================================================
// WORLD STATE — location, combat, exploration, travel, events, quests (Phase 4)
// ============================================================
const regionOfBand = b => REGIONS[b];

function cantStart(a) {
  if (a.kind === 'gather' && !availableHere(a)) return ch.travel ? `You can't start new gathering while travelling.` : `${a.name} is only found in ${REGIONS[a.band].name}.`;
  if (a.kind === 'combat') {
    if (ch.travel) return `You are on the road.`;
    if (a.region !== ch.loc) return `${a.name} lives in ${REGION_BY[a.region].name}.`;

let soc = { me: undefined, friends: [], blocked: [], mail: 0, trades: 0, globalLast: 0, err: '', mailList: null, tradeList: null, chan: 'global', msgs: {}, busy: false, sel: null, gift: null, offer: null, lastTick: 0 };

// ---------- Polling ----------
async function socRefresh() {
  if (!socOn()) return;

    const s = await rpc('tf_social');
    soc.me = s.me; soc.friends = s.friends || []; soc.blocked = s.blocked || []; soc.mail = s.mail || 0; soc.trades = s.trades || 0; soc.globalLast = s.global_last || 0; soc.err = '';

  try {

    if (r && r.length) { list.push(...r.filter(m => !list.some(x => x.id === m.id))); if (list.length > 200) list.splice(0, list.length - 200); chatPaint(true); }
