<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thousandfold v0.13</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
/* VOICE   occasion: a game, dark-fantasy, readable like a ledger kept by lamplight
   IDEA    a miner's tally book: ruled rows, stamped tier marks, a lamp glow on what is running
   PICTURE the live game itself; a lit cliff face of ore seams on the title screen
   COLOUR  soot ground, parchment ink, ember red-orange accent, verdigris support, gold for coin
   TYPE    IM Fell English SC for headings + Alegreya Sans for text and numbers
   LAYOUT  laptop: nav | play area | actions + log; phone: top bar, nav strip, actions, play area, log */
:root{color-scheme:light dark;
--bg:light-dark(#f3ece3,#14100e);--panel:light-dark(#fffaf3,#1d1613);--panel2:light-dark(#ece2d5,#271e1a);
--line:light-dark(#d8c9b7,#3a2d27);--ink:light-dark(#22180f,#f0e5d6);--mute:light-dark(#6a594b,#b3a291);
--ember:light-dark(#c13d16,#ff6b3d);--ember2:light-dark(#e2774d,#ffad87);--verd:light-dark(#1d7a66,#5cc0a8);
--gold:light-dark(#8f6200,#f0c75e);--bad:light-dark(#b3261e,#ff7b72);--glow:light-dark(rgba(193,61,22,.12),rgba(255,107,61,.16))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Alegreya Sans',system-ui,sans-serif;overflow-x:clip}
body.large{font-size:18px}
h1,h2,h3,.fell{font-family:'IM Fell English SC',Georgia,serif;font-weight:400;letter-spacing:-.01em;line-height:1.05;margin:0}
h1{font-size:clamp(40px,7vw,72px)}h2{font-size:30px}h3{font-size:21px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 14px;min-height:40px}
button:hover{border-color:var(--ember2)}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--ember);border-color:var(--ember);color:#fff;font-weight:700}
button.pri:hover{filter:brightness(1.08)}
button.ghost{background:transparent}
button.sm{min-height:32px;padding:4px 10px;font-size:14px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:16px;min-height:44px}
.mute{color:var(--mute)}.bad{color:var(--bad)}.gold{color:var(--gold)}.ember{color:var(--ember)}.verd{color:var(--verd)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:14px;background:var(--panel2);white-space:nowrap}
.chip.on{border-color:var(--ember);background:var(--glow)}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ember),var(--ember2));border-radius:99px}
.bar.xp>i{background:linear-gradient(90deg,var(--verd),color-mix(in srgb,var(--verd) 60%,#fff))}
.bar.flow>i{width:100%!important;background:repeating-linear-gradient(110deg,var(--ember) 0 14px,var(--ember2) 14px 28px);background-size:60px 100%;animation:flow .6s linear infinite}
@keyframes flow{to{background-position:60px 0}}
.tier{font-family:'IM Fell English SC',serif;font-size:14px;border:1px solid currentColor;border-radius:6px;padding:0 7px;white-space:nowrap}
.t7{color:var(--verd)}.t10{color:var(--gold);box-shadow:0 0 12px color-mix(in srgb,var(--gold) 50%,transparent)}
.ico{width:34px;height:34px;flex:none}
.grid{display:grid;gap:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}

/* ----- phase 3 ----- */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ember);box-shadow:0 0 8px var(--ember);vertical-align:middle}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px;margin-top:8px}
.eslot{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:14px}
.eslot .ico{width:28px;height:28px}.eico{width:28px;height:28px;border:1px dashed var(--line);border-radius:6px}
.recipe{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px}
.recipe.running{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember),0 0 24px var(--glow)}.recipe.locked{opacity:.6}
.recipe .chip{font-size:13px;padding:2px 8px}.recipe .chip .ico{width:18px;height:18px}
.chip.short{border-color:var(--bad);color:var(--bad)}
.ract{align-self:center}
/* ----- phase 4 ----- */
.mapwrap{border:1px solid var(--line);border-radius:14px;overflow-x:auto;overflow-y:hidden;margin-top:14px;background:var(--panel)}
.worldmap{display:block;width:100%;min-width:620px;height:auto}
.worldmap .mg0{stop-color:light-dark(#efe3d2,#2a1f1a)}.worldmap .mg1{stop-color:light-dark(#e2d3be,#151010)}
.worldmap .route{stroke:var(--mute);stroke-width:2.5;stroke-dasharray:6 6}.worldmap .route.dim{opacity:.25}
.worldmap .rmin{font-size:12px;fill:var(--mute);text-anchor:middle;paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.worldmap .node{cursor:pointer}.worldmap .node circle{fill:var(--panel2);stroke:var(--line);stroke-width:2}
.worldmap .node.known circle{fill:color-mix(in srgb,var(--verd) 30%,var(--panel2));stroke:var(--verd)}
.worldmap .node.near circle{stroke:var(--ink)}.worldmap .node.fog{opacity:.5}.worldmap .node.sealed{opacity:.55}
.worldmap .node.here circle{fill:var(--ember);stroke:var(--ember2);stroke-width:3}
.worldmap .node.sel circle{stroke:var(--gold);stroke-width:4}
.worldmap .node.to circle{stroke:var(--gold);stroke-dasharray:4 3}
.worldmap .nlv{font-size:14px;font-weight:700;text-anchor:middle;fill:var(--ink)}.worldmap .node.here .nlv{fill:#fff}
.worldmap .nname{font-family:'IM Fell English SC',Georgia,serif;font-size:17px;text-anchor:middle;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.worldmap .nreq{font-size:12px;text-anchor:middle;fill:var(--bad);paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.worldmap .node:focus-visible circle{stroke:var(--ember);stroke-width:4}
#traveller{fill:var(--gold);stroke:#000;stroke-width:2}
.area{display:grid;gap:2px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}.area.shut{opacity:.6;border-style:dashed}
.enemy.boss{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.enemy.running{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember),0 0 24px var(--glow)}
.enemy .chip{font-size:13px;padding:2px 8px}
.hpbar>i{background:linear-gradient(90deg,#c0392b,#e8664f)}
.ehp>i{background:linear-gradient(90deg,#6b2a8a,#a855d6)}
.qtrack{display:grid;gap:4px;text-align:left;padding:10px;width:100%}
.quest.cur{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember)}.quest.todo{opacity:.55}.quest.done{opacity:.8}
.clog div{padding:2px 0;border-bottom:1px dotted var(--line)}
/* ----- phase 5 ----- */
.tierpath{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.tierbox{display:grid;gap:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);align-content:start}
.tierbox.done{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--panel))}.tierbox.next{border-color:var(--ember);border-style:dashed}
.qstep{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.qstep>span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;border:1px solid var(--line)}
.qstep.done{opacity:.7}.qstep.done>span{background:var(--verd);color:#fff;border-color:var(--verd)}.qstep.cur{border-color:var(--ember)}.qstep.cur>span{border-color:var(--ember);color:var(--ember)}
.qstep .bar{margin-top:4px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.tnode{display:grid;gap:6px;align-content:start}.tnode.has{border-color:var(--verd)}.tnode.active{border-left:4px solid var(--ember)}.tnode.cap{border-left:4px solid var(--gold)}
.cres>i{background:linear-gradient(90deg,#d97706,#facc15)}
@media (max-width:640px){.tierpath{grid-template-columns:repeat(2,minmax(0,1fr))}}
.asell{gap:4px}.asell .chip{font-size:12px;padding:2px 8px;min-height:28px}
.shopgrp{margin:14px 0 6px;font-size:15px;color:var(--mute);font-weight:700}
.shoprow>.row{justify-content:flex-end}
.bond>i{background:linear-gradient(90deg,#be185d,#f472b6)}
.ego.running{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember)}
.offer.taken{opacity:.6}
.pnote{border-top:1px solid var(--line);padding:8px 0}.pnote summary{cursor:pointer}.pnote ul{margin:6px 0 0;padding-left:20px;font-size:15px}.pnote li{margin:3px 0}
/* ----- title / select / wizard ----- */
.screen{max-width:1180px;margin:0 auto;padding:clamp(16px,3vw,40px) max(16px,3vw)}
.hero{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);min-height:260px;display:grid;align-items:end;background:#120d0b}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .txt{position:relative;padding:24px;color:#f6ead9}
.hero .txt p{margin:6px 0 0;max-width:46ch;color:#e5d4bf}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px;margin-top:18px}
.slot{display:grid;gap:10px;align-content:start;min-height:190px}
.slot.empty{place-items:center;align-content:center;text-align:center;border-style:dashed;min-height:120px}
.portrait{width:64px;height:72px;flex:none}
.wz{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;margin-top:18px;align-items:start}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.steps span{font-size:14px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.steps span.on{color:var(--ink);border-color:var(--ember);background:var(--glow)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px}
.opt{text-align:left;display:grid;gap:4px;padding:12px;border-radius:10px;background:var(--panel);min-height:44px;align-content:start}
.opt.on{border-color:var(--ember);background:var(--glow);box-shadow:inset 0 0 0 1px var(--ember)}
.opt b{font-size:17px}.opt small{color:var(--mute);font-size:14px;line-height:1.35}
.opt.locked{opacity:.6}
.preview{position:sticky;top:16px}
.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-weight:700}
.err{color:var(--bad);font-size:14px;min-height:1.2em}

/* ----- game shell ----- */
.app{display:grid;grid-template-columns:200px minmax(0,1fr) 330px;grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"top top top" "nav main act" "nav main side";min-height:100%}
.top{grid-area:top;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px max(16px,1.5vw);border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.brand{font-family:'IM Fell English SC',serif;font-size:24px;color:var(--ember);margin-right:6px}
.cur{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:15px}
.milestone{margin-left:auto;display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:4px 10px;background:var(--panel2);font-size:14px;max-width:100%}
.milestone b{color:var(--gold);font-weight:700}
nav.side{grid-area:nav;border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px;background:var(--panel)}
nav.side button{text-align:left;border:0;background:transparent;padding:8px 12px;min-height:40px;border-radius:8px}
nav.side button.on{background:var(--glow);color:var(--ember);font-weight:700}
nav.side button.later{color:var(--mute);font-size:15px}
nav.side .sep{font-size:13px;color:var(--mute);padding:12px 12px 4px}
main{grid-area:main;padding:18px max(16px,1.6vw) 40px}
.act{grid-area:act;border-left:1px solid var(--line);padding:14px 14px 0;background:var(--panel)}
.sidepanel{grid-area:side;border-left:1px solid var(--line);padding:14px;background:var(--panel);display:grid;gap:14px;align-content:start}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{width:16px;height:16px;border-radius:4px;border:1px solid var(--ember);background:transparent}
.pips i.u{background:var(--ember)}
.aslot{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:var(--panel2)}
.aslot.vein{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 18px color-mix(in srgb,var(--gold) 35%,transparent)}
.aslot .meta{font-size:13px;color:var(--mute)}
.float{position:absolute;right:56px;top:6px;color:var(--gold);font-weight:700;pointer-events:none;animation:rise 1.1s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-26px)}}
.log{max-height:340px;overflow:auto;font-size:14px;display:grid;gap:2px}
.log div{padding:3px 0;border-bottom:1px dotted var(--line)}
.log .k-tier{color:var(--verd)}.log .k-lucky{color:var(--gold)}.log .k-level{color:var(--ember)}.log .k-sys{color:var(--mute)}
.ore{display:grid;gap:8px;position:relative}
.ore.running{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember),0 0 24px var(--glow)}
.ore.locked{opacity:.7}
.ore .head{display:flex;gap:10px;align-items:center}
.kv{display:grid;grid-template-columns:auto auto;justify-content:space-between;gap:2px 12px;font-size:14px}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.ptable{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:34px minmax(110px,1.3fr) 110px minmax(120px,1.4fr) 70px 70px 90px;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.prow.head{background:transparent;border:0;font-size:13px;color:var(--mute);padding-block:0}
.inv{display:grid;gap:6px}
.irow{display:grid;grid-template-columns:34px minmax(0,1fr) 80px 80px auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dotted var(--line)}
.srow .d{font-size:14px;color:var(--mute)}
.statbtns{display:flex;gap:4px}
.statbtns button{min-width:40px;padding:4px 8px}
.diff{font-size:14px}.up{color:var(--verd)}.down{color:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:30;width:min(340px,calc(100vw - 32px))}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ember);border-radius:10px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .25s ease-out}
.toast.gold{border-left-color:var(--gold)}.toast.verd{border-left-color:var(--verd)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.modal{position:fixed;inset:0;background:rgba(10,6,4,.6);display:grid;place-items:center;z-index:40;padding:16px}
.modal .card{max-width:560px;width:100%;max-height:90vh;overflow:auto}
.flash{position:fixed;inset:0;pointer-events:none;z-index:35;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--gold) 35%,transparent),transparent 60%);animation:fl .7s ease-out forwards}
@keyframes fl{to{opacity:0}}
.later{display:grid;gap:10px;max-width:640px}
.bottomline{font-size:13px;color:var(--mute);margin-top:18px}
.reduced *{animation:none!important;transition:none!important}
@media (max-width:1100px){.app{grid-template-columns:180px minmax(0,1fr) 290px}}
@media (max-width:900px){
 .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "nav" "act" "main" "side"}
 .top{position:static;gap:6px 12px}
 nav.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 8px;position:sticky;top:0;z-index:4}
 nav.side button{flex:none}nav.side .sep{display:none}nav.side button.later{display:none}
 .act,.sidepanel{border-left:0;border-bottom:1px solid var(--line)}
 .act{padding-bottom:12px}
 .milestone{margin-left:0;width:100%}
 .wz{grid-template-columns:minmax(0,1fr)}.preview{position:static;order:-1}
 .toasts{left:16px;right:16px;width:auto}.toast{padding:8px 10px;font-size:15px}.toast:nth-last-child(n+3){display:none}
}
@media (max-width:640px){
 .prow{grid-template-columns:34px minmax(0,1fr) auto}.prow .hide-s{display:none}.prow.head{display:none}
 .irow{grid-template-columns:34px minmax(0,1fr) auto}.irow .hide-s{display:none}.irow>.row{grid-column:1/-1}
 .recipe{grid-template-columns:34px minmax(0,1fr)}.ract{grid-column:1/-1}.ract button{width:100%}
 h2{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* Pets (Phase 8) */
.incubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.incub{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);text-align:center;min-height:120px;justify-content:center}
.incub.empty{border-style:dashed}
.petgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:8px}
.petcard{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:inherit;font:inherit;cursor:pointer}
.petcard>div{flex:1}
.petcard.slotted{border-color:var(--gold)}
.petcard.on{outline:2px solid var(--gold);background:var(--panel2)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.dexcell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:1px solid var(--line);border-radius:8px;text-align:center;font-size:13px}
.dexcell.unk{opacity:.55}
.collcard{text-align:left;color:inherit;font:inherit;cursor:pointer}
.collcard.on{border-color:var(--gold)}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:8px}

/* Discovery pop-ups (v0.9b) */
.modal.discover{z-index:60}
.discard{max-width:420px;text-align:center;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 40px rgba(255,200,90,.25)}
.disckind{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.discard h3{margin:4px 0 6px}
.discard p{margin:0}
.linkbtn{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline;cursor:pointer;font:inherit;min-height:0}

/* Leaderboards (Phase 9) */
.lbtable{display:grid;gap:4px}
.lbrow{display:grid;grid-template-columns:2.4em 1fr auto auto auto;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.lbrow.mine{border-color:var(--gold);background:var(--panel2)}
.lbrow.flag{opacity:.55}
.lbrank{color:var(--mute);text-align:right}
.lbrow:nth-child(-n+3) .lbrank{color:var(--gold);font-weight:700}
.lbname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Social (Phase 10) */
.odot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);opacity:.5;vertical-align:middle}
.odot.on{background:#5fd17a;opacity:1}
.chatbox{display:flex;flex-direction:column}
.chatlog{height:min(55vh,460px);overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
.cmsg{padding:6px 10px;border-radius:10px;background:var(--panel2);max-width:85%;align-self:flex-start;overflow-wrap:anywhere}
.cmsg.mine{align-self:flex-end;background:color-mix(in srgb,var(--ember) 18%,var(--panel2))}
.cname{font-weight:700}
.mailrow.new{border-color:var(--gold)}

/* Google sign-in (v0.11c) */
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:999px;padding:9px 18px;font:500 15px/1 'Alegreya Sans',system-ui,sans-serif;cursor:pointer;margin:6px 0 4px}
.gbtn:hover{background:#f5f5f5;border-color:#c6c6c6}
.orline{display:flex;align-items:center;gap:10px;max-width:360px;margin:10px 0 8px;color:var(--mute);font-size:13px}
.orline:before,.orline:after{content:'';flex:1;border-top:1px solid var(--line)}
.acctchip{max-width:min(60vw,280px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Auction House */
.ahgrid{display:grid;gap:3px}
.ahhead,.ahrow{display:grid;grid-template-columns:minmax(0,2.4fr) repeat(4,minmax(64px,1fr));gap:8px;align-items:center;padding:6px 10px}
.ahhead{font-size:13px;color:var(--mute)}
.ahrow{width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;min-height:40px}
.ahrow:hover,.ahrow.on{border-color:var(--gold)}
.ahname{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ahpanel{margin-bottom:12px;border-color:var(--gold)}
.ahbox{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2)}
.ahgrid .num,.ahhead .num{text-align:right}
@media (max-width:600px){.ahhead,.ahrow{grid-template-columns:minmax(0,2fr) repeat(2,minmax(56px,1fr))}.hide-s{display:none}}
.guestnote{border-left:3px solid var(--ember,#e0873a);background:color-mix(in srgb,var(--ember,#e0873a) 10%,transparent);padding:8px 10px;border-radius:6px;margin:6px 0}
.welcome .gbtn{width:100%;justify-content:center}
/* Secrets */
.card.secret{padding:12px 14px}
.card.secret.found{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.simtab{border-collapse:collapse;font-size:13px;width:100%;margin-top:8px}
.simtab th,.simtab td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.simtab th:first-child,.simtab td:first-child{text-align:left}

</style></head><body>

<script>

  { v: 'v0.13', date: '2026-11-25', title: 'Secrets', notes: [

  { v: 'v0.12b', date: '2026-11-24', title: 'Inventory upgrade prices', notes: [

  { v: 'v0.12', date: '2026-11-24', title: 'The Auction House', notes: [
    'New in Town: the Auction House. Buy from other players, list your own items for sale, or post a buy order for something you want.',

  { v: 'v0.11e', date: '2026-11-24', title: 'No more Lucky Strike flash', notes: [

  { v: 'v0.11d', date: '2026-11-24', title: 'Account button', notes: [

  { v: 'v0.11c', date: '2026-11-24', title: 'Sign in with Google', notes: [

  { v: 'v0.11b', date: '2026-11-24', title: 'Account tab and open names', notes: [

  { v: 'v0.11a', date: '2026-11-24', title: 'Game letters', notes: [

  { v: 'v0.11', date: '2026-11-24', title: 'Phase 10: Friends, chat, mail and trading', notes: [

  { v: 'v0.10c', date: '2026-11-24', title: 'The game has a website', notes: [

  { v: 'v0.10b', date: '2026-11-24', title: 'Clearer cloud message on the Claude link', notes: [

  { v: 'v0.10a', date: '2026-11-24', title: 'Thousandfold accounts go live', notes: [

  { v: 'v0.10', date: '2026-11-24', title: 'Phase 9: Accounts, cloud saves and leaderboards', notes: [
    'New Cloud save tab (Town). Sign in and your characters are saved to the cloud automatically every 5 minutes, or whenever you press Save to cloud now. On a new device, the game offers to load your newer cloud save.',

  { v: 'v0.9b', date: '2026-11-24', title: 'Short save codes and discovery pop-ups', notes: [

  { v: 'v0.9a', date: '2026-11-24', title: 'Crafting unlock fix', notes: [

  { v: 'v0.9', date: '2026-11-24', title: 'Phase 8: Pets', notes: [
    'New Pets tab. Eggs drop rarely from anything you do (online and offline), from region bosses (5%), weekly quests, some daily quests and a new "abandoned nest" region event. Common and Rare eggs are sold in the shop; Epic and Legendary eggs in the shard exchange.',

  { v: 'v0.8a', date: 'Nov 24', title: 'Patch notes and version', notes: [

  { v: 'v0.8', date: 'Nov 24', title: 'Phase 7: Quests, elixirs and training', notes: [
    'Quest boards in every town: 3 dailies (reset at midnight) and 2 weeklies (reset Monday). Hold up to 6. Rewards: gold, Ember Shards and elixirs.',

  { v: 'v0.7', date: 'Nov 24', title: 'Phase 6: Companions, sentient and growth weapons', notes: [

// ============================================================
// BALANCE CONFIG — every tunable number lives here.
// ============================================================
const BALANCE = {
  tickMs: 100,                 // internal engine step
  minActionSec: 0.1,           // hard floor
  uiHz: 4,                     // number refreshes per second
  logFlushMs: 1000,            // aggregate log lines once per second
  autosaveMs: 30000,

  // Proficiency tiers (completions needed to reach T1..T10)

  stoneTierTimes: [4, 2, 1, 0.5, 0.25, 0.1],
  unlockAt: 1000,              // completions of resource N needed to unlock resource N+1 (~10 min early on)
  speedBonusCap: 0.5,          // tools + AGI + buffs, total

  // Gathering chain generation. xpGrowth is derived: level.g^levelStep / chainHoursGrowth,
  // so every chain paces like the ore chain (each step takes a little longer than the last).
  chainHoursGrowth: 1.08, maxReq: 97,
  chains: {
    mining:      { start: 4, end: 12, flatUntil: 5, valueGrowth: 1.7,  staminaEvery: 10 },
    woodcutting: { start: 3, end: 10, flatUntil: 4, valueGrowth: 1.75, staminaEvery: 10 },
    farming:     { start: 5, end: 14, flatUntil: 4, valueGrowth: 1.75, staminaEvery: 10 },

    herbalism:   { start: 3, end: 10, flatUntil: 4, valueGrowth: 1.75, staminaEvery: 10 },
    skinning:    { start: 5, end: 14, flatUntil: 3, valueGrowth: 2.2,  staminaEvery: 7 },
  },
  junkChance: 0.005,

  // Crafting
  craft: {
    baseTimeMin: 3, baseTimeMax: 10,      // base time scales with recipe level
    valueMult: 1.4, xpMult: 1.2,          // output value / xp vs. inputs
    extraChance: [0.25, 0.35, 0.45, 0.6], // T7..T10 chance of +50% output
    qualityNames: ['Crude', 'Normal', 'Fine', 'Superior', 'Masterwork'],
    qualityMult: [0.85, 1, 1.15, 1.3, 1.5],
    qualityCut: [0.15, 0.75, 0.95, 0.995], // cumulative roll thresholds
    qualityTierShift: 0.03, qualityIntShift: 0.0005,
  },
  enchant: {
    success: [1, 1, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2], // chance to go from +N to +N+1
    dropFrom: 5,             // failing at +5 or higher loses one level
    perPlus: 0.10,           // +10% item stats per level
    stoneFor: ['lesser_stone','lesser_stone','lesser_stone','greater_stone','greater_stone','greater_stone','grand_stone','grand_stone','grand_stone','mythic_stone'],
    goldCost: lvl => Math.round(50 * Math.pow(2.2, lvl)),
    wisBonus: 0.001,
  },
  food: { staminaCap: 3 },

  // Combat, travel, exploration (Phase 4)
  combat: {
    winAt: 0.0526, winK: 4,          // win chance = 1 / (1 + winAt * (rec/CP)^winK); 95% at CP = rec
    recNormal: 0.85, recHidden: 1.0, recBoss: 1.15, recTutorialBoss: 0.75, // enemy recommended power vs. a typical build of its level
    baseTime: 6, bossBase: 10, bossMinSec: 5,
    dpsFrac: 0.02,                   // enemy damage per second, as a share of a typical player's HP at that level
    dmgExp: 1.5, lossDmgMult: 2,
    regenFight: 0.01, regenIdle: 0.02, regenVitBonus: 0.002, // per second, share of max HP
    autoEatAt: 0.5, defeatHpFrac: 0.25,
    xpBase: 1.5, xpGrowth: 1.138, goldBase: 0.6, goldGrowth: 1.2, bossXp: 4, bossGold: 5,
    archetype: { str: 0.25, vit: 0.25, dex: 0.15 }, // stat-point split used to scale enemies
  },
  travel: { perAgi: 0.002, cap: 0.5, fastBase: 40, fastGrowth: 1.8, encountersPerMin: 0.25 },
  explore: { target: 150, baseTime: 6, perBand: 1, areaAt: [0, 0.35, 0.75], hiddenAt: 0.5, chestChance: 0.03 },
  events: { minMin: 10, maxMin: 25 },

  // Storage & economy
  storage: { invSlots: 100, invHalf: 0.5, invGrowth: 6, bankSlots: 30, invUp: 10, bankUp: 15, invCost: [5000, 40000, 250000, 1.5e6, 9e6], bankCost: [2000, 20000, 150000, 1e6, 6e6, 3.5e7] },
  market: { saturation: 2500, floor: 0.15, halfLifeH: 2, dailySwing: 0.06 },
  // Prices rise with your level so gold stays meaningful as gathering income grows (~1.21x per level).
  // Shop items grow by priceGrowth per level from level 1 (never below 1.5x their sell value); upgrades/fees use the same index.
  economy: { priceGrowth: 1.19, supplyGrowth: 1.04, autoSellKeep: [0, 100, 1000, 10000],
    // Potion price at level 1 = unit x power^exp x hours. Stronger tiers cost disproportionately more,
    // so cheaper tiers stay worth buying. Then the level index above applies.
    potionUnit: { yield: 40000, xp: 40000, proc: 1500000, luck: 1200000, skill: 15000 }, potionExp: 1.8,
    buyQty: [1, 10, 100, 1000] },
  // Ascension: at max level of your final class tier, reset character level to 1 and keep everything else.
  ascension: { needTier: 4, needLevel: 99, xp: 0.05, yield: 0.05, power: 0.03, shards: 10 },
  banker: { dailyRate: 0.01, cap: 5e6 },

  // Skill / character level curve: xp to go from L to L+1 = a * L^p * g^(L-1)
  level: { a: 60, p: 1.0, g: 1.17, max: 99, statPointsPerLevel: 20,
           skillPointsPerLevel: 1, skillPointsMilestone: 3, classGrowthPerLevel: 1, charXpShare: 0.4 },

  // Stat soft caps: [threshold, multiplier applied past it]
  softCaps: [[100, 0.75], [250, 0.5], [500, 0.25]],
  startStat: 10,
  maxCreationBonus: 2,

  // Stat effects (per effective point above the starting 10)
  fx: {
    agiSpeed: 0.001, agiSpeedCap: 0.30,
    strHeavyYield: 0.0015,
    luckStrikeBase: 0.01, luckStrike: 0.0004, luckTripleShare: 0.1,
    perBonusFind: 0.0005,
    wisXp: 0.002,
    charmDiscount: 0.001, charmDiscountCap: 0.25,
    luckDrop: 0.002,
  },

  // Stamina
  stamina: { base: 2, hardCap: 16, costPerTen: 1 },

  // Yield additive pool soft cap (+300%)
  yieldPoolSoftCap: 3.0, yieldPoolOverflow: 0.25,

  // Dopamine

function buildResources(B) {
  const out = [];
  for (const [skill, txt] of Object.entries(CHAIN_DEFS)) {
    const c = B.chains[skill], rows = txt.trim().split('\n').map(l => l.split('|')), n = rows.length;
    const step = (B.maxReq - 1) / (n - 1), xpGrowth = Math.pow(B.level.g, step) / B.chainHoursGrowth;
    rows.forEach(([name, color, flavor], k) => {
      const i = k + 1, id = slug(name).replace(/^hell_ore$/, 'hell_ore');
      const base = i <= c.flatUntil ? c.start : c.start + (c.end - c.start) * (i - c.flatUntil) / (n - c.flatUntil);
      out.push({ id: skill === 'mining' && name === 'Primordial Ore' ? 'primordial' : skill === 'mining' && name === 'Worldheart Ore' ? 'worldheart' : id,
        name, color, flavor, skill, index: i, chainLen: n,
        baseTime: Math.round(base * 100) / 100,
        stamina: 1 + Math.floor((i - 1) / c.staminaEvery),
        baseYield: 1,
        value: Math.max(1, Math.round(Math.pow(c.valueGrowth, i - 1))),
        xp: Math.round(Math.pow(xpGrowth, i - 1) * 10) / 10,
        reqLevel: Math.min(B.maxReq, Math.round(1 + (i - 1) * step)),
        band: skill === 'mining' ? ORE_REGIONS[k] : Math.min(7, Math.floor(k / n * 8)),
        region: REGION_BANDS[skill === 'mining' ? ORE_REGIONS[k] : Math.min(7, Math.floor(k / n * 8))],
        rarity: Math.min(5, Math.floor(k / n * 6)),
        type: 'resource',
      });
    });
  }
  for (const r of out) r.grandTitle = GRANDMASTER_TITLES[r.id] || (r.name + ' Grandmaster');
  return out;
}

// Derive recipe numbers and output values from inputs (dependency order is the order they were defined).
function finishContent(B, RES) {
  for (const it of Object.values(ITEMS)) if (it.type === 'potion') { const E = B.economy; it.cost = Math.max(10, Math.round(E.potionUnit[it.skill ? 'skill' : it.cat] * Math.pow(it.power, E.potionExp) * it.mins / 60)); if (it.shopOnly) it.value = Math.round(it.cost * 0.2); }
  const ref = {};
  for (const r of RES) ref[r.id] = { value: r.value, xp: r.xp, lvl: r.reqLevel };
  for (const [id, it] of Object.entries(ITEMS)) if (it.type === 'supply') ref[id] = { value: it.value, xp: 0.5, lvl: 1 };
  for (const rc of RECIPES) {
    let v = 0, x = 0, l = 1;
    for (const [i, q] of Object.entries(rc.inputs)) { const r = ref[i]; if (!r) throw new Error('Unknown input ' + i + ' in ' + rc.id); v += r.value * q; x += r.xp * q; l = Math.max(l, r.lvl); }
    rc.lvl = l; rc.xp = Math.round(x * B.craft.xpMult * 10) / 10 + 1;
    rc.baseTime = Math.round((B.craft.baseTimeMin + (B.craft.baseTimeMax - B.craft.baseTimeMin) * (l - 1) / 98) * 100) / 100;
    rc.stamina = 1 + Math.floor((l - 1) / 33);
    const outVal = Math.max(1, Math.ceil(v * B.craft.valueMult / rc.qty));
    const tgt = rc.gearOut ? GEAR[rc.out] : ITEMS[rc.out];
    tgt.value = tgt.value || outVal; tgt.lvl = tgt.lvl || l;
    // shop cost stays the designed base; the shop applies a floor of 1.5x value so buying to resell never pays
    if (tgt.type === 'food') { tgt.heal = Math.round(30 + l * 25 * (Object.keys(tgt.fx || {}).length ? 0.6 : 1)); if (!Object.keys(tgt.fx || {}).length) tgt.desc = `Heals ${tgt.heal} HP. Eaten automatically in combat when HP runs low.`; else tgt.desc += ` Heals ${tgt.heal} HP.`; }
    ref[rc.out] = { value: tgt.value, xp: rc.xp, lvl: l };
  }
  // Potions sell for at most half their level-1 shop price, so tiers stay in order and buying to resell never pays.
  for (const it of Object.values(ITEMS)) if (it.type === 'potion') it.value = Math.max(1, Math.min(it.value || 1, Math.round(it.cost * 0.5)));
}

// Career trees (one per skill) and the general tree.
function careerTree(s) {
  const N = SKILLS[s].name, combat = s === 'slaying', explore = s === 'exploration';
  if (s === 'beastmastery') return [[`Efficient ${N}`, 5, { petPower:.03 }], [`Swift ${N}`, 3, { eggFind:.10 }], [`Lucky ${N}`, 3, { luckStrike:.002 }], [`${N} Mastery`, 1, { petPower:.10 }, 'cap', `Needs ${N} level 50.`]];
  return [
    [`Efficient ${N}`, 5, combat ? { loot:.03 } : explore ? { explore:.03 } : { skillYield:{ [s]:.02 } }],
    [`Swift ${N}`, 3, combat ? { fightSpeed:.02 } : { skillSpeed:{ [s]:.02 } }],
    [`Lucky ${N}`, 3, combat ? { gold:.04 } : { skillLuck:{ [s]:.005 } }],
    [`${N} Mastery`, 1, combat ? { atk:.05, loot:.05 } : explore ? { explore:.10, travel:.05 } : { skillYield:{ [s]:.10 }, skillXp:{ [s]:.05 } }, 'cap', `Needs ${N} level 50.`],
  ];
}

    <div class="grid" style="margin:12px 0">${Object.entries(sum).map(([id, s]) => `<div class="row">${actIcon(ACT(id), 28)}<div><b>${N(s.units)} ${esc(ACT(id).name)}</b><div class="mute" style="font-size:14px">${N(s.done)} actions · +${N(s.xp)} XP</div></div></div>`).join('') || '<p class="mute">Nothing could run.</p>'}</div>

  if (!socOn()) return `<div class="card"><p style="margin:0">Sign in to your Thousandfold account first.</p><div class="row" style="margin-top:10px"><button class="pri" data-act="tab" data-arg="account">Go to Account</button></div></div>`;
  if (soc.me === undefined) { socRefresh(); return '<p class="mute">Loading…</p>'; }

function ago(t) { const s = (Date.now() - Date.parse(t)) / 1000; return s < 3600 ? Math.max(1, Math.round(s / 60)) + 'm ago' : s < 86400 ? Math.round(s / 3600) + 'h ago' : Math.round(s / 86400) + 'd ago'; }

// ---------- Items that may change hands ----------
function giftable(key) {
  const it = ITEM(key); if (!it || it.bind) return false;
  if (key.startsWith('g:')) { const b = GEAR[parseG(key).base]; if (!b || b.ego || b.growth) return false; }
  return !['quest', 'keepsake'].includes(it.type);
}
function acceptItem(key) { try { return !!ITEM(key) && giftable(key); } catch (e) { return false; } }
function haveOffer(o) { if ((o.gold || 0) > ch.gold) return 'Not enough gold.'; for (const [k, q] of Object.entries(o.items || {})) if ((ch.inv[k] || 0) < q) return `You don’t have ${N(q)} ${ITEM(k).name}.`; return ''; }
function takeOffer(o) { ch.gold -= o.gold || 0; for (const [k, q] of Object.entries(o.items || {})) takeItem(k, q); dirty = true; }
function giveOffer(o, why) {
  const got = [], lost = [];
  if (o.gold) { ch.gold += +o.gold; got.push(N(o.gold) + ' gold'); }
  for (const [k, q] of Object.entries(o.items || {})) { if (acceptItem(k)) { addItem(k, +q, true); got.push(`${N(q)} ${ITEM(k).name}`); } else lost.push(k); }
  if (lost.length) addLog('sys', `${lost.length} unknown item${lost.length > 1 ? 's' : ''} from ${why} could not be received.`);
  dirty = true; save(); return got.join(', ') || 'nothing';
}
const offerText = o => [o.gold ? N(o.gold) + ' gold' : '', ...Object.entries(o.items || {}).map(([k, q]) => { let n = k; try { n = ITEM(k).name; } catch (e) { } return `${N(q)} ${n}`; })].filter(Boolean).join(', ') || 'nothing';
function offerEditor(o, max, actPrefix) {
  const keys = Object.keys(ch.inv).filter(k => ch.inv[k] > 0 && giftable(k)).sort((a, b) => ITEM(a).name.localeCompare(ITEM(b).name));
  const chosen = Object.entries(o.items);
  return `<div class="row" style="gap:6px;align-items:center"><label class="mute" for="${actPrefix}gold" style="font-size:14px">Gold</label><input id="${actPrefix}gold" type="number" min="0" step="1" value="${o.gold || 0}" style="width:9em" data-act-input="${actPrefix}gold"><span class="mute" style="font-size:13px">of ${N(ch.gold)}</span></div>
    <div class="grid" style="gap:4px;margin-top:8px">${chosen.length ? chosen.map(([k, q]) => `<div class="prow"><span>${itemIcon(k, 18)} ${rname(k)} <span class="mute" style="font-size:12px">have ${N(ch.inv[k] || 0)}</span></span><span class="row" style="gap:4px"><input type="number" min="1" step="1" max="${ch.inv[k] || 1}" value="${q}" style="width:6em" data-offerq="${actPrefix}|${esc(k)}" aria-label="Quantity"><button class="sm ghost" data-act="${actPrefix}rm" data-arg="${esc(k)}">×</button></span></div>`).join('') : '<p class="mute" style="margin:0;font-size:14px">No items added.</p>'}</div>
    ${chosen.length < max ? `<div class="row" style="gap:6px;margin-top:8px"><select id="${actPrefix}pick" aria-label="Item to add" style="flex:1;min-width:0"><option value="">Add an item…</option>${keys.filter(k => !(k in o.items)).map(k => `<option value="${esc(k)}">${esc(ITEM(k).name)} (${N(ch.inv[k])})</option>`).join('')}</select><button class="sm" data-act="${actPrefix}add">Add</button></div>` : `<p class="mute" style="font-size:13px">Up to ${max} different items.</p>`}`;
}
function readOffer(prefix, o) {
  const g = document.getElementById(prefix + 'gold'); if (g) o.gold = Math.max(0, Math.floor(+g.value || 0));
  document.querySelectorAll(`[data-offerq^="${prefix}|"]`).forEach(el => { const k = el.dataset.offerq.slice(prefix.length + 1); o.items[k] = Math.max(1, Math.floor(+el.value || 1)); });
  return o;
}

// ---------- Trading ----------
async function tradeSync() {
  try { soc.tradeList = await rpc('tf_trade_list'); } catch (e) { soc.err = e.message; return; }
  account.escrow = account.escrow || {};
  for (const t of soc.tradeList) {
    const esc_ = account.escrow[t.id];
    if (t.status === 'open') {
      if (esc_ && !t.my_ok) { returnEscrow(t.id, 'The trade with ' + t.with_name + ' changed, so your items came back. Check it again.'); }
      continue;
    }
    if (t.settled && !esc_) continue;
    if (esc_ && esc_.cid !== ch.id) continue; // the character holding the escrow must be playing
    try {
      const r = await rpc('tf_trade_settle', { p_id: t.id });
      if (r.already && !esc_) continue;
      if (r.status === 'done') {
        if (!esc_) { addLog('sys', `Trade with ${t.with_name} finished, but your side was never put up on this device.`); continue; }
        delete account.escrow[t.id];
        const got = giveOffer(r.theirs, 'a trade');
        addLog('lucky', `Trade with ${t.with_name} complete. You received ${got}.`); toast(`<b>Trade complete</b> · received ${esc(got)}`, 'verd');
      } else if (esc_) returnEscrow(t.id, `Trade with ${t.with_name} was cancelled. Your items came back.`);
    } catch (e) { soc.err = e.message; }
  }
  save();
}
function returnEscrow(id, msg) {
  const e = account.escrow && account.escrow[id]; if (!e) return;
  const owner = account.slots.find(c => c && c.id === e.cid);
  if (owner && owner !== ch) { owner.gold += e.offer.gold || 0; for (const [k, q] of Object.entries(e.offer.items || {})) owner.inv[k] = (owner.inv[k] || 0) + q; }
  else { ch.gold += e.offer.gold || 0; for (const [k, q] of Object.entries(e.offer.items || {})) addItem(k, q, true); }
  delete account.escrow[id]; addLog('sys', msg); toast(esc(msg)); dirty = true; save();
}
function tabTrade() {
  const g = socGate(); if (g) return `<h2>Trades</h2>${g}`;
  if (soc.tradeList === null || soc.tradeList === undefined) { tradeSync().then(() => tab === 'trade' && renderMain()); return '<h2>Trades</h2><p class="mute">Loading…</p>'; }
  const list = soc.tradeList, t = list.find(x => x.id === soc.sel) || list.find(x => x.status === 'open');
  if (t && soc.sel !== t.id) { soc.sel = t.id; soc.offer = null; }
  if (t && t.status === 'open' && !soc.offer) soc.offer = { id: t.id, gold: +t.mine.gold || 0, items: Object.assign({}, t.mine.items) };
  const esc_ = t && account.escrow && account.escrow[t.id];
  const changed = t && soc.offer && JSON.stringify({ g: soc.offer.gold, i: soc.offer.items }) !== JSON.stringify({ g: +t.mine.gold || 0, i: t.mine.items });
  const pane = !t ? '<p class="mute">No trade open. Start one from your Friends list.</p>' : `<div class="card" style="margin-top:12px">
      <div class="spread"><h3>Trade with ${esc(t.with_name)}</h3><span class="chip ${t.status === 'done' ? 'on' : ''}">${t.status === 'open' ? (t.my_ok && t.their_ok ? 'Done' : t.my_ok ? 'You confirmed' : t.their_ok ? 'They confirmed' : 'Open') : t.status === 'done' ? 'Complete' : 'Cancelled'}</span></div>
      <p class="mute" style="font-size:13px;margin:4px 0 10px">How it’s kept fair: both offers are on the server, and any change to either offer cancels both confirmations. The trade happens only when you both confirm the same offers. While you’re confirmed, your side is set aside so you can’t spend it twice.</p>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));align-items:start">
        <div><h4 class="shopgrp">Your offer ${t.my_ok ? '<span class="verd">✓ confirmed</span>' : ''}</h4>${t.status === 'open' && !t.my_ok ? offerEditor(soc.offer, 8, 'tr') + `<div class="row" style="margin-top:8px"><button class="${changed ? 'pri' : ''}" data-act="trsave" ${changed ? '' : 'disabled'}>Update my offer</button></div>` : `<p>${esc(offerText(t.mine))}</p>`}</div>
        <div><h4 class="shopgrp">${esc(t.with_name)} offers ${t.their_ok ? '<span class="verd">✓ confirmed</span>' : ''}</h4><p>${esc(offerText(t.theirs))}</p></div>
      </div>
      <div class="err" id="trerr"></div>
      ${t.status === 'open' ? `<div class="row" style="margin-top:10px">${t.my_ok ? `<button data-act="trunconfirm" data-arg="${t.id}">Take back my confirmation</button>` : `<button class="pri" data-act="trconfirm" data-arg="${t.id}" ${changed ? 'disabled title="Update your offer first"' : ''}>Confirm this trade</button>`}<button class="ghost" data-act="trcancel" data-arg="${t.id}">Cancel trade</button><button class="sm" data-act="trrefresh">Refresh</button></div>`
        : t.status === 'done' && esc_ && esc_.cid !== ch.id ? `<p class="mute">Switch to ${esc((account.slots.find(c => c && c.id === esc_.cid) || {}).name || 'the character who confirmed')} to receive this trade.</p>` : ''}
    </div>`;
  return `<div class="spread"><h2>Trades</h2><button class="sm" data-act="trrefresh">Refresh</button></div>${errBox()}
    ${list.length ? `<div class="row" style="gap:6px;margin-top:10px">${list.map(x => `<button class="chip ${t && x.id === t.id ? 'on' : ''}" data-act="trsel" data-arg="${x.id}">${esc(x.with_name)} · ${x.status === 'open' ? 'open' : x.status === 'done' ? 'complete' : 'cancelled'}</button>`).join('')}</div>` : ''}${pane}`;
}

const socErr = (id, e) => { const el = document.getElementById(id); const m = (e && e.message) || String(e); if (el) el.textContent = m; else toast(esc(m)); };

  soccopy: async () => { try { await navigator.clipboard.writeText(soc.me.code); toast('Friend code copied.'); } catch (e) { toast('Your friend code is ' + esc(soc.me.code)); } },

  socaccept: async id => { try { await rpc('tf_friend_respond', { p_other: id, p_accept: true }); await socRefresh(); renderMain(); } catch (e) { toast(esc(e.message)); } },

  socblock: async id => { try { await rpc('tf_block', { p_other: id, p_on: true }); closeModal(); soc.msgs = {}; await socRefresh(); renderMain(); toast('Blocked. You won’t see their messages.'); } catch (e) { toast(esc(e.message)); } },
  socmore: id => { const f = soc.friends.find(x => x.id === id); modal(`<h3>${esc(f.name)}</h3><p class="mute">${esc(f.code)}</p><div class="row" style="margin-top:12px"><button data-act="socremove" data-arg="${id}">Remove friend</button><button data-act="socblock" data-arg="${id}">Block</button><button class="ghost" data-act="close">Close</button></div>`); },

  trconfirm: async id => {

});

// AUCTION HOUSE (Phase 11): listings, buy orders, price history.
// Every trade settles on the server; goods and gold arrive by Mailbox.

let ah = { browse: null, loading: false, sel: null, item: null, itemFor: null, mine: null, q: '', err: '', at: 0, busy: false };
const AH_TAX = 0.05;
const ahName = k => { try { return ITEM(k).name; } catch (e) { return k; } };
const ahKnown = k => { try { return acceptItem(k); } catch (e) { return false; } };

async function ahLoad(force) {
  if (ah.loading || (!force && ah.browse && Date.now() - ah.at < 30000)) return;
  ah.loading = true; ah.err = '';
  try {
    const [b, m] = await Promise.all([rpc('tf_ah_browse'), rpc('tf_ah_mine')]);
    ah.browse = (b || []).filter(r => ahKnown(r.item)); ah.mine = m || { listings: [], orders: [] }; ah.at = Date.now();
    if (ah.sel) await ahLoadItem(ah.sel);
  } catch (e) { ah.err = e.message || String(e); ah.browse = ah.browse || []; }
  ah.loading = false; if (screen === 'game' && tab === 'auction') renderMain();
}
async function ahLoadItem(k) {
  try { ah.item = await rpc('tf_ah_item', { p_item: k }); ah.itemFor = k; } catch (e) { ah.err = e.message || String(e); }
}

// A small price chart: daily average with the day's low–high range, and volume bars.
function ahChart(hist) {
  if (!hist || !hist.length) return '<p class="mute" style="font-size:14px;margin:6px 0">No sales in the last 14 days yet.</p>';
  const W = 520, H = 150, P = 30, n = hist.length, hi = Math.max(...hist.map(h => +h.high)), lo = Math.min(...hist.map(h => +h.low)), vmax = Math.max(...hist.map(h => +h.vol));
  const x = i => P + (n === 1 ? (W - 2 * P) / 2 : i * (W - 2 * P) / (n - 1)), y = v => hi === lo ? H / 2 : 12 + (H - 44) * (1 - (v - lo) / (hi - lo));
  const band = hist.map((h, i) => `${x(i)},${y(+h.high)}`).join(' ') + ' ' + hist.map((h, i) => `${x(i)},${y(+h.low)}`).reverse().join(' ');
  const line = hist.map((h, i) => `${x(i)},${y(+h.avg)}`).join(' ');
  const bars = hist.map((h, i) => `<rect x="${x(i) - 5}" y="${H - 22 - 18 * (+h.vol / vmax)}" width="10" height="${18 * (+h.vol / vmax)}" fill="var(--line)"><title>${N(+h.vol)} sold</title></rect>`).join('');
  const pts = hist.map((h, i) => `<circle cx="${x(i)}" cy="${y(+h.avg)}" r="3" fill="var(--gold)"><title>${new Date(h.day).toLocaleDateString()}: avg ${N(+h.avg)}g (${N(+h.low)}–${N(+h.high)}), ${N(+h.vol)} sold</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto" role="img" aria-label="Price history">
    <polygon points="${band}" fill="var(--gold)" opacity=".14"/>${bars}<polyline points="${line}" fill="none" stroke="var(--gold)" stroke-width="2"/>${pts}
    <text x="4" y="${y(hi) + 4}" font-size="11" fill="var(--mute)">${N(hi)}</text><text x="4" y="${y(lo) + 4}" font-size="11" fill="var(--mute)">${N(lo)}</text>
    <text x="${P}" y="${H - 4}" font-size="11" fill="var(--mute)">${new Date(hist[0].day).toLocaleDateString([], { month: 'short', day: 'numeric' })}</text>
    <text x="${W - P}" y="${H - 4}" font-size="11" fill="var(--mute)" text-anchor="end">${new Date(hist[n - 1].day).toLocaleDateString([], { month: 'short', day: 'numeric' })}</text></svg>`;
}

function tabAuction() {
  const g = socGate(); if (g) return `<h2>Auction House</h2>${g}`;
  if (!ah.browse && !ah.loading) ahLoad(true);
  const q = ah.q.trim().toLowerCase();
  let rows = (ah.browse || []).slice();
  if (q) {
    rows = rows.filter(r => ahName(r.item).toLowerCase().includes(q));
    const listed = new Set(rows.map(r => r.item));
    const extra = [...new Set([...Object.keys(ch.inv), ...RES.map(r => r.id), ...Object.keys(ITEMS)])].filter(k => !listed.has(k) && ahKnown(k) && ahName(k).toLowerCase().includes(q)).slice(0, 12);
    rows = rows.concat(extra.map(k => ({ item: k, empty: true })));
  }
  rows.sort((a, b) => (a.empty - b.empty) || ahName(a.item).localeCompare(ahName(b.item)));
  const bag = Object.keys(ch.inv).filter(k => ch.inv[k] > 0 && giftable(k)).sort((a, b) => ahName(a).localeCompare(ahName(b)));
  const list = !ah.browse ? '<p class="mute">Loading the market…</p>' : !rows.length ? `<p class="mute">${q ? 'Nothing matches.' : 'The market is empty. Be the first to list something!'}</p>`
    : `<div class="ahgrid"><div class="ahhead"><span>Item</span><span class="num">Lowest</span><span class="num hide-s">For sale</span><span class="num">Best bid</span><span class="num hide-s">Last sale</span></div>${rows.slice(0, 120).map(r => `<button class="ahrow ${ah.sel === r.item ? 'on' : ''}" data-act="ahsel" data-arg="${esc(r.item)}"><span class="ahname">${itemIcon(r.item, 20)} ${rname(r.item)}${ch.inv[r.item] ? ` <span class="mute" style="font-size:12px">(you have ${N(ch.inv[r.item])})</span>` : ''}</span><span class="num gold">${r.low ? N(+r.low) + 'g' : '–'}</span><span class="num hide-s">${+r.avail ? N(+r.avail) : '–'}</span><span class="num">${r.bid ? N(+r.bid) + 'g' : '–'}</span><span class="num hide-s mute">${r.last ? N(+r.last) + 'g' : '–'}</span></button>`).join('')}</div>`;
  const mine = ah.mine && (ah.mine.listings.length || ah.mine.orders.length) ? `<div class="card" style="margin-top:12px"><h3>Your listings and orders</h3><div class="grid" style="gap:6px;margin-top:8px">
      ${ah.mine.listings.map(l => `<div class="prow"><span>Selling ${N(+l.qty)} ${rname(l.item)} at <b class="gold">${N(+l.price)}g</b> <span class="mute" style="font-size:12px">ends ${ahEnds(l.ends)}</span></span><button class="sm ghost" data-act="ahcancell" data-arg="${l.id}">Cancel</button></div>`).join('')}
      ${ah.mine.orders.map(o => `<div class="prow"><span>Buying ${N(+o.qty)} ${rname(o.item)} at <b class="gold">${N(+o.price)}g</b> <span class="mute" style="font-size:12px">ends ${ahEnds(o.ends)}</span></span><button class="sm ghost" data-act="ahcancelo" data-arg="${o.id}">Cancel</button></div>`).join('')}</div>
      <p class="mute" style="font-size:12px;margin:8px 0 0">Cancelled or expired listings and orders return what's left through your Mailbox.</p></div>` : '';
  return `<div class="spread"><h2>Auction House</h2><span class="row" style="gap:6px"><span class="mute num" style="font-size:14px">Gold <b class="gold" data-live="gold"></b></span><button class="sm" data-act="ahrefresh" ${ah.loading ? 'disabled' : ''}>${ah.loading ? 'Loading…' : 'Refresh'}</button></span></div>
    <p class="mute" style="margin:4px 0 10px">Buy from other players, list your own items, or post a buy order. Purchases and sale proceeds arrive in your <button class="linkbtn" data-act="tab" data-arg="mail">Mailbox</button>. The Auction House keeps ${AH_TAX * 100}% of each sale. Listings and orders last 2 days.</p>
    ${ah.err ? `<p class="bad" style="font-size:14px">${esc(ah.err)}</p>` : ''}
    <div class="row" style="gap:6px;margin-bottom:10px"><input id="ahq" value="${esc(ah.q)}" placeholder="Search any item…" autocomplete="off" aria-label="Search items" style="flex:1;min-width:160px">
      <select id="ahbag" aria-label="Sell from your bag" style="max-width:260px"><option value="">Sell from your bag…</option>${bag.map(k => `<option value="${esc(k)}">${esc(ahName(k))} (${N(ch.inv[k])})</option>`).join('')}</select></div>
    ${ah.sel ? ahItemPanel(ah.sel) : ''}
    ${list}${mine}`;
}
const ahEnds = t => { const s = (Date.parse(t) - Date.now()) / 1000; return s <= 0 ? 'soon' : 'in ' + fmtTime(s); };

function ahItemPanel(k) {

        ${low ? `<div class="row" style="gap:6px;margin-top:8px;align-items:center"><label class="mute" style="font-size:13px" for="ahbq">Buy</label><input id="ahbq" type="number" min="1" step="1" value="1" style="width:6em"><label class="mute" style="font-size:13px" for="ahbm">up to</label><input id="ahbm" type="number" min="1" step="1" value="${+low.price}" style="width:7em"><span class="mute" style="font-size:13px">g each</span><button class="sm pri" data-act="ahbuy">Buy</button></div><div class="mute" id="ahbuycost" style="font-size:12px;margin-top:4px">${ahCostText(ls, 1, +low.price)}</div>` : ''}
        <h4 class="shopgrp" style="margin-top:12px">Wanted (buy orders)</h4>${os.length ? `<div class="grid" style="gap:3px">${os.slice(0, 8).map(o => `<div class="prow" style="padding:4px 8px"><span>${N(+o.qty)} × <b class="gold">${N(+o.price)}g</b>${o.mine ? ' <span class="chip" style="font-size:11px">yours</span>' : ''}</span>${o.mine ? `<button class="sm ghost" data-act="ahcancelo" data-arg="${o.id}">Cancel</button>` : have ? `<button class="sm" data-act="ahfill" data-arg="${o.id}|${Math.min(have, +o.qty)}">Sell ${N(Math.min(have, +o.qty))} for ${N(Math.floor(Math.min(have, +o.qty) * +o.price * (1 - AH_TAX)))}g</button>` : ''}</div>`).join('')}</div>` : '<p class="mute" style="font-size:14px;margin:4px 0">No buy orders yet.</p>'}</div>
    </div>

function updateLive() {

  for (const el of $$('[data-live]')) {
    const L0 = el.dataset.live, ci = L0.indexOf(':'), k = ci < 0 ? L0 : L0.slice(0, ci), arg = ci < 0 ? '' : L0.slice(ci + 1); let v = '';

      case 'lvl': v = levelLabel(ch); break;
      case 'slvl': v = ch.skills[arg].level; break;
      case 'inv': v = N(ch.inv[arg] || 0); break;
      case 'bank': v = N(ch.bank[arg] || 0); break;
      case 'slots': v = `${usedSlots()} / ${ch.invSlots}`; break;
      case 'next': { const c = ch.prof[arg] || 0, k2 = tierOf(c); v = k2 < 9 ? `${N(c)} / ${N(BALANCE.tierThresholds[k2 + 1])}` : N(c); break; }
      case 'time': { const a = ACT(arg); v = fmtTime(actionSec(a, ch.prof[arg] || 0, dOf(a.skill).speed)); break; }
      case 'can': v = N(craftable(ch, RECIPE[arg])); break;
      case 'streak': { const a = ch.actions.find(x => x.res === arg); v = a ? N(a.streak) : '0'; break; }
      case 'total': v = N(ch.totals[arg]); break;
      case 'xpline': { const L = levelFromXp(ch.xp); v = L.need ? `${N(L.into)} / ${N(L.need)} XP` : 'Max level'; break; }
      case 'sxpline': { const L = levelFromXp(ch.skills[arg].xp); v = L.need ? `${N(L.into)} / ${N(L.need)} XP` : 'Max level'; break; }
      case 'ms': { const m = nextMilestone(); v = m ? `${m.label} · ${fmtTime(m.eta)}` : (ch.actions.length ? 'Keep going' : 'Start an action'); break; }
      case 'pot': { const p = ch.potions[arg]; v = p && p.until > now ? fmtTime((p.until - now) / 1000) : ''; if (!v) dirty = true; break; }
      case 'price': { const pr = sellPrice(arg, now); v = (pr < 10 ? pr.toFixed(1) : N(Math.floor(pr))) + 'g'; break; }
      case 'savings': v = N(Math.floor(savingsNow(ch, now))); break;
      case 'clock': v = clockText(); break;

let lastT = 0, loopAcc = 0, lastLive = 0, lastSave = Date.now();
function frame(t) {

    else { loopAcc += dt; let s = 0; while (loopAcc >= BALANCE.tickMs && s < 60) { step(); loopAcc -= BALANCE.tickMs; s++; } if (s >= 60) loopAcc = 0; }
    const now = Date.now();

function tabPets() {
  const sl = supportSlots(ch), bl = ch.skills.beastmastery, lx = levelFromXp(bl.xp), eggs = Object.keys(ch.inv).filter(k => ITEM(k) && ITEM(k).type === 'egg');

function tabCollection() {

// ---------- Save codes (v0.9b: compact + compressed) ----------
const SAVE_DROP = { log: [], clog: [], snap: null, _petPower: 0 };
function compactAccount() {
  return JSON.stringify(account, function (k, v) {
    if (this && this.skills && Object.prototype.hasOwnProperty.call(SAVE_DROP, k)) return SAVE_DROP[k];
    if (typeof v === 'number' && !Number.isInteger(v) && Number.isFinite(v)) return Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 1000) / 1000;
    return v;
  });
}
const b64u = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64u = str => { const b = atob(str.replace(/-/g, '+').replace(/_/g, '/')); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
async function streamBytes(bytes, T) { return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(T)).arrayBuffer()); }
async function makeSaveCode() {
  const json = compactAccount();
  if (typeof CompressionStream === 'function') { try { return 'TF2.' + b64u(await streamBytes(new TextEncoder().encode(json), new CompressionStream('deflate-raw'))); } catch (e) { } }
  return btoa(unescape(encodeURIComponent(json)));
}
async function readSaveCode(code) {
  code = String(code || '').replace(/\s+/g, '');
  if (code.startsWith('TF2.')) return JSON.parse(new TextDecoder().decode(await streamBytes(unb64u(code.slice(4)), new DecompressionStream('deflate-raw'))));
  return JSON.parse(decodeURIComponent(escape(atob(code))));
}
